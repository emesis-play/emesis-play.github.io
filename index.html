function chargeRailgun(now){
  const g = GUNS.railgun;
  if(!canFireNow(now, g)) return; // still cooling down from the last shot
  if(player.ammo < (g.minPellets || 1)){
    // not enough ammo to even fire the minimum beam — don't pull back
    player.railCharging = false;
    player.railCharge = 0;
    player.railChargeBack = 0;
    return;
  }
  if(!player.railCharging){
    player.railCharging = true;
    player.railCharge = 0;
  }
  const gainPerFrame = (1000/60) / (g.chargeTimeMs || 1200);
  player.railCharge = Math.min(1, player.railCharge + gainPerFrame);
  player.railChargeBack = player.railCharge * (g.maxChargeBack || 22);
}

function releaseRailgun(now){
  const g = GUNS.railgun;
  const charge = player.railCharge || 0;
  player.railCharging = false;
  player.railChargeBack = 0;

  const minP = g.minPellets || 1;
  const FIXED_AMMO_COST = 2;

  // fire as long as we can afford the fixed cost —
  // pellet count still scales with charge, but ammo cost never does
  if(player.ammo >= FIXED_AMMO_COST){
    const desiredPellets = Math.max(minP, Math.round(charge * (g.maxPellets || 7)));
    const pellets = Math.max(minP, desiredPellets);
    consumeAmmo(FIXED_AMMO_COST);

    const angle = Math.atan2(mouse.y-player.y, mouse.x-player.x);
    const spacing = g.pelletSpacing || 6;
    const perpAngle = angle + Math.PI/2;
    const half = (pellets-1)/2;
    for(let i=0;i<pellets;i++){
      const offset = (i - half) * spacing;
      bullets.push({
        x: player.x + Math.cos(perpAngle)*offset,
        y: player.y + Math.sin(perpAngle)*offset,
        dx: Math.cos(angle) * g.bulletSpeed,
        dy: Math.sin(angle) * g.bulletSpeed,
        trail: [],
        isRailgun: true
      });
    }
    if(mpPartyCode && socket){
      socket.emit("bulletFired", { id: socket.id, x: player.x, y: player.y, dx: Math.cos(angle) * g.bulletSpeed, dy: Math.sin(angle) * g.bulletSpeed, rail: pellets, spacing: spacing });
    }
    player.lastShotTime = now;
    shootKick(g);
    if(flashOnShoot){
      spawnMuzzleFlash(angle, true);
      flashAlpha = 1;
    }
    ejectShell(angle, "railgun");
  }

  player.railCharge = 0;
}

const BLACKHOLE_ORBIT_DIR = 1; // 1 = clockwise, -1 = counterclockwise — shared by every pellet
const BLACKHOLE_STAGGER_MS = 90; // delay between each pellet starting its migration

function fireBlackHole(now){
  const g = GUNS.blackhole;
  if(!canFireNow(now, g)) return;
  if(!consumeAmmo(g.consumePerShot)) return;

  const targetX = mouse.x;
  const targetY = mouse.y;

  // queue every existing pellet to retarget one-by-one instead of all at once
  blackHoleBullets.forEach((p, idx)=>{
    if(p.remote) return; // never retarget other players' black holes
    p.pendingRetarget = {
      x: targetX,
      y: targetY,
      time: performance.now() + idx * BLACKHOLE_STAGGER_MS
    };
    if (p.dx === undefined) p.dx = 0;
    if (p.dy === undefined) p.dy = 0;
  });

  // spawn new pellets from the player in a spread, then let them curve into orbit
  const pellets = g.pellets || 5;
  const baseAngle = Math.atan2(targetY - player.y, targetX - player.x);

  // ===== SHOTGUN BLAST: normal bullets that fly straight and hit things (the black hole pellets below still do their thing) =====
  const sgPellets = 6;
  const sgSpread = 16 * Math.PI/180;
  for(let i=0;i<sgPellets;i++){
    const sa = baseAngle + (Math.random()*sgSpread*2 - sgSpread);
    addBullet(sa, GUNS.shotgun.bulletSpeed, GUNS.shotgun.damage);
  }
  const spreadRad = 22 * Math.PI/180;
  for(let i=0;i<pellets;i++){
    const startX = player.x + (Math.random()-0.5)*12;
    const startY = player.y + (Math.random()-0.5)*12;
    const ang = baseAngle + (Math.random()*spreadRad*2 - spreadRad);
    blackHoleBullets.push({
      x: startX,
      y: startY,
      dx: Math.cos(ang) * g.bulletSpeed,
      dy: Math.sin(ang) * g.bulletSpeed,
      targetX: targetX,
      targetY: targetY,
      state: "flying",
      pendingRetarget: null,
      orbitRadiusBase: 20 + Math.random()*25,      // orbit distance, varies per pellet
      orbitRadiusAmp: 8 + Math.random()*14,        // how far the radius drifts
      orbitRadiusPhase: Math.random()*Math.PI*2,
      orbitRadiusSpeed: 0.03 + Math.random()*0.035, // how fast the radius drifts
      orbitRadius: 0, // computed each frame once orbiting
      orbitAngle: 0,
      orbitAngularSpeed: 0.045 + Math.random()*0.025,
      orbitStart: 0
    });
  }

  player.lastShotTime = now;
  shootKick(g);
  if(flashOnShoot){
    spawnMuzzleFlash(Math.atan2(targetY-player.y, targetX-player.x), true);
    flashAlpha = 1;
  }
  ejectShell(Math.atan2(targetY-player.y, targetX-player.x), "shotgun");

  // let the other players see this black hole
  if(mpPartyCode && socket){
    const bhAngle = Math.atan2(targetY - player.y, targetX - player.x);
    socket.emit("bulletFired", {
      id: socket.id,
      x: player.x, y: player.y,
      dx: Math.cos(bhAngle) * g.bulletSpeed,
      dy: Math.sin(bhAngle) * g.bulletSpeed,
      bh: { tx: mpR(targetX), ty: mpR(targetY) }
    });
  }

  blackHoleBeams.push({
    x1: player.x,
    y1: player.y,
    x2: targetX,
    y2: targetY,
    life: 30,
    maxLife: 30,
    maxThickness: 6
  });
}

function updateBlackHoleBullets(){
  for(let i = blackHoleBullets.length - 1; i >= 0; i--){
    const p = blackHoleBullets[i];

    // handle staggered retarget: this pellet waits its turn before it starts migrating
    if(p.pendingRetarget && performance.now() >= p.pendingRetarget.time){
      p.state = "flying";
      p.targetX = p.pendingRetarget.x;
      p.targetY = p.pendingRetarget.y;
      p.pendingRetarget = null;
    }

    if(p.state === "flying"){
      const dx = p.targetX - p.x;
      const dy = p.targetY - p.y;
      const dist = Math.hypot(dx, dy) || 1;

      // steer: blend current velocity toward the direction of the target
      // slower turnRate = smoother, more gradual migration
      const desiredSpeed = GUNS.blackhole.bulletSpeed;
      const desiredVX = (dx/dist) * desiredSpeed;
      const desiredVY = (dy/dist) * desiredSpeed;
      const turnRate = 0.05;

      p.dx += (desiredVX - p.dx) * turnRate;
      p.dy += (desiredVY - p.dy) * turnRate;

      p.x += p.dx;
      p.y += p.dy;

      if(dist < p.orbitRadiusBase + 6){
        p.state = "orbiting";
        p.orbitCenterX = p.targetX;
        p.orbitCenterY = p.targetY;
        p.orbitAngle = Math.atan2(p.y - p.orbitCenterY, p.x - p.orbitCenterX);
        p.orbitStart = performance.now();
      }
    } else if(p.state === "orbiting"){
      p.orbitCenterX = p.targetX;
      p.orbitCenterY = p.targetY;

      p.orbitAngle += BLACKHOLE_ORBIT_DIR * p.orbitAngularSpeed;
      p.orbitRadiusPhase += p.orbitRadiusSpeed;

      // orbit distance smoothly drifts in and out over time
      p.orbitRadius = p.orbitRadiusBase + Math.sin(p.orbitRadiusPhase) * p.orbitRadiusAmp;

      const desiredX = p.orbitCenterX + Math.cos(p.orbitAngle) * p.orbitRadius;
      const desiredY = p.orbitCenterY + Math.sin(p.orbitAngle) * p.orbitRadius;

      // spring toward the ideal orbit position instead of snapping to it
      if (p.dx === undefined) p.dx = 0;
      if (p.dy === undefined) p.dy = 0;
      p.dx += (desiredX - p.x) * 0.25;
      p.dy += (desiredY - p.y) * 0.25;
      p.dx *= 0.75;
      p.dy *= 0.75;

      p.x += p.dx;
      p.y += p.dy;

      // spawn little particles nearby that get sucked into the hole
      if(Math.random() < 0.3){
        const spawnAngle = Math.random() * Math.PI * 2;
        const spawnDist = 40 + Math.random() * 30;
        blackHoleParticles.push({
          x: p.x + Math.cos(spawnAngle) * spawnDist,
          y: p.y + Math.sin(spawnAngle) * spawnDist,
          target: p,
          life: 40 + Math.random() * 20
        });
      }

      if(performance.now() - p.orbitStart > 5000){
        blackHoleBullets.splice(i, 1);
        continue;
      }
    }

    if(p.remote) continue; // other players' black holes are visual only on this machine
    let hitTarget = false;
    for(let ei = enemies.length - 1; ei >= 0; ei--){
      const e = enemies[ei];
      if(Math.hypot(p.x - e.x, p.y - e.y) < 15){
        if(isMultiplayerClient && e.id !== undefined){
          pendingLocalRemovals.enemies.add(e.id);
          socket.emit("killEnemy", { id: e.id });
        }
        if (e.fromTree) {
            if (e.aliveSound) e.aliveSound.pause();
            playSound("https://file.garden/Zfwe_2Ig9weivlFh/bloodtree_Creaturedeath.mp3");
        }
        enemies.splice(ei, 1);
        kills++;
        if (tree && tree.state === "alive") { tree.bar = 1; triggerTreeBarUp(); }
        killPop = 1;
        killPopColor = 1;
        for (let k = 0; k < 6; k++) {
          blood.push({
            x: e.x, y: e.y,
            dx: (Math.random() - 0.5) * 2,
            dy: (Math.random() - 0.5) * 2,
            life: 40
          });
        }
        playSound("https://file.garden/Zfwe_2Ig9weivlFh/bird%20death.wav");
        blackHoleBullets.splice(i, 1);
        hitTarget = true;
        break;
      }
    }
    if(!hitTarget){
      for(let bi2 = bossEnemies.length - 1; bi2 >= 0; bi2--){
        const be = bossEnemies[bi2];
        if(Math.hypot(p.x - be.x, p.y - be.y) < 15){
          if(isMultiplayerClient && be.id !== undefined){
            mpKilledBosses.add(be.id);
            socket.emit("killEnemy", { id: be.id });
          }
          bossEnemies.splice(bi2, 1);
          kills++;
          if (tree && tree.state === "alive") { tree.bar = 1; triggerTreeBarUp(); }
          killPop = 1;
          killPopColor = 1;
          for (let k = 0; k < 6; k++) {
            blood.push({
              x: be.x, y: be.y,
              dx: (Math.random() - 0.5) * 2,
              dy: (Math.random() - 0.5) * 2,
              life: 40
            });
          }
          playSound("https://file.garden/Zfwe_2Ig9weivlFh/bird%20death.wav");
          blackHoleBullets.splice(i, 1);
          break;
        }
      }
    }
  }
}

function updateBlackHoleParticles(){
  for(let i = blackHoleParticles.length - 1; i >= 0; i--){
    const particle = blackHoleParticles[i];

    // if its target hole is gone, remove the particle too
    if(!particle.target || blackHoleBullets.indexOf(particle.target) === -1){
      blackHoleParticles.splice(i, 1);
      continue;
    }

    const dx = particle.target.x - particle.x;
    const dy = particle.target.y - particle.y;
    const dist = Math.hypot(dx, dy) || 1;

    const pull = 0.15; // how fast it accelerates inward
    particle.x += (dx / dist) * Math.max(1, dist * pull);
    particle.y += (dy / dist) * Math.max(1, dist * pull);

    particle.life--;

    if(dist < 4 || particle.life <= 0){
      blackHoleParticles.splice(i, 1);
    }
  }
}

// ============================================================
// GRAVITY GUN
// Hold E / Space: nearby enemies get sucked in front of the gun.
// Let go: they're launched where you aim, bounce off the walls twice, then die.
// Enemies with a health bar (shooters, gugerbird, or everyone when Instakill is OFF)
// take damage on every wall hit instead.
// ============================================================
// ===== GRAVITY GUN SOUNDS =====
const GRAV_GRAB_SND  = "https://file.garden/Zfwe_2Ig9weivlFh/Gravitygun_Grab.wav";
const GRAV_HOLD_SND  = "https://file.garden/Zfwe_2Ig9weivlFh/Gravitygun_hold.wav";
const GRAV_SHOOT_SND = "https://file.garden/Zfwe_2Ig9weivlFh/Gravitygun_shoot.wav";
const GRAV_WALL_SND  = "https://file.garden/Zfwe_2Ig9weivlFh/enemy_hitwall.wav";
const GRAV_BEEP_SND  = "https://file.garden/Zfwe_2Ig9weivlFh/gravitygun_beaping.wav";
// fallback (only used until the gapless version has finished loading)
let gravHoldAudio = new Audio(GRAV_HOLD_SND);
gravHoldAudio.loop = true;

// gapless looping hold sound (Web Audio API)
const GRAV_CTX = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
let gravHoldBuf = null;
let gravHoldSrc = null;
if(GRAV_CTX){
  fetch(GRAV_HOLD_SND).then(r => r.arrayBuffer())
    .then(d => new Promise((res, rej) => GRAV_CTX.decodeAudioData(d, res, rej)))
    .then(buf => { gravHoldBuf = buf; })
    .catch(() => { gravHoldBuf = null; });
}
// let the fallback hold sound change pitch too
try { gravHoldAudio.preservesPitch = false; gravHoldAudio.mozPreservesPitch = false; gravHoldAudio.webkitPreservesPitch = false; } catch(e) {}

// gapless looping beeping sound (plays when you're holding the max amount)
let gravBeepBuf = null;
let gravBeepSrc = null;
let gravBeepFallback = new Audio(GRAV_BEEP_SND);
gravBeepFallback.loop = true;
if(GRAV_CTX){
  fetch(GRAV_BEEP_SND).then(r => r.arrayBuffer())
    .then(d => new Promise((res, rej) => GRAV_CTX.decodeAudioData(d, res, rej)))
    .then(buf => { gravBeepBuf = buf; })
    .catch(() => { gravBeepBuf = null; });
}

// rate: 1 = normal pitch, higher = more high pitched
function gravHoldStart(rate){
  if(rate === undefined) rate = 1;
  if(GRAV_CTX && gravHoldBuf){
    if(!gravHoldAudio.paused){ gravHoldAudio.pause(); try { gravHoldAudio.currentTime = 0; } catch(e) {} }
    if(!gravHoldSrc){
      if(GRAV_CTX.state === "suspended") GRAV_CTX.resume();
      gravHoldSrc = GRAV_CTX.createBufferSource();
      gravHoldSrc.buffer = gravHoldBuf;
      gravHoldSrc.loop = true;
      gravHoldSrc.connect(gravHoldGain);
      gravHoldSrc.playbackRate.value = rate;
      gravHoldSrc.start(0);
    } else {
      gravHoldSrc.playbackRate.setTargetAtTime(rate, GRAV_CTX.currentTime, 0.05);
    }
  } else {
    gravHoldAudio.playbackRate = rate;
    if(gravHoldAudio.paused) gravHoldAudio.play().catch(() => {});
  }
}
function gravHoldStop(){
  if(gravHoldSrc){ try { gravHoldSrc.stop(); } catch(e) {} gravHoldSrc = null; }
  if(!gravHoldAudio.paused){ gravHoldAudio.pause(); try { gravHoldAudio.currentTime = 0; } catch(e) {} }
}
function gravBeepStart(){
  if(GRAV_CTX && gravBeepBuf){
    if(!gravBeepFallback.paused){ gravBeepFallback.pause(); try { gravBeepFallback.currentTime = 0; } catch(e) {} }
    if(gravBeepSrc) return;
    if(GRAV_CTX.state === "suspended") GRAV_CTX.resume();
    gravBeepSrc = GRAV_CTX.createBufferSource();
    gravBeepSrc.buffer = gravBeepBuf;
    gravBeepSrc.loop = true;
    gravBeepSrc.connect(gravBeepGain);
    gravBeepSrc.start(0);
  } else if(gravBeepFallback.paused){
    gravBeepFallback.play().catch(() => {});
  }
}
function gravBeepStop(){
  if(gravBeepSrc){ try { gravBeepSrc.stop(); } catch(e) {} gravBeepSrc = null; }
  if(!gravBeepFallback.paused){ gravBeepFallback.pause(); try { gravBeepFallback.currentTime = 0; } catch(e) {} }
}
// ===== GRAVITY GUN VOLUME =====
// 1.0 = full volume, 0.6 = a little quieter, 0.3 = much quieter
const GRAV_VOLUME = 0.6;

// volume controls for the two looping sounds
const gravHoldGain = GRAV_CTX ? GRAV_CTX.createGain() : null;
const gravBeepGain = GRAV_CTX ? GRAV_CTX.createGain() : null;
if(GRAV_CTX){
  gravHoldGain.gain.value = GRAV_VOLUME;
  gravBeepGain.gain.value = GRAV_VOLUME;
  gravHoldGain.connect(GRAV_CTX.destination);
  gravBeepGain.connect(GRAV_CTX.destination);
}
gravHoldAudio.volume = GRAV_VOLUME;
gravBeepFallback.volume = GRAV_VOLUME;

// one-shot sounds (grab / shoot / wall hit) with the same volume
const gravOneShotBufs = {};
function gravLoadOneShot(url){
  if(!GRAV_CTX || gravOneShotBufs[url]) return;
  gravOneShotBufs[url] = "loading";
  fetch(url).then(r => r.arrayBuffer())
    .then(d => new Promise((res, rej) => GRAV_CTX.decodeAudioData(d, res, rej)))
    .then(buf => { gravOneShotBufs[url] = buf; })
    .catch(() => { gravOneShotBufs[url] = "failed"; });
}
gravLoadOneShot(GRAV_GRAB_SND);
gravLoadOneShot(GRAV_SHOOT_SND);
gravLoadOneShot(GRAV_WALL_SND);
function gravPlayOnce(url){
  const b = gravOneShotBufs[url];
  if(GRAV_CTX && b && b !== "loading" && b !== "failed"){
    if(GRAV_CTX.state === "suspended") GRAV_CTX.resume();
    const src = GRAV_CTX.createBufferSource();
    const gn = GRAV_CTX.createGain();
    gn.gain.value = GRAV_VOLUME;
    src.buffer = b;
    src.connect(gn);
    gn.connect(GRAV_CTX.destination);
    src.start(0);
    return;
  }
  const a = new Audio(url);
  a.volume = GRAV_VOLUME;
  a.play().catch(() => {});
}

let gravPrevHeld = 0;
// call every frame with how many enemies YOU are holding right now
function gravitySoundUpdate(myHeld){
  const playingNow = (gameState === "playing");
  // grab sound: plays when you pick up something new
  if(playingNow && myHeld > gravPrevHeld) gravPlayOnce(GRAV_GRAB_SND);
  gravPrevHeld = myHeld;
  // hold sound: loops while you're holding something
  const holdingNow = playingNow && myHeld > 0 && player && player.alive && player.gravityOn;
  if(holdingNow){
    const maxHeldSnd = (GUNS.gravitygun && GUNS.gravitygun.maxHeld) ? GUNS.gravitygun.maxHeld : 12;
    const fill = Math.min(1, myHeld / maxHeldSnd);
    gravHoldStart(1 + fill * 0.6);          // 1.0 = normal pitch, 1.6 = pitch at max enemies held
    if(myHeld >= maxHeldSnd) gravBeepStart();
    else gravBeepStop();
  } else {
    gravHoldStop();
    gravBeepStop();
  }
}

function gravityBounds(){
  if(openWorldMode && player){
    return { l: player.x - canvas.width/2, r: player.x + canvas.width/2, t: player.y - canvas.height/2, b: player.y + canvas.height/2 };
  }
  return { l: 0, r: canvas.width, t: 0, b: canvas.height };
}

function gravityRelease(e){
  e.gravity = false;
  delete e.gvx; delete e.gvy; delete e.gb; delete e.gBounces;
}

function gravityKill(e){
  if(e.fromTree){
    if(e.aliveSound) e.aliveSound.pause();
    playSound("https://file.garden/Zfwe_2Ig9weivlFh/bloodtree_Creaturedeath.mp3");
  }
  let i = enemies.indexOf(e);
  if(i !== -1) enemies.splice(i, 1);
  else { i = bossEnemies.indexOf(e); if(i !== -1) bossEnemies.splice(i, 1); }
  // launched by another player: they get the kill, not the host (the kills++ below cancels out)
  if(e.gOwner && socket && mpPartyCode && e.gOwner !== socket.id){ socket.emit("enemyState", { gkill: e.gOwner }); kills--; }
  kills++;
  if(tree && tree.state === "alive"){ tree.bar = 1; triggerTreeBarUp(); }
  killPop = 1;
  killPopColor = 1;
  spawnNewBlood(e.x, e.y, Math.atan2(e.gvy || 0, e.gvx || 0));
  for(let k = 0; k < (newblood ? 0 : 6); k++){
    blood.push({ x: e.x, y: e.y, dx: (Math.random() - 0.5) * 2, dy: (Math.random() - 0.5) * 2, life: 40 });
  }
  playSound("https://file.garden/Zfwe_2Ig9weivlFh/bird%20death.wav");
}

function gravityWallHit(e, g){
  e.gBounces++;
  const tough = (bossEnemies.indexOf(e) !== -1) || !instakillEnabled;   // has a health bar / Instakill is off

  // impact sparks + sound (sound is limited so a crowd doesn't spam it)
  for(let k = 0; k < 6; k++){
    blood.push({ x: e.x, y: e.y, dx: (Math.random() - 0.5) * 3, dy: (Math.random() - 0.5) * 3, life: 20 });
  }
  shake = Math.max(shake, 10);
  const nowS = performance.now();
  if(!window.gravHitSoundLast || nowS - window.gravHitSoundLast > 80){
    window.gravHitSoundLast = nowS;
    gravPlayOnce(GRAV_WALL_SND);
  }

  if(tough){
    if(e.maxHealth === undefined){ e.maxHealth = ENEMY_MAX_HEALTH; e.health = ENEMY_MAX_HEALTH; }
    e.health -= g.wallDamage;
    if(e.health <= 0){ gravityKill(e); return; }
    if(e.gBounces >= g.maxBounces) gravityRelease(e);   // survived: lands and goes back to normal
  } else if(e.gBounces >= g.maxBounces){
    gravityKill(e);
  }
}

// ===== GRAVITY GUN: MULTIPLAYER VERSION =====
// The host moves/launches the enemies for EVERY player. Clients just tell the host "I'm pulling" / "I launched".
const mpGravIn = {};   // host only: playerId -> { hold, launchReq, launchAim, gravityOn, gravityFill }

function mpMyGravId(){
  return (socket && mpPartyCode && socket.id) ? socket.id : "host";
}

function gravityBoundsAt(cx, cy){
  if(openWorldMode) return { l: cx - canvas.width/2, r: cx + canvas.width/2, t: cy - canvas.height/2, b: cy + canvas.height/2 };
  return { l: 0, r: canvas.width, t: 0, b: canvas.height };
}

// burst of * - + ^ particles when somebody launches (also shown on everyone else's screen)
function gravitySpawnBurst(x, y, aim, fromRemote){
  if(!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(aim)) return;
  if(!window.gravBurst) window.gravBurst = [];
  if(window.gravBurst.length > 150) return;
  const bchars = ["*", "-", "+", "^"];
  for(let i = 0; i < 22; i++){
    const ba = aim + (Math.random() - 0.5) * 1.2;
    const bs = 2 + Math.random() * 5;
    window.gravBurst.push({
      x: x, y: y,
      vx: Math.cos(ba) * bs, vy: Math.sin(ba) * bs,
      ch: bchars[Math.floor(Math.random() * bchars.length)],
      life: 30
    });
  }
  if(!fromRemote && socket && mpPartyCode){
    socket.emit("bulletFired", { id: socket.id, x: mpR(x), y: mpR(y), dx: 0, dy: 0, gvb: 1, a: Math.round(aim * 100) / 100 });
  }
}

function mpSendGravity(hold, launch, aim){
  if(socket && mpPartyCode){
    socket.emit("collectItem", { type: "gravity", pid: socket.id, hold: hold ? 1 : 0, launch: launch ? 1 : 0, aim: Math.round(aim * 1000) / 1000 });
  }
}

// one player's gravity gun for one tick (used by the host for itself and for every client)
function gravityTick(u, all, g){
  const st = u.st;
  const held = all.filter(e => e.gravity === "held" && e.gOwner === u.id);
  st.gravityFill = (u.holding && st.gravityOn) ? held.length / g.maxHeld : 0;
  const hx = u.x + Math.cos(u.aim) * g.holdDistance;
  const hy = u.y + Math.sin(u.aim) * g.holdDistance;

  if(u.holding && st.gravityOn){
    // ---- PULL ----
    all.forEach(e => {
      if(e.gravity || held.length >= g.maxHeld) return;
      if(Math.hypot(e.x - u.x, e.y - u.y) > g.pullRadius) return;
      let coneDiff = Math.atan2(e.y - u.y, e.x - u.x) - u.aim;
      coneDiff = Math.atan2(Math.sin(coneDiff), Math.cos(coneDiff));
      if(Math.abs(coneDiff) > g.coneDeg * Math.PI / 180) return;
      e.gravity = "held";
      e.gOwner = u.id;
      e.gOffA = Math.random() * Math.PI * 2;
      e.gOffR = Math.random() * 22;
      held.push(e);
    });
    held.forEach(e => {
      const tx = hx + Math.cos(e.gOffA) * e.gOffR;
      const ty = hy + Math.sin(e.gOffA) * e.gOffR;
      e.x += (tx - e.x) * 0.12;
      e.y += (ty - e.y) * 0.12;
    });
  } else {
    st.gravityOn = false;
    if(held.length){
      if(u.tryLaunch()){
        // ---- LAUNCH ----
        const bounds = gravityBoundsAt(u.x, u.y);
        const la = (u.launchAim !== undefined) ? u.launchAim : u.aim;
        held.forEach(e => {
          const a = la + (Math.random() - 0.5) * 0.1;
          e.gravity = "fly";
          e.gvx = Math.cos(a) * g.launchSpeed;
          e.gvy = Math.sin(a) * g.launchSpeed;
          e.gBounces = 0;
          e.gb = bounds;
        });
        u.onLaunch(hx, hy, la);
      } else {
        held.forEach(gravityRelease);
      }
    }
    if(u.clear) u.clear();
  }
}

// client side: tell the host when I start pulling / launch, and keep my own gun shake + ammo in sync
function updateGravityGunClient(){
  if(!player || !socket || !mpPartyCode) return;
  const g = GUNS.gravitygun;
  const aim = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const eq = player.alive && player.currentGunKey === "gravitygun" && !inCar && !mpDowned;
  const hold = eq && player.shootingHeld;
  let myHeld = 0;
  enemies.concat(bossEnemies).forEach(e => { if(e.gravity === "held" && e.gOwner === socket.id) myHeld++; });

  if(hold && !player.gravityOn){
    if(player.ammo >= g.launchAmmo || tutorialActive){
      player.gravityOn = true;
      mpSendGravity(true, false, aim);
    } else if(!player.gravityDry){
      player.gravityDry = true;
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/click.wav");
    }
  }
  if(!hold) player.gravityDry = false;
  player.gravityFill = (hold && player.gravityOn) ? myHeld / g.maxHeld : 0;
  gravitySoundUpdate(myHeld);

  if(!hold && player.gravityOn){
    player.gravityOn = false;
    let launched = false;
    if(eq && myHeld > 0 && consumeAmmo(g.launchAmmo)) launched = true;
    mpSendGravity(false, launched, aim);
    if(launched){
      gravPlayOnce(GRAV_SHOOT_SND);
      shootKick(g);
      if(flashOnShoot){ spawnMuzzleFlash(aim, true); flashAlpha = 1; }
      gravitySpawnBurst(player.x + Math.cos(aim) * g.holdDistance, player.y + Math.sin(aim) * g.holdDistance, aim);
    }
  }
}

function updateGravityGun(){
  if(!player) return;
  if(isMultiplayerClient){ updateGravityGunClient(); return; }
  const g = GUNS.gravitygun;
  const all = enemies.concat(bossEnemies);
  const users = [];

  // ---- me (host / single player) ----
  const myAim = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const myEq = player.alive && player.currentGunKey === "gravitygun" && !inCar && !mpDowned;
  const myHold = myEq && player.shootingHeld;
  if(myHold && !player.gravityOn){
    if(player.ammo >= g.launchAmmo || tutorialActive){
      player.gravityOn = true;
    } else if(!player.gravityDry){
      player.gravityDry = true;
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/click.wav");
    }
  }
  if(!myHold) player.gravityDry = false;
  users.push({
    id: mpMyGravId(), x: player.x, y: player.y, aim: myAim, holding: myHold, st: player,
    tryLaunch: () => myEq && consumeAmmo(g.launchAmmo),
    onLaunch: (hx, hy, la) => {
      gravPlayOnce(GRAV_SHOOT_SND);
      shootKick(g);
      if(flashOnShoot){ spawnMuzzleFlash(la, true); flashAlpha = 1; }
      gravitySpawnBurst(hx, hy, la);
    }
  });

  // ---- every other player (host only) ----
  if(mpPartyCode && mpIsHost){
    Object.keys(remotePlayers).forEach(pid => {
      const rp = remotePlayers[pid];
      const gi = mpGravIn[pid] || (mpGravIn[pid] = { hold: false, launchReq: false, gravityOn: false, gravityFill: 0 });
      const eq = !!rp.alive && rp.gunKey === "gravitygun" && !rp.car;
      const hold = eq && gi.hold;
      if(hold) gi.gravityOn = true;
      users.push({
        id: pid, x: rp.x, y: rp.y, aim: rp.aimAngle || 0, holding: hold, st: gi,
        launchAim: Number.isFinite(gi.launchAim) ? gi.launchAim : undefined,
        tryLaunch: () => eq && gi.launchReq,
        onLaunch: () => {},
        clear: () => { gi.launchReq = false; }
      });
    });
    Object.keys(mpGravIn).forEach(k => { if(!remotePlayers[k]) delete mpGravIn[k]; });
  }

  users.forEach(u => gravityTick(u, all, g));

  // grab + hold sounds for ME
  {
    const myId = mpMyGravId();
    let myHeldNow = 0;
    all.forEach(e => { if(e.gravity === "held" && e.gOwner === myId) myHeldNow++; });
    gravitySoundUpdate(myHeldNow);
  }

  // anything held by somebody who left / died / switched away just drops
  const ids = new Set(users.map(u => u.id));
  all.forEach(e => { if(e.gravity === "held" && !ids.has(e.gOwner)) gravityRelease(e); });

  // ---- FLYING: move launched enemies and bounce them off the walls ----
  all.forEach(e => {
    if(e.gravity !== "fly") return;
    e.x += e.gvx;
    e.y += e.gvy;
    const b = e.gb;
    let hit = false;
    if(e.x <= b.l){ e.x = b.l; e.gvx = Math.abs(e.gvx); hit = true; }
    else if(e.x >= b.r){ e.x = b.r; e.gvx = -Math.abs(e.gvx); hit = true; }
    if(e.y <= b.t){ e.y = b.t; e.gvy = Math.abs(e.gvy); hit = true; }
    else if(e.y >= b.b){ e.y = b.b; e.gvy = -Math.abs(e.gvy); hit = true; }
    if(hit) gravityWallHit(e, g);

    // ---- hitting another enemy kills it ----
    // (the launched enemy may have just died from the wall hit)
    if(enemies.indexOf(e) === -1 && bossEnemies.indexOf(e) === -1) return;
    const victims = [];
    all.forEach(o => {
      if(o === e || o.gravity) return;   // skip itself and anything held / flying
      if(Math.hypot(o.x - e.x, o.y - e.y) > 22) return;
      victims.push(o);
    });
    victims.forEach(o => {
      if(enemies.indexOf(o) === -1 && bossEnemies.indexOf(o) === -1) return;   // already dead
      const tough = (bossEnemies.indexOf(o) !== -1) || !instakillEnabled;
      if(tough){
        if(o.maxHealth === undefined){ o.maxHealth = ENEMY_MAX_HEALTH; o.health = ENEMY_MAX_HEALTH; }
        o.health -= g.wallDamage;
        if(o.health <= 0){ o.gOwner = e.gOwner; gravityKill(o); }
      } else {
        o.gOwner = e.gOwner;   // so the kill counts for whoever launched it
        gravityKill(o);
      }
    });
  });
}

function drawGravityGun(){
  if(!player) return;
  const g = GUNS.gravitygun;
  const all = enemies.concat(bossEnemies);
  const col = lightMode ? "0,0,0" : "255,255,255";
  ctx.save();
  ctx.lineWidth = 1;

  // streaks behind launched enemies
  ctx.strokeStyle = "rgba(" + col + ",0.5)";
  all.forEach(e => {
    if(e.gravity !== "fly" || e.gvx === undefined) return;
    ctx.beginPath();
    ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x - e.gvx * 2.5, e.y - e.gvy * 2.5);
    ctx.stroke();
  });

  // pull rings: mine + every other player who is pulling right now
  if(!window.gravRingP) window.gravRingP = {};
  const rings = [];
  if(player.alive && player.gravityOn && player.currentGunKey === "gravitygun"){
    rings.push({ key: "me", x: player.x, y: player.y, aim: Math.atan2(mouse.y - player.y, mouse.x - player.x) });
  }
  Object.keys(remotePlayers).forEach(id => {
    const rp = remotePlayers[id];
    if(rp.alive && rp.gg && rp.gunKey === "gravitygun" && !rp.car){
      rings.push({
        key: id,
        x: rp.displayX !== undefined ? rp.displayX : rp.x,
        y: rp.displayY !== undefined ? rp.displayY : rp.y,
        aim: rp.shownAim !== undefined ? rp.shownAim : (rp.aimAngle || 0)
      });
    }
  });
  const liveKeys = new Set(rings.map(r => r.key));
  Object.keys(window.gravRingP).forEach(k => { if(!liveKeys.has(k)) delete window.gravRingP[k]; });

  ctx.font = "14px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = lightMode ? "black" : "white";
  const chars = ["*", "-", "+", "^"];
  rings.forEach(r => {
    const hx = r.x + Math.cos(r.aim) * g.holdDistance;
    const hy = r.y + Math.sin(r.aim) * g.holdDistance;
    const gp = window.gravRingP[r.key] || (window.gravRingP[r.key] = []);
    if(gp.length < 16 && Math.random() < 0.3){
      const a = Math.random() * Math.PI * 2;
      gp.push({
        x: hx + Math.cos(a) * 55,
        y: hy + Math.sin(a) * 55,
        ch: chars[Math.floor(Math.random() * chars.length)],
        life: 40
      });
    }
    for(let i = gp.length - 1; i >= 0; i--){
      const p = gp[i];
      p.x += (hx - p.x) * 0.07;
      p.y += (hy - p.y) * 0.07;
      p.life--;
      if(p.life <= 0 || Math.hypot(hx - p.x, hy - p.y) < 6){ gp.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life / 20);
      ctx.fillText(p.ch, p.x, p.y);
    }
  });
  ctx.globalAlpha = 1;

  // launch burst particles flying outward (from anybody's launch)
  if(window.gravBurst && window.gravBurst.length){
    ctx.fillStyle = lightMode ? "black" : "white";
    for(let i = window.gravBurst.length - 1; i >= 0; i--){
      const p = window.gravBurst[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life--;
      if(p.life <= 0){ window.gravBurst.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life / 15);
      ctx.fillText(p.ch, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Shell ejection: spawn a small particle that flies off-screen slowly
function ejectShell(angle, type){
  // angle is direction of shot; ejected shells typically fly to the side and down
  // we'll eject to the "right" relative to muzzle: add PI/2 offset (randomized)
  const side = (Math.random() < 0.5) ? 1 : -1;
  const ejectAngle = angle + Math.PI/2 * side + (Math.random()-0.5)*0.6;
  const speed = (type === "shotgun") ? (2 + Math.random()*1.5) : (1 + Math.random()*1.4);
  const spin = (Math.random()-0.5)*0.4;
  shellCasings.push({
    x: player.x,
    y: player.y,
    dx: Math.cos(ejectAngle) * speed,
    dy: Math.sin(ejectAngle) * speed + 0.7, // slight drop
    life: 80 + Math.random()*40,
    spin: spin,
    rot: Math.random()*Math.PI*2,
    type: type
  });
}

function breakGunInHalf() {
  const gkey = player.currentGunKey;
  const gun = GUNS[gkey];

  // 🧱 Prevent breaking the default starting gun
  if (gkey === "pistol" || gkey === "default") {
    playSound("https://file.garden/Zfwe_2Ig9weivlFh/click.wav");
    return;
  }

  // Split glyph roughly in half
  const text = gun.glyph || "–";
  const mid = Math.floor(text.length / 2);
  const leftHalf = text.slice(0, mid);
  const rightHalf = text.slice(mid);

  // Spawn two “broken half” parts that fall away
  const baseAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const halves = [
    { glyph: leftHalf, dx: Math.cos(baseAngle - 0.4) * 2, dy: Math.sin(baseAngle - 0.4) * 2 },
    { glyph: rightHalf, dx: Math.cos(baseAngle + 0.4) * 2, dy: Math.sin(baseAngle + 0.4) * 2 }
  ];

  halves.forEach((h) => {
    shellCasings.push({
      x: player.x,
      y: player.y,
      dx: h.dx,
      dy: h.dy - 2,
      spin: (Math.random() - 0.5) * 0.3,
      rot: Math.random() * Math.PI * 2,
      life: 120,
      type: "brokenGun",
      glyph: h.glyph
    });
  });

  playSound("https://file.garden/Zfwe_2Ig9weivlFh/dropgun.wav");

  // Remove the gun from inventory to free up slot
  const idx = player.inventory.indexOf(gkey);
  if (idx !== -1) player.inventory.splice(idx, 1);

    player.currentGunKey = player.inventory[0];
  }
}

function findNearestPlayerPos(x, y){
  let best = null;
  let bestDist = Infinity;
  if(player.alive){
    best = { x: player.x, y: player.y };
    bestDist = Math.hypot(player.x - x, player.y - y);
  }
  for(const id in remotePlayers){
    const rp = remotePlayers[id];
    if(!rp.alive) continue;
    const d = Math.hypot(rp.x - x, rp.y - y);
    if(d < bestDist){ bestDist = d; best = rp; }
  }
  return best; // null if literally nobody is alive
}

    if(d < closestDist){ closestDist = d; closest = e; }

  bossEnemies.forEach(e=>{

  worms.forEach(w=>{

// ------------------------- 3D loading (three.js) -------------------------
function bossLoadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("could not load " + src));
    document.head.appendChild(s);
  });
}

function bossPreload(){
  if(b3d.loading || b3d.ready) return;
  b3d.loading = true; b3d.failed = false;
  const needThree  = window.THREE ? Promise.resolve() : bossLoadScript(THREE_URL);
  needThree
    .then(() => (window.THREE && window.THREE.OBJLoader) ? null : bossLoadScript(OBJ_LOADER_URL))
    .then(bossBuild3D)
    .catch(err => { console.warn("[boss] 3D unavailable, using fallback boss:", err); b3d.failed = true; b3d.loading = false; });
}

// if the model has no UVs, wrap the texture on with a simple box projection
function bossEnsureUVs(geo){
  if(geo.attributes.uv) return;
  if(!geo.attributes.normal) geo.computeVertexNormals();
  geo.computeBoundingBox();
  const bb = geo.boundingBox, sz = { x: bb.max.x-bb.min.x || 1, y: bb.max.y-bb.min.y || 1, z: bb.max.z-bb.min.z || 1 };
  const pos = geo.attributes.position, nor = geo.attributes.normal, uv = new Float32Array(pos.count * 2);
  for(let i = 0; i < pos.count; i++){
    const x = (pos.getX(i)-bb.min.x)/sz.x, y = (pos.getY(i)-bb.min.y)/sz.y, z = (pos.getZ(i)-bb.min.z)/sz.z;
    const ax = Math.abs(nor.getX(i)), ay = Math.abs(nor.getY(i)), az = Math.abs(nor.getZ(i));
    let u, v;
    if(ay >= ax && ay >= az){ u = x; v = z; } else if(ax >= az){ u = z; v = y; } else { u = x; v = y; }
    uv[i*2] = u * 2; uv[i*2+1] = v * 2;
  }
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
}

function bossBuild3D(){
  const T = window.THREE;
  const el = document.getElementById("bossCanvas");
  const renderer = new T.WebGLRenderer({ canvas: el, alpha: true, antialias: true });
  renderer.setPixelRatio(IS_MAC ? 1 : Math.min(2, window.devicePixelRatio || 1));
  renderer.setSize(800, 600, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = T.sRGBEncoding;

  // camera set up so that 1 unit at z=0 is exactly 1 canvas pixel
  const camera = new T.PerspectiveCamera(2 * Math.atan(300 / 800) * 180 / Math.PI, 800 / 600, 10, 4000);
  camera.position.set(0, 0, 800);
  const scene = new T.Scene();
  // no ambient light, so anything the sun doesn't hit stays pitch black
  const sun = new T.DirectionalLight(0xffffff, 1.15); sun.position.set(-250, 450, 600); scene.add(sun);
  // no rim light

  const tex = new T.TextureLoader().setCrossOrigin("anonymous").load(
    BOSS_TEXTURE_URL, undefined, undefined, () => console.warn("[boss] texture failed to load"));
  tex.flipY = true; tex.encoding = T.sRGBEncoding;
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  b3d.tex = tex;
  b3d.hurtTex = null;
  if(BOSS_HURT_TEXTURE_URL){
    const ht = new T.TextureLoader().setCrossOrigin("anonymous").load(
      BOSS_HURT_TEXTURE_URL, undefined, undefined, () => { console.warn("[boss] hurt texture failed to load"); b3d.hurtTex = null; });
    ht.flipY = true; ht.encoding = T.sRGBEncoding;
    ht.wrapS = ht.wrapT = T.RepeatWrapping;
    b3d.hurtTex = ht;
  }

  new T.OBJLoader().load(BOSS_MODEL_URL, obj => {
    const root = obj, mats = [];
    root.traverse(o => {
      if(o.isMesh){
        if(!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
        bossEnsureUVs(o.geometry);
        const m = new T.MeshBasicMaterial({ map: tex });
        m.skinning = !!o.isSkinnedMesh;
        o.material = m; o.frustumCulled = false; mats.push(m);
      }
    });
    const box = new T.Box3().setFromObject(root);
    const size = box.getSize(new T.Vector3()), center = box.getCenter(new T.Vector3());
    root.position.sub(center);
    const holder = new T.Group(); holder.add(root);
    holder.scale.setScalar(BOSS_PX / Math.max(size.x, size.y, size.z, 0.0001));
    holder.rotation.set(BOSS_MODEL_ROT.x, BOSS_MODEL_ROT.y, BOSS_MODEL_ROT.z);
    const pivot = new T.Group(); pivot.add(holder); scene.add(pivot);
    Object.assign(b3d, { renderer, scene, camera, pivot, holder, mats, el, ready: true, loading: false });
  }, undefined, err => {
    console.warn("[boss] model failed to load (CORS or bad URL?), using fallback boss:", err);
    b3d.failed = true; b3d.loading = false;
  });
}

// draws every frame from draw(): puts the 3D boss on the canvas BEHIND the 2D game
function renderBoss3D(){
  const el = b3d.el || (b3d.el = document.getElementById("bossCanvas"));
  const on = bossLayerOn();
  if(!on){
    if(b3d.shown){ el.style.display = "none"; canvas.classList.remove("bossLayer"); b3d.shown = false; }
    return;
  }
  if(!b3d.shown){ el.style.display = "block"; canvas.classList.add("bossLayer"); b3d.shown = true; }

  const dying = boss.state === "dying";
  const jx = (Math.random() - 0.5) * 80 * boss.hit, jy = (Math.random() - 0.5) * 80 * boss.hit;
  let s = 1 + 0.12 * boss.hit;
  let rz = (Math.random() - 0.5) * 0.7 * boss.hit;
  if(dying){ const p = boss.dyingT / 200; s *= 1 - 0.55 * p * p; rz += boss.dyingT * 0.012; }
  b3d.pivot.position.set(boss.x - 400 + jx, 300 - boss.y + jy, boss.z || 0);
  b3d.pivot.rotation.set(Math.sin(boss.t / 55) * 0.02, Math.sin(boss.t / 70) * 0.1, rz);
  b3d.pivot.scale.setScalar(s);

  const pulse = boss.phase === 2 ? 0.14 + 0.08 * Math.sin(boss.t / 6) : 0;
  b3d.mats.forEach(m => {
    const wantMap = (b3d.hurtTex && boss.hit > 0.05) ? b3d.hurtTex : b3d.tex;
    if(m.map !== wantMap){ m.map = wantMap; m.needsUpdate = true; }
    if(b3d.hurtTex) m.color.setRGB(1, 1 - pulse * 0.5, 1 - pulse * 0.5);
    else m.color.setRGB(1, 1 - 0.7 * boss.hit - pulse * 0.5, 1 - 0.8 * boss.hit - pulse * 0.5);
    if(dying){ m.color.multiplyScalar(Math.max(0, 1 - boss.dyingT / 170)); m.transparent = true; m.opacity = Math.max(0, 1 - Math.max(0, boss.dyingT - 140) / 60); }
    else if(m.transparent){ m.transparent = false; m.opacity = 1; }
  });
  b3d.renderer.render(b3d.scene, b3d.camera);

  // the whole 3D layer shakes along with the 2D screen shake
  if(gameState === "playing" && shake > 0 && cameraShakeEnabled)
    el.style.transform = "translate(" + ((Math.random() - 0.5) * shake) + "px," + ((Math.random() - 0.5) * shake) + "px)";
  else el.style.transform = "";
  el.style.background = lightMode ? "#eee" : (invertTimer > 0 ? "white" : "black");
}

// simple stand-in boss if the 3D model can't load (so the fight still works)
function drawBossFallback(){
  const jx = (Math.random() - 0.5) * 30 * boss.hit, jy = (Math.random() - 0.5) * 30 * boss.hit;
  ctx.save();
  ctx.translate(boss.x + jx, boss.y + jy);
  ctx.rotate(Math.sin(boss.t / 40) * 0.1 + (boss.state === "dying" ? boss.dyingT * 0.012 : 0));
  ctx.font = "300px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = boss.hit > 0.3 ? "#ff5533" : "#7a4a1e";
  ctx.globalAlpha = boss.state === "dying" ? Math.max(0, 1 - Math.max(0, boss.dyingT - 140) / 60) : 1;
  ctx.fillText("☠", 0, 0);
  ctx.restore();
}

// ------------------------- waves -------------------------
function spawnWaveEnemy(n){
  spawnEnemy();
  const e = enemies[enemies.length - 1];
  if(!e) return;
  const d = n > 10 ? 10 + (n - 10) * 0.35 : n;   // slower difficulty growth after wave 10
  e.speed = Math.min(2.1, 1.4 + d * 0.055) * (0.95 + Math.random() * 0.15);
  e.maxHealth = e.health = ENEMY_MAX_HEALTH * 1.05 + (d - 1) * 15;   // tougher each wave (matters when Instakill is OFF)
}

function spawnWaveShooter(n){
  const d = n > 10 ? 10 + (n - 10) * 0.35 : n;   // slower difficulty growth after wave 10
  const p = randomEnemySpawnPoint();
  // Gugerbird: from wave 4, each shooter slot has a 30% chance to be one (not during the boss fight)
  if(!boss.active && n >= 6 && Math.random() < 0.15 && !bossEnemies.some(b => b.gug)){
    const gugHp = 180 + n * 8;
    bossEnemies.push({ id: nextEnemyId++, x: p.x, y: p.y, speed: 0.45, lastShot: performance.now(),
                       fireDelay: 2800, health: gugHp, maxHealth: gugHp, gug: true, spin: 0 });
    return;
  }
  bossEnemies.push({ id: nextEnemyId++, x: p.x, y: p.y, speed: 0.8, lastShot: performance.now(),
                     fireDelay: Math.max(1100, 1900 - d * 80), health: BOSS_MAX_HEALTH, maxHealth: BOSS_MAX_HEALTH });
}

function wavesStart(n){
  wv.n = n; wv.t = 0;
  if(n % 10 === 0){ wv.state = "boss"; bossStart(n / 10); return; }
  wv.state = "active";
  const d = n > 10 ? 10 + (n - 10) * 0.35 : n;   // slower difficulty growth after wave 10
  wv.toSpawn = Math.floor((7 + d * 2.5) * (1 + 0.6 * Object.keys(remotePlayers).length));
  wv.toSpawnShooters = n >= 4 ? Math.floor(((d - 1) / 2) * mpEnemyMult()) : 0;
  wv.spawnEvery = Math.max(12, Math.round(Math.max(28, 72 - 5 * d) / mpEnemyMult()));
  const total = wv.toSpawn + wv.toSpawnShooters;
  wavesBanner("WAVE " + n, total + " enemies", 150);
  // ammo drops so every wave is winnable (each pickup = 5 ammo)
  for(let i = 0; i < Math.ceil(total / 5); i++){
    const p = randomPointInPlayableArea(40);
    pickups.push({ id: nextItemId++, x: p.x, y: p.y });
  }
}

// DEBUG: console.log("/skipwaves") then press Enter in-game -> jumps straight to the next boss wave
function wavesSkipToBoss(){
  if(!wavesActive() || gameState !== "playing" || !player || !player.alive) return;
  if(boss.active) return;
  const next = (Math.floor(wv.n / 10) + 1) * 10;
  enemies = []; bossEnemies = [];
  bullets = bullets.filter(b => !b.enemyBullet);
  wv.toSpawn = 0; wv.toSpawnShooters = 0; wv.bannerT = 0;
  wavesStart(next);
}

function wavesCleared(){
  wv.state = "intermission"; wv.timer = 220;
  player.health = Math.min(player.maxHealth || 100, player.health + 25);
  if((wv.n + 1) % 10 === 0){ wv.timer = 280; wavesBanner("WAVE " + wv.n + " CLEARED", "something is coming...", 150); }
  else wavesBanner("WAVE " + wv.n + " CLEARED", "", 110);
}

function updateWaves(){
  wv.t++;
  if(wv.bannerT > 0) wv.bannerT--;
  if(boss.active) bossUpdate();

  if(wv.state === "intermission"){
    if(--wv.timer <= 0) wavesStart(wv.n + 1);
  } else if(wv.state === "active"){
    if((wv.toSpawn > 0 || wv.toSpawnShooters > 0) && wv.t % wv.spawnEvery === 0){
      if(wv.toSpawnShooters > 0 && (wv.toSpawn === 0 || Math.random() < 0.2)){ spawnWaveShooter(wv.n); wv.toSpawnShooters--; }
      else { spawnWaveEnemy(wv.n); wv.toSpawn--; }
    }
    if(wv.toSpawn <= 0 && wv.toSpawnShooters <= 0 && enemies.length === 0 && bossEnemies.length === 0) wavesCleared();
  }
}

// ------------------------- the boss -------------------------
function bossStart(level){
  const dm = difficulty === "Easy" ? 0.7 : (difficulty === "Hard" ? 1.4 : 1);
  Object.assign(boss, { active: true, state: "descend", level, t: 0, hit: 0, phase: 1, attack: null, attackT: 0,
    cooldown: 150, lastAttack: "", label: "", dyingT: 0, trickle: 300, gapCol: -1, ammoT: 120, swordCd: 0, hitSnd: 0, row: 0,
    x: 400, y: -260, z: -500,
    mini: [] });
  enemies = []; bossEnemies = [];
  boss.maxHp = Math.round(BOSS_BASE_HP * dm * (1 + 0.6 * (level - 1)) * (1 + 0.8 * Object.keys(remotePlayers).length));
  cars = [];
  gunPickups = gunPickups.filter(g => g.gunKey !== "nuke");
  [pickups, gunPickups, healthKits, Magnetpickup].forEach(arr => arr.forEach(o => {
    if (o.y < canvas.height / 2) o.y = canvas.height / 2 + Math.random() * (canvas.height / 2 - 40);
  }));
  boss.hp = boss.maxHp;
  window.lastWormWarning = { text: "⚠ WAVE " + (level * 10) + " — SOMETHING IS COMING ⚠", t: performance.now(), duration: 3200 };
  playSound("https://file.garden/Zfwe_2Ig9weivlFh/tree_death_loud.mp3");
}

const BOSS_ROCKET_R   = 85;   // blast radius (the red circle on the ground is exactly this big)
const BOSS_ROCKET_DMG = 20;    // damage if you're inside the blast (player has 100 hp)
const bossRockets = [];        // rockets in flight
const bossBlasts  = [];        // explosions going off

function bossRocket(x, y, tx, ty){
  const ang = Math.atan2(ty - y, tx - x);
  const sp = 4.5;   // slower than the real rocket launcher
  bossRockets.push({ id: nextItemId++, x, y, tx, ty, ang, sp, dx: Math.cos(ang) * sp, dy: Math.sin(ang) * sp, t: 0 });
  playSound("https://file.garden/Zfwe_2Ig9weivlFh/rocket%20launcher%20shoot.wav");
}

function bossRocketsUpdate(){
  if(boss.state !== "fight"){ bossRockets.length = 0; bossBlasts.length = 0; return; }

  for(let i = bossRockets.length - 1; i >= 0; i--){
    const r = bossRockets[i];
    r.t++;
    r.x += r.dx; r.y += r.dy;
    if(r.t % 2 === 0) blood.push({ x: r.x - r.dx, y: r.y - r.dy, dx: (Math.random() - 0.5), dy: (Math.random() - 0.5), life: 14, char: "•", color: "gray" });

    // reached its spot: explode there
    if(Math.hypot(r.tx - r.x, r.ty - r.y) <= r.sp){
      bossRockets.splice(i, 1);
      bossBlasts.push({ id: nextItemId++, x: r.tx, y: r.ty, radius: 1, maxR: BOSS_ROCKET_R, speed: 6, life: Math.ceil(BOSS_ROCKET_R / 6), maxLife: Math.ceil(BOSS_ROCKET_R / 6), hit: false });
      shakeTime = Math.max(shakeTime, 30);
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/explotion.wav");
      for(let p = 0; p < 40; p++){
        blood.push({ x: r.tx, y: r.ty, dx: (Math.random() - 0.5) * 10, dy: (Math.random() - 0.5) * 10, life: 40,
                     char: ["*", "✦", "•"][Math.floor(Math.random() * 3)], color: "orange" });
      }
    }
  }

  for(let i = bossBlasts.length - 1; i >= 0; i--){
    const b = bossBlasts[i];
    b.radius += b.speed;
    b.life--;
    if(!b.hit && player.alive && Math.hypot(playerHitX() - b.x, playerHitY() - b.y) < b.radius){
      b.hit = true;
      damagePlayer(BOSS_ROCKET_DMG);
    }
    if(b.life <= 0 || b.radius >= b.maxR) bossBlasts.splice(i, 1);
  }
}

function bossDrawRockets(){
  if(!boss.active || (!bossRockets.length && !bossBlasts.length)) return;
  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  bossRockets.forEach(r => {
    // landing marker: red circle + crosshair showing exactly where it will blow up
    const pulse = 0.5 + 0.5 * Math.sin(r.t / 4);
    ctx.strokeStyle = `rgba(255,60,30,${0.45 + 0.35 * pulse})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(r.tx, r.ty, BOSS_ROCKET_R, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(r.tx - 10, r.ty); ctx.lineTo(r.tx + 10, r.ty);
    ctx.moveTo(r.tx, r.ty - 10); ctx.lineTo(r.tx, r.ty + 10);
    ctx.stroke();

    // the rocket itself
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.ang);
    ctx.fillStyle = "orange";
    ctx.font = "bold 20px monospace";
    ctx.fillText("=>", 0, 0);
    ctx.restore();
  });

  bossBlasts.forEach(b => {
    const k = Math.max(0, b.life / b.maxLife);
    ctx.fillStyle = `rgba(255,120,0,${0.14 * k})`;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,140,0,${k})`;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.stroke();
  });

  ctx.restore();
}

function bossPickAttack(){
  const names = Object.keys(BOSS_ATTACKS).filter(k => k !== boss.lastAttack);
  if(boss.lastAttack !== "rain") names.push("rain", "rain", "rain");
  const k = names[Math.floor(Math.random() * names.length)];
  boss.attack = k; boss.lastAttack = k; boss.attackT = 0; boss.row = 0; boss.gapCol = -1; boss.gapV = undefined; boss.gapH = undefined;
  boss.attackLen = BOSS_ATTACKS[k].len * (boss.phase === 2 ? 1.15 : 1);
  boss.label = BOSS_ATTACKS[k].label;
  boss.rainWith = false;
  if(["volley", "sweep", "crossfire", "rockets"].includes(k) && Math.random() < 0.4){
    boss.rainWith = true;
    boss.gapCol = -1;
    boss.attackLen = Math.max(boss.attackLen, 800);
    boss.label += " + VINE WALL";
  }
}

// ---- little floating guns that shoot the boss's bullets ----
function bossMiniKey(){
  const keys = ["pistol", "uzi", "sniper", "shotgun"];
  return keys[Math.floor(Math.random() * keys.length)];
}
function bossMini(x, y, ang, warm, fire, size, key){
  if(!size){ if(fire) fire(x, y); return null; }
  const k = key || "sniper";
  const gl = (GUNS[k] && GUNS[k].glyph) || "–";
  ctx.save(); ctx.font = size + "px monospace";
  const reach = ctx.measureText(gl).width / 2;
  ctx.restore();
  const m = { x, y, ang, key: k, size, reach, t: 0, warm, fire, kick: 0, ph: Math.random() * 6.28 };
  boss.mini.push(m);
  return m;
}
function bossMiniUpdate(){
  if(boss.state !== "fight"){ boss.mini.length = 0; return; }
  for(let i = boss.mini.length - 1; i >= 0; i--){
    const m = boss.mini[i];
    m.t++;
    if(m.holdFor && boss.attack !== m.holdFor && m.warm > m.t){ m.warm = m.t; m.fire = null; }
    if(m.kick > 0) m.kick = Math.max(0, m.kick - 0.08);
    if(m.t === m.warm && m.fire){
      m.fire(m.x + Math.cos(m.ang) * m.reach, m.y + Math.sin(m.ang) * m.reach);
      m.kick = 1;
    }
    if(m.t > m.warm + 18) boss.mini.splice(i, 1);
  }
}

function bossLaunchEnemy(g, side){
  const x = g.x + Math.cos(g.ang) * g.reach;
  const y = g.y + Math.sin(g.ang) * g.reach;
  const a = g.ang + side * (0.2 + Math.random() * 0.5);
  const bird = egyptianBirds[Math.floor(Math.random() * egyptianBirds.length)];
  enemies.push({
    id: nextEnemyId++, x, y, speed: 1.2, bird,
    health: ENEMY_MAX_HEALTH, maxHealth: ENEMY_MAX_HEALTH,
    lx: Math.cos(a) * 9, ly: Math.sin(a) * 9, launchT: 22
  });
  playSound("https://file.garden/Zfwe_2Ig9weivlFh/spawn.wav");
  shake = Math.max(shake, 6);
}

function bossDrawGuns() {
  if (!boss || !boss.active || !boss.mini || !boss.mini.length) return;

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = lightMode ? "black" : "white";

  boss.mini.forEach(m => {
    if (!m) return;
    const a = Math.max(0, Math.min(1, m.t / 10, (m.warm + 18 - m.t) / 10));
    if (a <= 0) return;

    const size = m.size || 20;
    ctx.font = size + "px monospace";
    const gun = GUNS && GUNS[m.key];
    const text = (gun && gun.glyph) || "–";
    const bob = Math.sin(boss.t / 12 + (m.ph || 0)) * 3;
    const kick = m.kick || 0;
    const back = ((gun && gun.recoilBack) || 4) * (size / 16) * 1.5 * kick;
    const flip = Math.cos(m.ang) < 0;
    const rise = (((gun && gun.recoilStrength) || 6) * Math.PI / 180) * kick * (flip ? 1 : -1);

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(m.x - Math.cos(m.ang) * back, m.y + bob - Math.sin(m.ang) * back);
    ctx.rotate(m.ang + rise);
    if (flip) ctx.scale(1, -1);
    ctx.fillText(text, 0, 0);

    if (kick > 0.55) {
      const tipX = ctx.measureText(text).width / 2 + 4;
      ctx.globalAlpha = a * ((kick - 0.55) / 0.45);
      ctx.fillStyle = "orange";
      ctx.fillText("✸", tipX, 0);
    }
    ctx.restore();
  });

  ctx.restore();
}

function bossAimTarget(){
  const list = [];
  if (player && player.alive) list.push(player);
  Object.values(remotePlayers).forEach(rp => { if (rp.alive) list.push(rp); });
  if (!list.length) return player;
  return list[Math.floor(boss.t / 180) % list.length];
}

function bossRunAttack() {
  const player = bossAimTarget();
  if (!boss || !boss.active || !player) return;

  const P = boss.phase === 2;
  const t = boss.attackT;

  switch (boss.attack) {

    // CROSSFIRE (easier): 2 big snipers per side, 2 slower bullets each
    case "crossfire": {
      const every = 110;
      if (t % every === 10) {
        [-1, 1].forEach(side => {
          const ox = side < 0 ? 62 : 738;
          const oy = Math.max(70, Math.min(530, player.y + (Math.random() - 0.5) * 160));
          for (let i = 0; i < 2; i++) {
            const gy = oy + (i - 0.5) * 70;
            const aim = Math.atan2(player.y - gy, player.x - ox);
            bossMini(ox, gy, aim, 34 + i * 16, (x, y) => {
              bossFire(x, y, aim - 0.06, 3.4, "⊸");
              bossFire(x, y, aim + 0.06, 3.4, "⊸");
            }, 28, "sniper");
          }
        });
      }
      break;
    }

    // ROCKET BARRAGE: 3 rocket launchers appear and fire rockets at the spot you were standing.
    // The rocket flies to that spot and blows up there, even if you've moved.
    case "rockets": {
      if (t === 0) {
        boss.rkGuns = [
          bossMini(80,  300, 0,            99999, null, 26, "rocketLauncher"),
          bossMini(720, 300, Math.PI,      99999, null, 26, "rocketLauncher"),
        ];
        boss.rkGuns.forEach(g => g.holdFor = "rockets");
      }
      (boss.rkGuns || []).forEach((g, i) => {
        if (!g || !boss.mini.includes(g)) return;
        g.ang = Math.atan2(player.y - g.y, player.x - g.x);   // launchers keep aiming at you
        const first = 40 + i * 28;
        if (t >= first && t < 260 && (t - first) % 130 === 0) {
          const mx = g.x + Math.cos(g.ang) * g.reach, my = g.y + Math.sin(g.ang) * g.reach;
          const tx = Math.max(30, Math.min(770, player.x + (Math.random() - 0.5) * 50));
          const ty = Math.max(30, Math.min(570, player.y + (Math.random() - 0.5) * 50));
          bossRocket(mx, my, tx, ty);
          g.kick = 1;
        }
      });
      break;
    }

    // FLYTRAP VOLLEY: one medium sniper pops out beside the boss and fires a fan at you
    case "volley": {
      const every = P ? 48 : 60;
      if (t % every === 10) {
        const side = (Math.floor(t / every) % 2 ? -1 : 1) * 130;
        const ox = Math.max(50, Math.min(750, boss.x + side));
        const oy = boss.y + 30;
        const aim = Math.atan2(player.y - oy, player.x - ox);
        const n = P ? 5 : 3;
        const sp = P ? 4.4 : 3.6;
        bossMini(ox, oy, aim, 20, (x, y) => {
          for (let i = 0; i < n; i++) bossFire(x, y, aim + (i - (n - 1) / 2) * 0.26, sp, "⊸");
        }, 20, "sniper");
      }
      break;
    }

    // SWEEPING FIRE: one medium sniper on the boss swings back and forth
    case "sweep": {
      let g = boss.sweepGun;
      if (!g || !boss.mini.includes(g) || g.warm <= g.t) {
        g = boss.sweepGun = bossMini(boss.x, boss.y + 80, Math.PI / 2, 99999, null, 20, "sniper");
        g.holdFor = "sweep";
      }
      const a = Math.PI / 2 + Math.sin(t / 28) * (P ? 1.1 : 0.9);
      g.x = boss.x; g.y = boss.y + 80; g.ang = a;
      if (t % (P ? 4 : 5) === 0) {
        const mx = g.x + Math.cos(a) * g.reach, my = g.y + Math.sin(a) * g.reach;
        bossFire(mx, my, a, 3.2, "⊸");
        if (P) bossFire(mx, my, Math.PI - a, 3.2, "⊸");
        g.kick = 0.7;
      }
      break;
    }

    // CROSSFIRE: big snipers on both sides, each fires a cluster of 3 at where you were
    case "crossfire": {
      const every = P ? 55 : 70;
      if (t % every === 10) {
        const n = P ? 4 : 3;
        [-1, 1].forEach(side => {
          const ox = side < 0 ? 62 : 738;
          const oy = Math.max(70, Math.min(530, player.y + (Math.random() - 0.5) * 160));
          for (let i = 0; i < n; i++) {
            const gy = oy + (i - (n - 1) / 2) * 46;
            const aim = Math.atan2(player.y - gy, player.x - ox);
            bossMini(ox, gy, aim, 30 + i * 10, (x, y) => {
              for (let j = -1; j <= 1; j++) bossFire(x, y, aim + j * 0.1, 4.2, "⊸");
            }, 28, "sniper");
          }
        });
      }
      break;
    }

    // REINFORCEMENTS: two guns, one on each side of the boss, shoot out default enemies
    case "reinforce": {
      if (t === 0) {
        boss.waitEnemies = true; boss.waitT = 0;
        boss.reinfShooters = Math.min(6, 3 + boss.level);
        boss.gunL = bossMini(boss.x - 200, boss.y + 30, Math.PI, 99999, null, 18, "shotgun");
        boss.gunR = bossMini(boss.x + 200, boss.y + 30, 0,       99999, null, 18, "shotgun");
        boss.gunL.holdFor = boss.gunR.holdFor = "reinforce";
      }
      const guns = [boss.gunL, boss.gunR];
      guns.forEach((g, i) => {
        if (!g) return;
        const sgn = i ? 1 : -1;
        g.x = Math.max(g.reach + 6, Math.min(794 - g.reach, boss.x + sgn * (140 + g.reach)));
        g.y = boss.y + 30;
      });
      const every = 20;
      if (t >= 30 && t % every === 10 && t < every * 8 + 30) {
        guns.forEach((g, i) => { if (g) { g.kick = 1; bossLaunchEnemy(g, i ? 1 : -1); } });
      }
      if (boss.reinfShooters && t >= 40 && (t - 40) % 25 === 0 && (t - 40) / 25 < boss.reinfShooters) spawnWaveShooter(wv.n);
      if (t === 30 && !bossEnemies.some(b => b.gug)) {
        const gp = randomEnemySpawnPoint();
        const gugHp = 180 + wv.n * 8;
        bossEnemies.push({ id: nextEnemyId++, x: gp.x, y: gp.y, speed: 0.45, lastShot: performance.now(),
                           fireDelay: 2800, health: gugHp, maxHealth: gugHp, gug: true, spin: 0 });
      }
      break;
    }

    // BLOOMING PETALS
    case "bloom": {
      const every = P ? 38 : 48;
      if (t % every === 5) {
        const n = P ? 16 : 12;
        const k = Math.floor(t / every);
        const off = k * 0.35 * (k % 2 ? -1 : 1);
        for (let i = 0; i < n; i++) {
          const a = off + i * Math.PI * 2 / n;
          const sp = (i % 2 === 0) ? 2.8 : 1.7;
          bossFire(boss.x + Math.cos(a) * 70, boss.y + 40 + Math.sin(a) * 70, a, sp, "⊸");
        }
      }
      break;
    }

    // TWISTER
    case "twister": {
      if (t % 7 === 0) {
        const arms = P ? 3 : 2;
        for (let k = 0; k < arms; k++) {
          const a1 = t * 0.085 + k * Math.PI * 2 / arms;
          const a2 = -t * 0.06 + 1 + k * Math.PI * 2 / arms;
          bossFire(boss.x + Math.cos(a1) * 75, boss.y + 40 + Math.sin(a1) * 75, a1, 2.3, "⊸");
          bossFire(boss.x + Math.cos(a2) * 75, boss.y + 40 + Math.sin(a2) * 75, a2, 1.6, "⊸");
        }
      }
      break;
    }
    case "spiral": {
      if (t % 6 === 0) {
        const arms = P ? 3 : 2;
        const base = t * 0.09;
        const sp = P ? 2.5 : 2.1;

        for (let k = 0; k < arms; k++) {
          const a = base + k * Math.PI * 2 / arms;

          bossMini(
            boss.x + Math.cos(a) * 75,
            boss.y + 40 + Math.sin(a) * 75,
            a,
            8,
            (x, y) => bossFire(x, y, a, sp, "✦")
          );
        }
      }
      break;
    }

    case "ring": {
      if (t % (P ? 95 : 110) === 15) {
        const n = P ? 18 : 14;
        const r = 170;
        const sp = P ? 1.5 : 1.3;
        const halfGap = P ? 0.5 : 0.65;

        const toCenter = Math.atan2(
          300 - player.y,
          400 - player.x
        );

        const gap = toCenter + (Math.random() - 0.5) * 0.8;

        for (let i = 0; i < n; i++) {
          const a = i * Math.PI * 2 / n;
          const d = Math.atan2(
            Math.sin(a - gap),
            Math.cos(a - gap)
          );

          if (Math.abs(d) < halfGap) continue;

          bossMini(
            player.x + Math.cos(a) * r,
            player.y + Math.sin(a) * r,
            a + Math.PI,
            30,
            (x, y) => bossFireV(
              x,
              y,
              -Math.cos(a) * sp,
              -Math.sin(a) * sp,
              "●"
            )
          );
        }
      }
      break;
    }

    case "volley": {
      const every = P ? 48 : 60;

      if (t % every === 10) {
        const side = (Math.floor(t / every) % 2 ? -1 : 1) * 90;
        const ox = boss.x + side;
        const oy = boss.y + 30;

        const aim = Math.atan2(
          player.y - oy,
          player.x - ox
        );

        const n = P ? 5 : 3;
        const sp = P ? 4.4 : 3.6;

        for (let i = 0; i < n; i++) {
          const offset = (i - (n - 1) / 2) * 0.26;
          const a = aim + offset;

          bossMini(
            ox,
            oy + (i - (n - 1) / 2) * 16,
            a,
            20,
            (x, y) => bossFire(x, y, a, sp, "◆")
          );
        }
      }
      break;
    }

    // BLOOMING PETALS: rings with alternating fast/slow bullets that rotate each burst,
    // so they open up like a flower with moving gaps
    case "bloom": {
      const every = P ? 38 : 48;
      if (t % every === 5) {
        const n = P ? 16 : 12;
        const k = Math.floor(t / every);
        const off = k * 0.35 * (k % 2 ? -1 : 1);
        for (let i = 0; i < n; i++) {
          const a = off + i * Math.PI * 2 / n;
          const sp = (i % 2 === 0) ? 2.8 : 1.7;
          bossMini(
            boss.x + Math.cos(a) * 70,
            boss.y + 40 + Math.sin(a) * 70,
            a,
            8,
            (x, y) => bossFire(x, y, a, sp, "⊸")
          );
        }
      }
      break;
    }

    // TWISTER: two spirals spinning in opposite directions at different speeds
    case "twister": {
      if (t % 7 === 0) {
        const arms = P ? 3 : 2;
        for (let k = 0; k < arms; k++) {
          const a1 = t * 0.085 + k * Math.PI * 2 / arms;
          const a2 = -t * 0.06 + 1 + k * Math.PI * 2 / arms;
          bossMini(
            boss.x + Math.cos(a1) * 75, boss.y + 40 + Math.sin(a1) * 75, a1, 8,
            (x, y) => bossFire(x, y, a1, 2.3, "⊸")
          );
          bossMini(
            boss.x + Math.cos(a2) * 75, boss.y + 40 + Math.sin(a2) * 75, a2, 8,
            (x, y) => bossFire(x, y, a2, 1.6, "⊸")
          );
        }
      }
      break;
    }

    // SWEEPING FIRE: a fast stream swings back and forth like a hose (mirrored in phase 2)
    case "sweep": {
      if (t % (P ? 4 : 5) === 0) {
        const a = Math.PI / 2 + Math.sin(t / 28) * (P ? 1.1 : 0.9);
        const ox = boss.x, oy = boss.y + 60;
        bossMini(ox, oy, a, 6, (x, y) => bossFire(x, y, a, 3.2, "⊸"));
        if (P) {
          const b2 = Math.PI - a;
          bossMini(ox, oy, b2, 6, (x, y) => bossFire(x, y, b2, 3.2, "⊸"));
        }
      }
      break;
    }

    // CROSSFIRE: guns appear on both sides of the screen and fire streams at where you WERE standing
    case "crossfire": {
      const every = P ? 55 : 70;
      if (t % every === 10) {
        const n = P ? 4 : 3;
        [-1, 1].forEach(side => {
          const ox = side < 0 ? 24 : 776;
          const oy = Math.max(60, Math.min(560, player.y + (Math.random() - 0.5) * 160));
          for (let i = 0; i < n; i++) {
            const gy = oy + (i - (n - 1) / 2) * 18;
            const aim = Math.atan2(player.y - gy, player.x - ox);
            bossMini(ox, gy, aim, 28 + i * 8, (x, y) => bossFire(x, y, aim, 4.2, "⊸"));
          }
        });
      }
      break;
    }

    case "rain": {
      if (t % (P ? 44 : 52) === 5) {
        boss.row++;

        const cell = 44;
        const cols = Math.ceil(800 / cell);
        const gapW = P ? 2 : 2;
        const maxG = cols - gapW;
        const vy = P ? 3.4 : 3;

        let g;

        if (boss.gapCol < 0) {
          g = Math.floor(Math.random() * (maxG + 1));
          boss.gapTarget = undefined;
        } else {
          // pick a far-away target column, walk toward it, then pick a new one
          if (boss.gapTarget === undefined || boss.gapTarget === boss.gapCol) {
            do {
              boss.gapTarget = Math.floor(Math.random() * (maxG + 1));
            } while (Math.abs(boss.gapTarget - boss.gapCol) < 6);
          }
          const gapDist = Math.abs(boss.gapTarget - boss.gapCol);
          const gapStep = Math.min(gapDist, 1 + Math.floor(Math.random() * 2));
          g = boss.gapCol + Math.sign(boss.gapTarget - boss.gapCol) * gapStep;
        }

        g = Math.max(0, Math.min(maxG, g));
        boss.gapCol = g;

        for (let i = 0; i < cols; i++) {
          if (i >= g && i < g + gapW) continue;

          bossMini(
            cell / 2 + i * cell,
            14,
            Math.PI / 2,
            30,
            (x, y) => bossFireV(x, 22, 0, vy, "▼")
          );
        }
      }
      break;
    }
  }
}

function bossDamage(d, hx, hy){
  if(boss.state !== "fight") return;
  if(isMultiplayerClient && socket) socket.emit("collectItem", { type: "bossHit", dmg: Math.round(d) });
  boss.hp -= d; boss.hit = 1;
  shake = Math.max(shake, 3);
  for(let i = 0; i < 3; i++) blood.push({ x: hx, y: hy, dx: (Math.random() - 0.5) * 3, dy: (Math.random() - 0.5) * 3, life: 20 });
  if(boss.hitSnd <= 0){ playSound("https://file.garden/Zfwe_2Ig9weivlFh/car%20hit%20impactful.wav"); boss.hitSnd = 6; }
  if(boss.hp <= 0 && !isMultiplayerClient) bossDie();
}

function bossDie(){
  enemies = [];
  boss.hp = 0; boss.state = "dying"; boss.dyingT = 0; boss.attack = null; boss.label = "";
  bullets = bullets.filter(b => !b.enemyBullet);
  playSound("https://file.garden/Zfwe_2Ig9weivlFh/explosionboom.wav");
}

function bossNuke(){   // called from performNukeExplosion
  if(boss.active && boss.state === "fight"){ bossDamage(Math.round(boss.maxHp * 0.25), boss.x, boss.y); shake = Math.max(shake, 40); }
}

function bossCollide(){
  // bullets
  for(let j = bullets.length - 1; j >= 0; j--){
    const b = bullets[j];
    if(b.enemyBullet) continue;
    if(Math.hypot(b.x - boss.x, b.y - boss.y) < BOSS_HIT_R){
      let d = Math.min(b.damage || 10, 40);
      if(b.isRocket){
        d = 150;
        explosionRings.push({ x: b.x, y: b.y, radius: 1, maxRadius: 200, speed: 6, alive: true, life: 35 });
        shakeTime = 40;
        playSound("https://file.garden/Zfwe_2Ig9weivlFh/explotion.wav");
      }
      bullets.splice(j, 1);
      bossDamage(d, b.x, b.y);
      if(boss.state !== "fight") break;
    }
  }
  // sword
  if(boss.swordCd > 0) boss.swordCd--;
  if(boss.state === "fight" && boss.swordCd <= 0 && player.alive && player.currentGunKey === "sword" && mouseMoving && !player.dashSwordSpin){
    const ang = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    const x1 = player.x + Math.cos(ang) * 20, y1 = player.y + Math.sin(ang) * 20;
    const x2 = player.x + Math.cos(ang) * 130, y2 = player.y + Math.sin(ang) * 130;
    if(distanceToLine(boss.x, boss.y, x1, y1, x2, y2) < BOSS_HIT_R){
      boss.swordCd = 18;
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/shing.wav");
      bossDamage(30, boss.x, boss.y);
    }
  }
}

function bossUpdate(){
  boss.t++;
  bossMiniUpdate();
  bossRocketsUpdate();
  if(boss.hit > 0) boss.hit = Math.max(0, boss.hit - 0.07);
  if(boss.hitSnd > 0) boss.hitSnd--;

  // regular enemies keep coming in front of the boss + ammo keeps dropping
  if(boss.state !== "dying"){

    if(--boss.ammoT <= 0){
      boss.ammoT = 400;
      if(pickups.length < 3){ const p = randomPointInPlayableArea(40); pickups.push({ id: nextItemId++, x: p.x, y: p.y }); }
    }
  }

  if(boss.state === "descend"){
    // floats down from above and "toward" the screen, shaking everything
    const D = 420, p = Math.min(1, boss.t / D), e = 1 - Math.pow(1 - p, 3);
    boss.y = -260 + (BOSS_Y + 260) * e;
    boss.z = -500 * (1 - e);
    shake = Math.max(shake, 16 - 8 * p);
    if(boss.t >= D){ boss.state = "fight"; boss.t = 0; boss.z = 0; shake = Math.max(shake, 30); }
  }
  else if(boss.state === "fight"){
    boss.x = 400 + Math.sin(boss.t / 110) * (boss.phase === 2 ? 190 : 140);
    boss.y = BOSS_Y + Math.sin(boss.t / 47) * 14;

    if(false && boss.phase === 1 && boss.hp < boss.maxHp * 0.5){
      boss.phase = 2; boss.attack = null; boss.cooldown = 90; shake = 40;
      bullets = bullets.filter(b => !b.enemyBullet);
      window.lastWormWarning = { text: "⚠ " + BOSS_NAME + " IS ANGRY ⚠", t: performance.now(), duration: 2200 };
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/explotion.wav");
    }

    if(boss.attack){
      bossRunAttack();
      if(boss.rainWith){
        const keepAttack = boss.attack;
        boss.attack = "rain";
        bossRunAttack();
        boss.attack = keepAttack;
      }
      if(++boss.attackT >= boss.attackLen){ boss.attack = null; boss.label = ""; boss.cooldown = boss.phase === 2 ? 75 : 110; }
    } else if(boss.waitEnemies && enemies.length > 0 && boss.waitT++ < 900){
      boss.label = "CLEAR THEM OUT";
    } else if(--boss.cooldown <= 0){ boss.waitEnemies = false; boss.label = ""; bossPickAttack(); }

    bossCollide();
  }
  else if(boss.state === "dying"){
    boss.dyingT++;
    boss.hit = 1;
    boss.y -= 3;
    shake = Math.max(shake, 22);
    if(boss.dyingT % 5 === 0){
      const px = boss.x + (Math.random() - 0.5) * 220, py = boss.y + (Math.random() - 0.5) * 220;
      for(let i = 0; i < 12; i++) blood.push({ x: px, y: py, dx: (Math.random() - 0.5) * 8, dy: (Math.random() - 0.5) * 8,
                                              life: 35, char: ["*", "✦", "•"][Math.floor(Math.random() * 3)], color: "orange" });
    }
    if(boss.dyingT % 40 === 0) playSound("https://file.garden/Zfwe_2Ig9weivlFh/explotion.wav");
    if(boss.dyingT >= 200){
      boss.active = false; boss.state = "none";
      kills += 10; killPop = 1.4; killPopColor = 1.2;
      player.health = Math.min(player.maxHealth || 100, player.health + 50);
      for(let i = 0; i < 4; i++){ const p = randomPointInPlayableArea(40); pickups.push({ id: nextItemId++, x: p.x, y: p.y }); }
      spawnGunPickup(); spawnGunPickup();
      wv.state = "intermission"; wv.timer = 330;
      wavesBanner("BOSS DEFEATED!", "the waves go on...", 220);
    }
  }
}

// ------------------------- HUD -------------------------
function drawWavesHUD(){
  if(!wavesMode || tutorialActive || gameState !== "playing") return;
  bossDrawGuns();
  bossDrawRockets();
  ctx.save();
  ctx.textAlign = "center";
  const fg = lightMode ? "black" : "white";
  ctx.fillStyle = fg;
  ctx.font = "16px 'Times New Roman', Times, serif";
  let status;
  if(wv.state === "boss") status = "WAVE " + wv.n + " — BOSS";
  else if(wv.state === "intermission") status = wv.n === 0 ? "GET READY" : "WAVE " + wv.n + " CLEARED";
  else status = "WAVE " + wv.n;
  ctx.fillText(status, 400, 26);

  ctx.font = "11px 'Times New Roman', Times, serif";
  ctx.globalAlpha = 0.8;
  if(wv.state === "active") ctx.fillText("enemies left: " + (wv.toSpawn + wv.toSpawnShooters + enemies.length + bossEnemies.length), 400, 44);
  else if(wv.state === "intermission") ctx.fillText("next wave in " + Math.ceil(wv.timer / 60), 400, 44);
  else if(boss.label) ctx.fillText("* " + boss.label, 400, 44);
  ctx.globalAlpha = 1;

  // boss health bar
  if(boss.active){
    const w = 480, x = 160, y = 566;
    ctx.font = "12px 'Times New Roman', Times, serif"; ctx.fillStyle = fg;
    ctx.fillText(BOSS_NAME + (boss.phase === 2 ? "  (ENRAGED)" : ""), 400, y - 6);
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(x - 2, y - 2, w + 4, 16);
    ctx.fillStyle = boss.phase === 2 ? "#ff3b1f" : "#c9382a";
    ctx.fillRect(x, y, w * Math.max(0, boss.hp / boss.maxHp), 12);
    ctx.strokeStyle = fg; ctx.lineWidth = 1; ctx.strokeRect(x - 2.5, y - 2.5, w + 5, 17);
  }

  // big banner
  if(wv.bannerT > 0){
    const a = Math.max(0, Math.min(1, wv.bannerT / 30, (wv.bannerMax - wv.bannerT) / 12 + 0.01));
    ctx.globalAlpha = a;
    ctx.fillStyle = "yellow";
    ctx.font = "48px 'Times New Roman', Times, serif";
    ctx.fillText(wv.bannerText, 400, 300);
    if(wv.bannerSub){ ctx.font = "18px 'Times New Roman', Times, serif"; ctx.fillStyle = fg; ctx.fillText(wv.bannerSub, 400, 332); }
  }
  ctx.restore();
}

function drawWavesBlurb(){

  ctx.fillStyle = "white";
  ctx.font = "23px 'Times New Roman', Times, serif";
  ctx.fillText("WAVES", x, 140);

  ["Survive wave after wave of enemies.", "Every wave is bigger, faster and meaner.", "", "Shooters join in from wave 3.", "", "Reach wave 10...", "something big is waiting."]
    .forEach((l, i) => ctx.fillText(l, x, 185 + i * 26));

// ====== DRAW ======
function draw(){
  ctx.setTransform(RES_SCALE, 0, 0, RES_SCALE, 0, 0);   // resolution scale
  // Clear the screen
  renderBoss3D();
  if (bossLayerOn() && !(invertTimer > 0 || nukeFlashCount > 0 || nukeFlashAlpha > 0)) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);   // let the 3D boss show through from behind
  } else {
    ctx.fillStyle = lightMode ? "#eee" : (invertTimer > 0 ? "white" : "black");
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (bossVisible() && !(invertTimer > 0 || nukeFlashCount > 0 || nukeFlashAlpha > 0)) drawBossFallback();               // 3D not available -> simple stand-in boss
  }
  ctx.fillStyle = lightMode ? "black" : (invertTimer > 0 ? "black" : "white");

// ---- NUKE SMOOTH FLASH (FADE IN + FADE OUT) ----
if (nukeFlashState === "fadeIn") {
    nukeFlashAlpha += 0.03; // takes ~1 second to reach white
    if (nukeFlashAlpha >= 1) {
        nukeFlashAlpha = 1;
        nukeFlashState = "fadeOut";
    }
}

else if (nukeFlashState === "fadeOut") {
    nukeFlashAlpha -= 0.01; // slow fade-out
    if (nukeFlashAlpha <= 0) {
        nukeFlashAlpha = 0;
        nukeFlashState = "none";
    }
}

// draw the white overlay if needed
if (nukeFlashAlpha > 0) {
    ctx.fillStyle = `rgba(255,255,255,${nukeFlashAlpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ===== DEATH ANIMATION DRAW =====
if (gameState === "deathAnim") {

    // black out canvas behind the HTML GIF
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (deathCanvasAnim) {
        drawGifFrames(deathCanvasAnim.frames, deathCanvasAnim.x, deathCanvasAnim.y, performance.now() - deathCanvasAnim.start);
    }
    return;
}

// ===== DRAW NUKE RINGS =====
// ===== DRAW NUKE RINGS =====
if (nukeRings.length > 0) {
    const oldWidth = ctx.lineWidth;       // save current line width
    ctx.lineWidth = 6;                    // set thick line ONLY for nuke

    const oldAlpha = ctx.globalAlpha;     // save current alpha
    ctx.globalAlpha = 0.15;

    nukeRings.forEach(r => {
        ctx.beginPath();
        ctx.strokeStyle = "white";
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.stroke();
    });

    ctx.lineWidth = oldWidth;             // restore original thickness
    ctx.globalAlpha = oldAlpha;           // restore normal transparency
}

// ===== WHITE NUKE FLASH =====
window.nukeFlashA = 0;
if (nukeFlashCount > 0) {
    window.nukeFlashA = nukeFlashCount / 20;  // drawn later, on top of everything
    nukeFlashCount--;
}

  // Handle pause menu first
  if(gameState === "paused"){
    drawPauseMenu();
    return; // stop further drawing
  }

  worldItems.forEach(item => {
    ctx.fillStyle = 'yellow';
    ctx.fillRect(item.x - 5, item.y - 5, 10, 10);
  });

  ctx.save();
  if(gameState === "playing" && shake > 0 && cameraShakeEnabled) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  ctx.font = textSize+"px sans-serif";

  // ===== TITLE SCREEN =====
if (gameState === "title") {
    if (titleBg.complete && titleBg.naturalWidth > 0) {
        if (lightMode) {
            // Invert colors when Light Mode is enabled
            ctx.save();
            ctx.filter = "invert(1)";
            ctx.drawImage(titleBg, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        } else {
            // Normal image for dark mode
            ctx.drawImage(titleBg, 0, 0, canvas.width, canvas.height);
        }
    } else {
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }


    ctx.fillStyle = lightMode ? "black" : "white";
    ctx.font = "40px sans-serif";

  const countUp = (final, start) => {
    if (goElapsed <= start) return 0;
    let t = Math.min(1, (goElapsed - start) / GO_DUR);
    t = 1 - Math.pow(1 - t, 3); // fast start, settles at the end
    return final * t;
  };

  let survivalTime = (endTime - startTime) / 1000;

  if (goElapsed >= killsStart) {
    const killsVal = Math.floor(countUp(kills, killsStart));

    const timeT = Math.min(1, (goElapsed - timeStart) / GO_DUR);
    const timeVal = survivalTime * (1 - Math.pow(1 - timeT, 3));
    const timeShown = timeVal.toFixed(1);
    if (timeShown !== goLastTimeShown) {
      playSound(tickSoundURL);
      goLastTimeShown = timeShown;
    }
    if (timeT >= 1 && !goTimeDone) {
      playSound(tickDoneSoundURL);

  ctx.save();

  // box
  ctx.fillStyle = lightMode ? "rgba(255,255,255,0.6)" : "rgba(0,0,0,0.55)";
  ctx.fillRect(mx, my, size, size);
  ctx.strokeStyle = lightMode ? "rgba(0,0,0,0.6)" : "rgba(255,255,255,0.6)";
  ctx.lineWidth = 1;
  ctx.strokeRect(mx, my, size, size);

  // keep everything inside the box
  ctx.beginPath();
  ctx.rect(mx, my, size, size);
  ctx.clip();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const dot = (wx, wy, color, symbol, fontPx, clampToEdge) => {
    let px = (wx - center.x) * scale;
    let py = (wy - center.y) * scale;
    if (Math.abs(px) > half - 6 || Math.abs(py) > half - 6) {
      if (!clampToEdge) return;
      const k = (half - 6) / Math.max(Math.abs(px), Math.abs(py));
      px *= k; py *= k;
    }
    ctx.fillStyle = color;
    ctx.font = fontPx + "px sans-serif";
    ctx.fillText(symbol, cx + px, cy + py);
  };

  // enemies = red *
  const enemyColor = lightMode ? "black" : "white";   // white (turns black in light mode so you can still see it)
  (enemies || []).forEach(e => dot(e.x, e.y, enemyColor, "*", 14, false));
  (bossEnemies || []).forEach(e => dot(e.x, e.y, enemyColor, "*", 20, false));
  (worms || []).forEach(w => dot(w.x, w.y, enemyColor, "*", 24, false));

  // other players = the player character, in their own colour (stuck to the edge if far away)
  Object.values(remotePlayers).forEach(rp => {
    if (!rp.alive) return;
    const rx = rp.displayX !== undefined ? rp.displayX : rp.x;
    const ry = rp.displayY !== undefined ? rp.displayY : rp.y;
    dot(rx, ry, mpSafeColor(rp.color) || "cyan", "ᗢ", 14, true);
  });

  // players who are down and need reviving: their character with an X over it
  if (mpReviveOn()) {
    Object.values(mpDownedPlayers).forEach(d => {
      dot(d.x, d.y, mpSafeColor(d.color) || "cyan", "ᗢ", 14, true);
      dot(d.x, d.y, lightMode ? "black" : "white", "╳", 16, true);
    });
    if (mpDowned) {
      dot(player.x, player.y, playerColorValue() || (lightMode ? "black" : "white"), "ᗢ", 14, true);
      dot(player.x, player.y, lightMode ? "black" : "white", "╳", 16, true);
    }
  }

  // me = the player character in MY colour
  if (player.alive) {
    dot(player.x, player.y, playerColorValue() || (lightMode ? "black" : "white"), "ᗢ", 14, true);
  }

  ctx.restore();
}
