// ===== FIT GAME TO WINDOW (keeps the 800x600 shape, no stretching) =====
function fitGameToWindow(){
  const wrap = document.getElementById("gameWrap");
  if(!wrap) return;
  const scale = Math.min(window.innerWidth / 800, window.innerHeight / 600);
  if(!FULLSCREEN_MODE){
    // normal mode: original fixed 800x600, centered horizontally at the top
    wrap.style.position = "relative";
    wrap.style.left = "auto";
    wrap.style.top = "auto";
    wrap.style.margin = "0 auto";
    wrap.style.transform = "none";
    return;
  }
  wrap.style.position = "absolute";
  wrap.style.left = "50%";
  wrap.style.top = "50%";
  wrap.style.margin = "0";
  wrap.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
}
window.addEventListener("resize", fitGameToWindow);
fitGameToWindow();

function getCanvasMouse(e){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function isCameraActive() {
  return followCameraMode || openWorldMode;
}

let mpSpecCamX = null, mpSpecCamY = null; // last spot the spectator camera looked at
let mpSpecLostAt = 0;                     // when the player we were watching died

function getCameraState() {
  if (!isCameraActive() || gameState !== "playing" || !player) {
    return { x: 0, y: 0, zoom: 1 };
  }

  const zoom = FOLLOW_CAMERA_ZOOM;

  let focusX = player.x;
  let focusY = player.y;

  if (!player.alive && mpPartyCode && performance.now() >= mpDeathCamUntil) {
    const now = performance.now();
    const findAlive = () => Object.keys(remotePlayers).find(id => remotePlayers[id].alive);
    let target = (mpSpectateId && remotePlayers[mpSpectateId] && remotePlayers[mpSpectateId].alive)
      ? remotePlayers[mpSpectateId] : null;

    if (!target) {
      if (mpSpecCamX === null) {
        // first time spectating: start on the first living player
        const firstId = findAlive();
        if (firstId) { mpSpectateId = firstId; target = remotePlayers[firstId]; }
      } else {
        // the player we were watching died: hold the camera where they died until their vomit finishes,
        // then move on to someone who is still alive
        if (!mpSpecLostAt) mpSpecLostAt = now;
        if (now - mpSpecLostAt > VOMIT_DURATION) {
          const nextId = findAlive();
          if (nextId) { mpSpectateId = nextId; target = remotePlayers[nextId]; mpSpecLostAt = 0; }
        }
      }
    } else {
      mpSpecLostAt = 0;
    }

    if (target) {
      mpSpecCamX = target.displayX !== undefined ? target.displayX : target.x;
      mpSpecCamY = target.displayY !== undefined ? target.displayY : target.y;
    }
    if (mpSpecCamX !== null) {
      focusX = mpSpecCamX;
      focusY = mpSpecCamY;
    }
  }

  return {
    x: canvas.width / 2 - focusX * zoom,
    y: canvas.height / 2 - focusY * zoom,
    zoom
  };
}

function applyCameraTransform() {
  const camera = getCameraState();
  ctx.translate(camera.x, camera.y);
  ctx.scale(camera.zoom, camera.zoom);
}

function screenToWorld(x, y) {
  const camera = getCameraState();

  return {
    x: (x - camera.x) / camera.zoom,
    y: (y - camera.y) / camera.zoom
  };
}

function drawOpenWorldGrid() {
  if (!openWorldMode || !player) return;

  const gridSize = 60; // spacing between lines

  // work out the visible world area from the CAMERA, not from the player,
  // so it still covers the whole screen while you spectate someone else
  const cam = getCameraState();
  const left = -cam.x / cam.zoom - gridSize;
  const top = -cam.y / cam.zoom - gridSize;
  const right = left + canvas.width / cam.zoom + gridSize * 2;
  const bottom = top + canvas.height / cam.zoom + gridSize * 2;

  // snap start positions to the grid so lines don't "swim" as you move
  const startX = Math.floor(left / gridSize) * gridSize;
  const startY = Math.floor(top / gridSize) * gridSize;

  ctx.save();
  ctx.strokeStyle = lightMode ? "rgba(0,0,0,0.15)" : "rgba(255,255,255,0.15)";
  ctx.lineWidth = 1.5;

  ctx.beginPath();
  for (let x = startX; x <= right; x += gridSize) {
    ctx.moveTo(x, top);
    ctx.lineTo(x, bottom);
  }
  for (let y = startY; y <= bottom; y += gridSize) {
    ctx.moveTo(left, y);
    ctx.lineTo(right, y);
  }
  ctx.stroke();

  ctx.restore();
}

function drawGameBorder() {
  if (!followCameraMode || openWorldMode) return;

  const camera = getCameraState();

  ctx.save();
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3 / camera.zoom;
  ctx.strokeRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

function clampToWorldBounds(x, y) {
  if (openWorldMode) return { x, y };

  return {
    x: Math.max(0, Math.min(canvas.width, x)),
    y: Math.max(0, Math.min(canvas.height, y))
  };
}

function mpSpawnAnchor(){
  // picks a random living player to spawn things around (host + others in multiplayer)
  const list = [];
  if(player && player.alive) list.push(player);
  if(mpPartyCode && mpIsHost){
    Object.values(remotePlayers).forEach(rp => { if(rp.alive) list.push(rp); });
  }
  if(!list.length) return player;
  return list[Math.floor(Math.random() * list.length)];
}

function randomPointAroundPlayer(minDist = 180, maxDist = 520) {
  if (!player) {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height
    };
  }

  const anchor = mpSpawnAnchor();
  const angle = Math.random() * Math.PI * 2;
  const distance = minDist + Math.random() * (maxDist - minDist);

  return {
    x: anchor.x + Math.cos(angle) * distance,
    y: anchor.y + Math.sin(angle) * distance
  };
}

function randomPointInPlayableArea(margin = 0) {
  if (wavesMode && boss.active) {
    return {
      x: margin + Math.random() * Math.max(1, canvas.width - margin * 2),
      y: canvas.height / 2 + margin + Math.random() * Math.max(1, canvas.height / 2 - margin * 2)
    };
  }
  if (openWorldMode) {
    const maxDist = Math.max(
      240,
      Math.min(canvas.width, canvas.height) * 0.45
    );

    return randomPointAroundPlayer(90 + margin, maxDist);
  }

  return {
    x: margin + Math.random() * Math.max(1, canvas.width - margin * 2),
    y: margin + Math.random() * Math.max(1, canvas.height - margin * 2)
  };
}

function randomEnemySpawnPoint(extraDistance = 80) {
  if (openWorldMode) {
    const halfDiagonal = Math.hypot(canvas.width, canvas.height) / 2;

    return randomPointAroundPlayer(
      halfDiagonal + extraDistance,
      halfDiagonal + extraDistance + 220
    );
  }

  const side = Math.floor(Math.random() * 4);
  let x = 0;
  let y = 0;

  if (side === 0) {
    x = Math.random() * canvas.width;
    y = 0;
  }

  if (side === 1) {
    x = Math.random() * canvas.width;
    y = canvas.height;
  }

  if (side === 2) {
    x = 0;
    y = Math.random() * canvas.height;
  }

  if (side === 3) {
    x = canvas.width;
    y = Math.random() * canvas.height;
  }

  return { x, y };
}

function isProjectileStillActive(bullet) {
  const alive = !bullet.isknife || bullet.life > 0;

  if (!alive) return false;

  if (!openWorldMode) {
    return (
      bullet.x >= 0 &&
      bullet.x <= canvas.width &&
      bullet.y >= 0 &&
      bullet.y <= canvas.height
    );
  }

  if (!player) return true;

  // measure from whatever the camera is looking at (the player you're spectating when you're dead)
  const view = mpViewCenter();
  return Math.hypot(
    bullet.x - view.x,
    bullet.y - view.y
  ) < 1800;
}

let mpDeathMsgs = [];
const DEATH_MSG_HOLD = 3000;   // how long it stays fully visible (ms)
const DEATH_MSG_FADE = 1000;   // how long it takes to fade away (ms)
function mpAddDeathMsg(name){
  mpDeathMsgs.push({ text: String(name || "Someone").slice(0, 20) + " has vomited", start: performance.now() });
  if(mpDeathMsgs.length > 3) mpDeathMsgs.shift();
}
function drawDeathMessages(){
  if(gameState !== "playing") return;
  const now = performance.now();
  mpDeathMsgs = mpDeathMsgs.filter(m => now - m.start < DEATH_MSG_HOLD + DEATH_MSG_FADE);
  if(!mpDeathMsgs.length) return;
  ctx.save();
  ctx.font = "16px 'Times New Roman', Times, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  mpDeathMsgs.forEach((m, i) => {
    const age = now - m.start;
    const alpha = age < DEATH_MSG_HOLD ? 1 : 1 - (age - DEATH_MSG_HOLD) / DEATH_MSG_FADE;
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = "red";
    const fromBottom = mpDeathMsgs.length - 1 - i;   // newest message sits lowest
    ctx.fillText(m.text, canvas.width / 2, canvas.height - 16 - fromBottom * 22);
  });
  ctx.restore();
} // ids of players who have died this run (ignore their late position packets)

// dropped ammo glides out of the player to its spot (host moves it, clients see it through the normal sync)
function mpUpdateDropTweens(){
  const now = performance.now();
  pickups.forEach(p => {
    if(!p.tw) return;
    const k = Math.min(1, (now - p.tw.start) / p.tw.dur);
    const ease = 1 - Math.pow(1 - k, 3);   // fast at first, slows down at the end
    p.x = p.tw.sx + (p.tw.tx - p.tw.sx) * ease;
    p.y = p.tw.sy + (p.tw.ty - p.tw.sy) * ease;
    if(k >= 1) p.tw = null;
  });
}

// works out who I'm standing next to, and drains the bar
let mpReviveLastTick = 0;
setInterval(() => {
  const now = performance.now();
  const dt = Math.min(0.1, (now - (mpReviveLastTick || now)) / 1000);
  mpReviveLastTick = now;
  if(!(mpReviveOn() && gameState === "playing" && player && player.alive && !mpDowned)){
    mpReviveTarget = null;
    mpReviveProgress = 0;
    return;
  }
  let best = null, bestD = MP_REVIVE_RANGE;
  Object.keys(mpDownedPlayers).forEach(id => {
    const d = mpDownedPlayers[id];
    const dist = Math.hypot(player.x - d.x, player.y - d.y);
    if(dist < bestD){ bestD = dist; best = id; }
  });
  if(best !== mpReviveTarget){ mpReviveTarget = best; mpReviveProgress = 0; }
  if(!mpReviveTarget) return;
  mpReviveProgress = Math.max(0, mpReviveProgress - MP_REVIVE_DECAY * dt);
}, 30);

// spam F next to a downed player to fill the bar
document.addEventListener("keydown", (e) => {
  if(e.repeat || String(e.key).toLowerCase() !== "r") return;
  if(!(mpReviveOn() && gameState === "playing" && player && player.alive && !mpDowned && mpReviveTarget)) return;
  if(mpHostPaused && isMultiplayerClient) return;
  e.mpRevivePress = true;   // tells the drop-ammo key not to fire on this same press
  if(MP_REVIVE_PRESS_SOUND) playSound(MP_REVIVE_PRESS_SOUND);
  mpReviveProgress = Math.min(1, mpReviveProgress + MP_REVIVE_PER_PRESS);
  if(mpReviveProgress >= 1){
    const id = mpReviveTarget;
    mpReviveProgress = 0;
    mpReviveTarget = null;
    delete mpDownedPlayers[id];
    if(socket) socket.emit("bulletFired", { id: socket.id, x: 0, y: 0, dx: 0, dy: 0, rv: id });
    playSound("https://file.garden/Zfwe_2Ig9weivlFh/revive_completev2.wav");
  }
});

  if(!(mpReviveOn() && gameState === "playing" && player && player.alive && !mpDowned && mpReviveTarget)) return;
  const d = mpDownedPlayers[mpReviveTarget];
  if(!d) return;
  ctx.save();
  ctx.font = "16px 'Times New Roman', Times, serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  const text = "Spam R to revive " + d.name;
  const w = ctx.measureText(text).width;
  const cx = canvas.width / 2;
  const y = canvas.height - 76;
  ctx.fillStyle = lightMode ? "black" : "white";
  ctx.fillText(text, cx, y);

// downed bodies (mine + everyone else's): shake first, then a red X over them
function mpDrawDownedBodies(){
  if(!mpReviveOn()) return;
  const now = performance.now();
  const bodies = Object.keys(mpDownedPlayers).map(id => Object.assign({ me: false }, mpDownedPlayers[id]));
  if(mpDowned && player) bodies.push({ me: true, x: player.x, y: player.y, color: playerColorValue(), at: mpDownedAt });
  bodies.forEach(b => {
    const shaking = now - b.at < MP_DOWN_SHAKE_MS;
    const jx = shaking ? (Math.random() - 0.5) * 6 : 0;
    const jy = shaking ? (Math.random() - 0.5) * 6 : 0;
    ctx.save();
    if(b.me){
      drawPlayerBody(b.x + jx, b.y + jy, b.color, playerGlow);
    } else {
      ctx.font = "16px sans-serif";
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = mpSafeColor(b.color) || "cyan";
      ctx.fillText("ᗢ", b.x + jx, b.y + jy);
      ctx.font = "10px sans-serif";
      ctx.fillText(b.name || "?", b.x - 10, b.y - 15);
    }
    ctx.restore();
    if(!shaking){
      ctx.save();
      ctx.font = "18px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = lightMode ? "black" : "white";
      ctx.fillText("╳", b.x + 6, b.y - 4);
      ctx.restore();
    }
  });
}

      mpBroadcastLobbySettings();

  if(e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowRight"){
    if(e.key === "ArrowUp") mpLobbySel = (mpLobbySel <= -1) ? MP_LOBBY_ROWS - 1 : mpLobbySel - 1;
    else if(e.key === "ArrowDown") mpLobbySel = (mpLobbySel >= MP_LOBBY_ROWS - 1) ? -1 : mpLobbySel + 1;

const MP_PUBLIC_PAGE_SIZE = 10;

function mpPublicFiltered(){
  const q = mpPublicQuery.trim().toLowerCase();
  if(!q) return mpPublicList;
  return mpPublicList.filter(p => String(p.name || "").toLowerCase().includes(q) || String(p.code || "").toLowerCase().includes(q));
}
function mpPublicPages(){
  return Math.max(1, Math.ceil(mpPublicFiltered().length / MP_PUBLIC_PAGE_SIZE));
}
function mpPublicPageItems(){
  return mpPublicFiltered().slice(mpPublicPage * MP_PUBLIC_PAGE_SIZE, mpPublicPage * MP_PUBLIC_PAGE_SIZE + MP_PUBLIC_PAGE_SIZE);
}
function mpPublicClamp(){
  mpPublicPage = Math.max(0, Math.min(mpPublicPages() - 1, mpPublicPage));
  const n = mpPublicPageItems().length;
  mpPublicSel = Math.max(0, Math.min(Math.max(0, n - 1), mpPublicSel));
}

  if(gameState !== "mppublic") return;
  const click = () => playSound("https://file.garden/Zfwe_2Ig9weivlFh/menu%20button.wav");
  mpPublicClamp();
  const items = mpPublicPageItems();
  const pages = mpPublicPages();
  const k = e.key;

  if(k === "Escape"){
    if(mpPublicFocus === 0 && mpPublicQuery){
      mpPublicQuery = ""; mpPublicPage = 0; mpPublicSel = 0;   // first Esc clears the search
    } else {
      mpError = "";
      gameState = "mpchoice";
    }
  }
  else if(k === "ArrowUp"){
    if(mpPublicFocus === 2 || mpPublicFocus === 3){
      if(items.length){ mpPublicFocus = 1; mpPublicSel = items.length - 1; }
      else mpPublicFocus = 0;
    } else if(mpPublicFocus === 1){
      if(mpPublicSel > 0) mpPublicSel--;
      else mpPublicFocus = 0;
    }
    click();
  }
  else if(k === "ArrowDown"){
    if(mpPublicFocus === 0){
      if(items.length){ mpPublicFocus = 1; mpPublicSel = 0; }
      else mpPublicFocus = 2;
    } else if(mpPublicFocus === 1){
      if(mpPublicSel < items.length - 1) mpPublicSel++;
      else mpPublicFocus = 2;
    }
    click();
  }
  else if(k === "ArrowLeft"){
    if(mpPublicFocus === 3){ mpPublicFocus = 2; click(); }
    else if(mpPublicFocus === 1 && mpPublicPage > 0){ mpPublicPage--; mpPublicSel = 0; click(); }
  }
  else if(k === "ArrowRight"){
    if(mpPublicFocus === 2){ mpPublicFocus = 3; click(); }
    else if(mpPublicFocus === 1 && mpPublicPage < pages - 1){ mpPublicPage++; mpPublicSel = 0; click(); }
  }
  else if(k === "Enter"){
    if(mpPublicFocus === 0){
      if(items.length){ mpPublicFocus = 1; mpPublicSel = 0; }
    } else if(mpPublicFocus === 1){
      const p = items[mpPublicSel];
      if(p && socket){
        mpError = "";
        mpCameFrom = "mppublic";
        socket.emit("joinParty", { code: p.code, username: mpUsername });
      }
    } else if(mpPublicFocus === 2){
      if(mpPublicPage > 0){ mpPublicPage--; mpPublicSel = 0; click(); }
    } else if(mpPublicFocus === 3){
      if(mpPublicPage < pages - 1){ mpPublicPage++; mpPublicSel = 0; click(); }
    }
  }
  else if(k === "Backspace"){
    if(mpPublicFocus === 0){ mpPublicQuery = mpPublicQuery.slice(0, -1); mpPublicPage = 0; mpPublicSel = 0; }
  }
  else if(k.length === 1 && mpPublicFocus === 0 && !e.ctrlKey && !e.metaKey && mpPublicQuery.length < 20){
    mpPublicQuery += k;
    mpPublicPage = 0;
    mpPublicSel = 0;
  }

  if(k === " " || k.indexOf("Arrow") === 0) e.preventDefault();
  e.stopImmediatePropagation();
});

// only accept colors in the exact format our color picker makes
// Makes (once per hue) an invisible SVG filter that turns white into the given color.
// Returns a CSS filter string, or "none" for the default color.
function tintFilterFor(color){
  const m = /^hsl\((\d{1,3}),100%,50%\)$/.exec(color || "");
  if(!m) return "none";
  const hue = Number(m[1]);
  const id = "tintW" + hue;
  if(!document.getElementById(id)){
    let holder = document.getElementById("tintFilters");
    if(!holder){
      holder = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      holder.id = "tintFilters";
      holder.setAttribute("width", "0");
      holder.setAttribute("height", "0");
      holder.style.cssText = "position:absolute;width:0;height:0;pointer-events:none;";
      document.body.appendChild(holder);
    }
    const h = hue / 60;
    const x = 1 - Math.abs(h % 2 - 1);
    let r = 0, g = 0, b = 0;
    if(h < 1){ r = 1; g = x; }
    else if(h < 2){ r = x; g = 1; }
    else if(h < 3){ g = 1; b = x; }
    else if(h < 4){ g = x; b = 1; }
    else if(h < 5){ r = x; b = 1; }
    else { r = 1; b = x; }
    holder.insertAdjacentHTML("beforeend",
      '<filter id="' + id + '" color-interpolation-filters="sRGB">' +
        // 1. push every channel to either 0 or 1 (1 only if the channel is >= 0.8)
        '<feComponentTransfer in="SourceGraphic" result="thr">' +
          '<feFuncR type="discrete" tableValues="0 0 0 0 1"/>' +
          '<feFuncG type="discrete" tableValues="0 0 0 0 1"/>' +
          '<feFuncB type="discrete" tableValues="0 0 0 0 1"/>' +
        '</feComponentTransfer>' +
        // 2. make a layer in your color that is only visible where R, G and B were ALL white
        '<feColorMatrix in="thr" type="matrix" result="mask" values="' +
          '0 0 0 0 ' + r + '  0 0 0 0 ' + g + '  0 0 0 0 ' + b + '  1 1 1 0 -2"/>' +
        // 3. keep the gif's own transparency
        '<feComposite in="mask" in2="SourceAlpha" operator="in" result="tinted"/>' +
        // 4. original gif underneath, tinted white pixels on top
        '<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tinted"/></feMerge>' +
      '</filter>');
  }
  return "url(#" + id + ")";
}


function mpSafeColor(c){
  return (typeof c === "string" && /^hsl\(\d{1,3},100%,50%\)$/.test(c)) ? c : null;
}

function mpTriggerGameOver(){
  mpVomits.forEach(v => { if(v.img) v.img.remove(); });
  mpVomits = [];
  if(gameState !== "playing" && gameState !== "paused") return; // already on the game over screen
  allPlayersDeadFlag = true;
  mpHostPaused = false;
  gameState = "gameover";
  gameOverStart = performance.now();
  goLastKillsShown = null;
  goLastAmmoShown = null;
  goLastTimeShown = null;
  goKillsDone = false;
  goAmmoDone = false;
  goTimeDone = false;
  endTime = performance.now();
  if (kills > highScore) highScore = kills;
  bgMusic.pause();
  bgMusic.currentTime = 0;
}

// Runs on EVERY player (host and clients). When I'm dead and nobody else is alive, go to game over.
// The host also tells everyone else, so all screens switch together.
setInterval(() => {
  if(socket && mpPartyCode && gameState === "playing" && player && !player.alive){
    const someoneAlive = Object.values(remotePlayers).some(rp => rp.alive);
    if(mpVomits.length > 0) return; // let the vomit finish first
    if(!someoneAlive){
      if(mpIsHost && !allDeadAnnounced){
        allDeadAnnounced = true;
        socket.emit("allDead");
      }
      mpTriggerGameOver();
    }
  }
}, 100);

function hostAutoPause(){
  if(gameState !== "playing" || !mpPartyCode || !mpIsHost) return;
  gameState = "paused";
  pauseSelected = 0;
  bgMusic.pause();
  keys = {};
  if(player) player.shootingHeld = false;
  mpSendHostPaused(true);
}
let mpAutoPaused = false; // true only when the pause came from the tab being hidden

document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    // tab hidden / window minimized: pause for everyone
    if(gameState === "playing" && mpPartyCode && mpIsHost){
      hostAutoPause();
      mpAutoPaused = true;
    }
  } else {
    // tab visible again: resume automatically, but only if WE caused the pause
    const wasAuto = mpAutoPaused;
    mpAutoPaused = false;
    if(wasAuto && gameState === "paused" && mpPartyCode && mpIsHost){
      mpStartResumeCountdown();
    }
  }
});

// ================= GIF RECOLOR (white pixels only) =================
const WHITE_THRESHOLD = 215; // a pixel counts as "white" if R, G and B are all >= this (0-255)
let gifRaw = null;            // decoded original frames
let gifTintCache = {};        // color -> ready-to-draw frames
let deathCanvasAnim = null;   // single player death gif drawn on the canvas

function gifLzw(data, minCode, pixelCount){
  const clear = 1 << minCode, eoi = clear + 1;
  let codeSize = minCode + 1, next = eoi + 1;
  const prefix = new Uint16Array(4096), suffix = new Uint8Array(4096), stack = new Uint8Array(4097);
  for(let i = 0; i < clear; i++) suffix[i] = i;
  const out = new Uint8Array(pixelCount);
  let bits = 0, nbits = 0, pos = 0, op = 0, old = -1, first = 0;
  while(op < pixelCount){
    while(nbits < codeSize){
      if(pos >= data.length) return out;
      bits |= data[pos++] << nbits;
      nbits += 8;
    }
    const code = bits & ((1 << codeSize) - 1);
    bits >>= codeSize;
    nbits -= codeSize;
    if(code === clear){ codeSize = minCode + 1; next = eoi + 1; old = -1; continue; }
    if(code === eoi) break;
    if(old === -1){ out[op++] = suffix[code]; old = code; first = code; continue; }
    let cur = code, sp = 0;
    if(code >= next){ stack[sp++] = first; cur = old; }
    while(cur >= clear){ stack[sp++] = suffix[cur]; cur = prefix[cur]; }
    first = suffix[cur];
    stack[sp++] = first;
    if(next < 4096){
      prefix[next] = old;
      suffix[next] = first;
      next++;
      if(next === (1 << codeSize) && codeSize < 12) codeSize++;
    }
    while(sp > 0 && op < pixelCount) out[op++] = stack[--sp];
    old = code;
  }
  return out;
}

function decodeGif(buf){
  const d = new Uint8Array(buf);
  if(String.fromCharCode(d[0], d[1], d[2]) !== "GIF") throw new Error("not a gif");
  const W = d[6] | (d[7] << 8), H = d[8] | (d[9] << 8);
  const flags = d[10];
  let p = 13;
  let gct = null;
  if(flags & 0x80){ const n = 2 << (flags & 7); gct = d.subarray(p, p + n * 3); p += n * 3; }
  const frames = [];
  let canvasData = new Uint8ClampedArray(W * H * 4);
  let gce = { delay: 100, transp: -1, disposal: 0 };
  while(p < d.length){
    const b = d[p++];
    if(b === 0x3B) break;
    if(b === 0x21){
      const label = d[p++];
      if(label === 0xF9){
        const f = d[p + 1];
        gce = {
          disposal: (f >> 2) & 7,
          transp: (f & 1) ? d[p + 4] : -1,
          delay: ((d[p + 2] | (d[p + 3] << 8)) * 10) || 100
        };
      }
      while(d[p] !== 0) p += d[p] + 1;
      p++;
    } else if(b === 0x2C){
      const fx = d[p] | (d[p + 1] << 8), fy = d[p + 2] | (d[p + 3] << 8);
      const fw = d[p + 4] | (d[p + 5] << 8), fh = d[p + 6] | (d[p + 7] << 8);
      const f = d[p + 8];
      p += 9;
      let ct = gct;
      if(f & 0x80){ const n = 2 << (f & 7); ct = d.subarray(p, p + n * 3); p += n * 3; }
      const minCode = d[p++];
      const chunks = []; let total = 0;
      while(d[p] !== 0){ chunks.push(d.subarray(p + 1, p + 1 + d[p])); total += d[p]; p += d[p] + 1; }
      p++;
      const packed = new Uint8Array(total);
      let o = 0;
      chunks.forEach(c => { packed.set(c, o); o += c.length; });
      const idx = gifLzw(packed, minCode, fw * fh);

      // row order (handles interlaced gifs)
      const rowMap = new Array(fh);
      if(f & 0x40){
        let r = 0;
        [[0, 8], [4, 8], [2, 4], [1, 2]].forEach(([start, step]) => {
          for(let y = start; y < fh; y += step) rowMap[r++] = y;
        });
      } else {
        for(let y = 0; y < fh; y++) rowMap[y] = y;
      }

      const before = (gce.disposal === 3) ? canvasData.slice() : null;
      for(let i = 0; i < fw * fh; i++){
        const c = idx[i];
        if(c === gce.transp) continue;
        const row = rowMap[Math.floor(i / fw)], col = i % fw;
        const X = fx + col, Y = fy + row;
        if(X >= W || Y >= H) continue;
        const di = (Y * W + X) * 4;
        canvasData[di]     = ct[c * 3];
        canvasData[di + 1] = ct[c * 3 + 1];
        canvasData[di + 2] = ct[c * 3 + 2];
        canvasData[di + 3] = 255;
      }
      frames.push({ data: canvasData.slice(), delay: Math.max(20, gce.delay) });

      if(gce.disposal === 2){
        for(let y = fy; y < fy + fh && y < H; y++){
          for(let x = fx; x < fx + fw && x < W; x++){
            const di = (y * W + x) * 4;
            canvasData[di] = canvasData[di + 1] = canvasData[di + 2] = canvasData[di + 3] = 0;
          }
        }
      } else if(gce.disposal === 3 && before){
        canvasData = before;
      }
      gce = { delay: 100, transp: -1, disposal: 0 };
    }
  }
  return { w: W, h: H, frames };
}

function hueToRgb(h){ // full saturation, 50% lightness (what the color picker makes)
  const k = n => (n + h / 30) % 12;
  const f = n => 0.5 - 0.5 * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}

// Returns { canvases, delays, total } with the white pixels recolored, or null if the gif isn't loaded yet
function getTintedGif(color){
  if(!gifRaw) return null;
  const key = color || "none";
  if(gifTintCache[key]) return gifTintCache[key];
  let rgb = null;
  const m = /^hsl\((\d{1,3}),100%,50%\)$/.exec(color || "");
  if(m) rgb = hueToRgb(Number(m[1]));
  const canvases = [], delays = [];
  let total = 0;
  gifRaw.frames.forEach(fr => {
    const c = document.createElement("canvas");
    c.width = gifRaw.w;
    c.height = gifRaw.h;
    const cx = c.getContext("2d");
    const img = cx.createImageData(gifRaw.w, gifRaw.h);
    img.data.set(fr.data);
    if(rgb){
      const px = img.data;
      for(let i = 0; i < px.length; i += 4){
        const r = px[i], g = px[i + 1], b = px[i + 2];
        const hi = Math.max(r, g, b), lo = Math.min(r, g, b);
        // gray pixel (the figure and its anti-aliased edges): hi and lo are almost equal.
        // the green vomit has a big gap between them, so it is skipped.
        if(px[i + 3] > 0 && hi - lo <= 12){
          const k = hi / 255; // 1 = pure white, 0 = black
          px[i]     = Math.round(rgb[0] * k);
          px[i + 1] = Math.round(rgb[1] * k);
          px[i + 2] = Math.round(rgb[2] * k);
        }
      }
    }
    cx.putImageData(img, 0, 0);
    canvases.push(c);
    delays.push(fr.delay);
    total += fr.delay;
  });
  gifTintCache[key] = { canvases, delays, total };
  return gifTintCache[key];
}

function drawGifFrames(set, cx, cy, elapsed){
  let t = elapsed % set.total, i = 0;
  while(i < set.delays.length - 1 && t >= set.delays[i]){ t -= set.delays[i]; i++; }
  ctx.drawImage(set.canvases[i], cx - 16, cy - 16, 33, 33);
}

function drawVomits(){
  const now = performance.now();
  const cam = getCameraState();
  for(let i = mpVomits.length - 1; i >= 0; i--){
    const v = mpVomits[i];
    if(now - v.start > VOMIT_DURATION){
      if(v.img) v.img.remove();
      mpVomits.splice(i, 1);
      continue;
    }
    if(v.frames){
      drawGifFrames(v.frames, v.x, v.y, now - v.start);
    } else if(v.img){
      v.img.style.left = (v.x * cam.zoom + cam.x - 16) + "px";
      v.img.style.top  = (v.y * cam.zoom + cam.y - 16) + "px";
      v.img.style.display = "block";
    }
  }
}

// ===== NETWORK TUNING =====
const MP_FAST_MS = 33;   // enemies / bosses / worms + player positions (~30 per second)
const MP_SLOW_MS = 66;   // pickups, cars, bricks, walls etc. (~15 per second)
let mpLastEnemyStateAt = 0;
// True when the connection is backed up (too much unsent data waiting). While that is true we skip
// sending, so packets can't pile up and make everything lag more and more the longer you play.
function mpBackedUp(){
  try {
    const ws = socket && socket.io && socket.io.engine && socket.io.engine.transport && socket.io.engine.transport.ws;
    if(ws && typeof ws.bufferedAmount === "number") return ws.bufferedAmount > 20000;
  } catch(e) {}
  return false;
}
// Smoothing for things the host moves: we draw them slightly in the past and glide between the last
// few snapshots, so uneven packet timing never shows up as stutter.
const MP_INTERP_DELAY = 0;   // not used anymore (kept so the rest of the code still works)

// ===== STEADY PLAYBACK (jitter buffer) =====
// Every packet from the host / other players carries the time it was SENT. We replay movement
// on that sender timeline at a constant speed, a little behind real time, so late or bunched-up
// packets can never make things speed up or slow down.
let mpFrameT = 0;     // time of the current frame (stamped onto outgoing packets)
let mpSnapStamp = 0;  // sender time of the packet currently being processed

function mpNewClock(){ return { base: undefined, jit: 0, pt: undefined, last: 0 }; }

// Call for every packet that arrives. Returns the sender time of that packet.
function mpClockPacket(c, st, now){
  const off = now - st;                                   // how long the packet seems to have taken
  if(c.base === undefined || off < c.base) c.base = off;  // fastest delivery seen = the "true" delay
  else c.base += (off - c.base) * 0.002;                  // and let it follow slow changes
  c.jit += ((off - c.base) - c.jit) * 0.05;               // how bumpy the connection is right now
  return st;
}

// Call once per frame for each clock. Moves the playback time forward at normal speed.
function mpClockTick(c, now){
  if(c.base === undefined) return;
  const delay = Math.max(80, Math.min(220, 60 + 2.5 * c.jit)); // bumpier connection = bigger buffer
  const target = now - c.base - delay;
  if(c.pt === undefined || Math.abs(target - c.pt) > 300){ c.pt = target; }
  else {
    c.pt += Math.min(50, now - c.last);   // advance in real time
    c.pt += (target - c.pt) * 0.04;       // gently steer toward the ideal spot
  }
  c.last = now;
}

let mpHostClock = mpNewClock();

// Remember the last few positions, each stamped with the sender's time.
function mpMakeSnaps(prev, x, y, t){
  const old = (prev && prev.snaps) ? prev.snaps : null;
  const arr = old ? old.slice(-7) : [];
  arr.push({ t: mpSnapStamp, x, y });
  return arr;
}

// Called every frame: place the thing where it was at the playback time.
function mpSampleSnaps(o, renderT, kx, ky){
  const s = o.snaps;
  if(!s || !s.length) return;
  const n = s.length;
  if(typeof renderT !== "number" || isNaN(renderT)) renderT = s[n - 1].t;
  let x, y;
  if(renderT <= s[0].t){ x = s[0].x; y = s[0].y; }
  else {
    let found = false;
    for(let i = 1; i < n; i++){
      if(s[i].t >= renderT){
        const a = s[i - 1], b = s[i];
        if(Math.hypot(b.x - a.x, b.y - a.y) > 300){ x = b.x; y = b.y; }   // teleport / respawn
        else {
          const k = (renderT - a.t) / Math.max(1, b.t - a.t);
          x = a.x + (b.x - a.x) * k;
          y = a.y + (b.y - a.y) * k;
        }
        found = true;
        break;
      }
    }
    if(!found){   // playback caught up with the newest packet: coast a tiny bit
      const a = s[n - 1];
      x = a.x; y = a.y;
      if(n >= 2){
        const b = s[n - 2];
        if(Math.hypot(a.x - b.x, a.y - b.y) < 300){
          const dt = Math.max(1, a.t - b.t);
          const ex = Math.min(80, renderT - a.t);
          x += (a.x - b.x) / dt * ex;
          y += (a.y - b.y) / dt * ex;
        }
      }
    }
  }
  o[kx] = x; o[ky] = y;
}
let mpPendingClientWalls = []; // walls this client placed that the host hasn't confirmed yet

// Keeps each item's last few host positions so clients can glide between snapshots
function mpTweenItems(incoming, prevArr, now){
  const prevById = {};
  (prevArr || []).forEach(o => { if(o.id !== undefined) prevById[o.id] = o; });
  return incoming.map(n => {
    const prev = prevById[n.id];
    return {
      ...n,
      x: prev ? prev.x : n.x,
      y: prev ? prev.y : n.y,
      snaps: mpMakeSnaps(prev, n.x, n.y, now)
    };
  });
}
let mpWallCounter = 0;
const mpR = v => Math.round(v * 10) / 10; // shave decimals off outgoing numbers (smaller packets)

// Back to the title screen after losing the host / connection: stop all in-game audio
// Host left: clean up the game and drop the player on the Create Party / Join Party screen
function mpLeaveToPartyChoice(msg){
  mpError = msg;
  bgMusic.pause();
  bgMusic.currentTime = 0;
  gameOverMusic.pause();
  gameOverMusic.currentTime = 0;
  stopAllSounds();

  // forget the old party
  mpPartyCode = "";
  mpIsHost = false;
  isMultiplayerClient = false;
  mpPlayers = {};
  remotePlayers = {};
  remoteBullets = [];
  mpHostPaused = false;
  mpClientCountdownStart = 0;
  mpCountdownStart = 0;
  if(mpCountdownTimer){ clearTimeout(mpCountdownTimer); mpCountdownTimer = null; }
  mpVomits.forEach(v => { if(v.img) v.img.remove(); });
  mpVomits = [];
  keys = {};
  if(player) player.shootingHeld = false;

  // hide the single player death gif if it was showing
  const dg = document.getElementById("deathGif");
  if(dg) dg.style.display = "none";

  mpChoiceIndex = 0;
  gameState = "mpchoice";
  playTitleMusic();
}

function mpLeaveToTitle(msg){
  mpError = msg;
  bgMusic.pause();
  bgMusic.currentTime = 0;
  gameOverMusic.pause();
  gameOverMusic.currentTime = 0;
  stopAllSounds();
  mpPartyCode = "";
  mpIsHost = false;
  isMultiplayerClient = false;
  remotePlayers = {};
  remoteBullets = [];
  gameState = "title";
  showTitleScreen();
}

function mpConnect(){
  if(socket) return;
  socket = io(MP_SERVER_URL, { transports: ["websocket", "polling"] });

  socket.on("partyCreated", (data) => {
    mpCreating = false;
    mpReviveMode = false;
    mpPartyCode = data.code;
    mpIsHost = true;
    gameState = "mplobby";
  });

  socket.on("partyJoined", (data) => {
    mpReviveMode = false;
    mpCheatsMode = "host";
    mpPartyCode = data.code;
    mpIsHost = false;
    gameState = "mplobby";
  });

  socket.on("publicParties", (list) => {
    mpPublicLoading = false;
    mpPublicList = Array.isArray(list) ? list.slice(0, 200) : [];
    if(mpPublicSel >= mpPublicList.length) mpPublicSel = Math.max(0, mpPublicList.length - 1);
  });

  socket.on("joinError", (msg) => {
    mpError = msg;
  });

  socket.on("playerListUpdate", (players) => {
    mpPlayers = players;
  });

  socket.on("gameStarted", () => {
    stopTitleMusic();
    openWorldMode = false;
    followCameraMode = false;
    mpApplyGameMode(mpGameMode);
    isMultiplayerClient = !!mpPartyCode && !mpIsHost;
    gameState = "playing";
    resetGame();
    bgMusic.play();
  });

  socket.on("enemyState", (data) => {
    if(mpIsHost) return; // host is authoritative — ignore our own reflected data

    // host pressed Retry on the game over screen
    if(data.retry){
      if(gameState === "gameover" || gameState === "playing" || gameState === "paused") mpRestartRun();
      return;
    }
    // host revived someone
    if(data.revive !== undefined){
      mpDeadPlayers.delete(data.revive);
      if(socket && data.revive === socket.id) mpReviveSelf();
      return;
    }
    // host started the 3-2-1 before resuming
    if(data.hostCountdown){ mpClientCountdownStart = performance.now(); return; }
    // cheats setting from the host
    if(data.cheatsMode !== undefined){ mpCheatsMode = data.cheatsMode; }
    if(data.gameMode !== undefined && data.gameMode !== mpGameMode){ mpApplyGameMode(data.gameMode); }
    if(data.instakill !== undefined){ instakillEnabled = !!data.instakill; }
    if(data.infammo !== undefined){ infAmmoEnabled = !!data.infammo; }
    if(data.reviveMode !== undefined){ mpReviveMode = !!data.reviveMode; }
    if(data.partyName !== undefined){ mpPartyName = String(data.partyName).slice(0, 24); mpNameForCode = mpPartyCode; }
    if(data.partyPublic !== undefined){ mpPublic = !!data.partyPublic; }
    if(data.difficulty !== undefined){ mpDifficultyShown = data.difficulty; }
    // host paused / resumed
    if(data.hostPaused !== undefined){
      mpHostPaused = !!data.hostPaused;
      mpClientCountdownStart = 0;
      if(mpHostPaused){
        bgMusic.pause();
        keys = {};
        if(player) player.shootingHeld = false;
      } else if(gameState === "playing"){
        bgMusic.play().catch(()=>{});
      }
      return;
    }

    const nowTween = performance.now();
    const mpHasT = typeof data.t === "number";
    if(mpHasT || data.enemies !== undefined || data.pickups !== undefined){
      mpSnapStamp = mpClockPacket(mpHostClock, mpHasT ? data.t : nowTween, nowTween);
    }

    if(data.enemies !== undefined){
    // adaptive tween length = how long since the previous fast packet
    const tweenDur = mpLastEnemyStateAt ? Math.max(30, Math.min(120, nowTween - mpLastEnemyStateAt)) : MP_FAST_MS;
    mpLastEnemyStateAt = nowTween;

    const inE = (data.enemies || []).filter(e => !pendingLocalRemovals.enemies.has(e.id));
    pendingLocalRemovals.enemies.forEach(id => { if(!(data.enemies||[]).some(e=>e.id===id)) pendingLocalRemovals.enemies.delete(id); });
    Object.keys(mpEnemyDamage).forEach(k => { if(!(data.enemies||[]).some(e=>String(e.id)===k)) delete mpEnemyDamage[k]; });
    const prevEnemiesById = {};
    enemies.forEach(e => { prevEnemiesById[e.id] = e; });

    // Show death particles for enemies that vanished elsewhere (another
    // player's bullet/car/sword), since we weren't the one who killed them.
    const newEnemyIds = new Set(inE.map(e=>e.id));
    Object.keys(prevEnemiesById).forEach(idStr => {
      const id = Number(idStr);
      if(!newEnemyIds.has(id) && !pendingLocalRemovals.enemies.has(id)){
        const prev = prevEnemiesById[idStr];
        for (let i = 0; i < 6; i++) {
          blood.push({
            x: prev.x, y: prev.y,
            dx: (Math.random() - 0.5) * 2,
            dy: (Math.random() - 0.5) * 2,
            life: 40
          });
        }
      }
    });

    enemies = inE.map(ne => {
      const prev = prevEnemiesById[ne.id];
      const full = ne.ik !== undefined;   // slim packets leave out the fields that never change
      return {
        bird: prev ? prev.bird : egyptianBirds[0],
        maxHealth: prev ? prev.maxHealth : ENEMY_MAX_HEALTH,
        ...ne,
        instaKill: full ? !!ne.ik : (prev ? !!prev.instaKill : false),
        health: ne.health - (mpEnemyDamage[ne.id] || 0),
        noDamage: full ? !!ne.nd : (prev ? !!prev.noDamage : false),
        x: prev ? prev.x : ne.x,
        y: prev ? prev.y : ne.y,
        snaps: mpMakeSnaps(prev, ne.x, ne.y, nowTween)
      };
    });

    const inBRaw = data.bossEnemies || [];
    Array.from(mpKilledBosses).forEach(id => { if(!inBRaw.some(b=>b.id===id)) mpKilledBosses.delete(id); });
    const inB = inBRaw.filter(b => !mpKilledBosses.has(b.id));
    const prevBossById = {};
    bossEnemies.forEach(e => { if(e.id !== undefined) prevBossById[e.id] = e; });
    bossEnemies = inB.map(ne0 => {
      const ne = { ...ne0, health: ne0.health - (mpBossDamage[ne0.id] || 0) };
      const prev = ne.id !== undefined ? prevBossById[ne.id] : undefined;
      return {
        ...ne,
        x: prev ? prev.x : ne.x,
        y: prev ? prev.y : ne.y,
        snaps: mpMakeSnaps(prev, ne.x, ne.y, nowTween)
      };
    });

    const prevWormsById = {};
    worms.forEach(w => { prevWormsById[w.id] = w; });

    const inW = data.worms || [];
    const newWormIds = new Set(inW.map(w=>w.id));

    // Worm took damage elsewhere — show hit particles even though we
    // weren't the shooter.
    inW.forEach(nw => {
      const prev = prevWormsById[nw.id];
      if(prev && nw.segments < prev.segments && !pendingLocalRemovals.worms.has(nw.id)){
        for (let i = 0; i < 8; i++) {
          blood.push({
            x: nw.x, y: nw.y,
            dx: (Math.random() - 0.5) * 2,
            dy: (Math.random() - 0.5) * 2,
            life: 30
          });
        }
      }
    });

    // Worm fully died elsewhere — show the death burst.
    Object.keys(prevWormsById).forEach(idStr => {
      const id = Number(idStr);
      if(!newWormIds.has(id) && !pendingLocalRemovals.worms.has(id)){
        const prev = prevWormsById[idStr];
        for (let p = 0; p < 12; p++) {
          blood.push({
            x: prev.x, y: prev.y,
            dx: (Math.random() - 0.5) * 3,
            dy: (Math.random() - 0.5) * 3,
            life: 40
          });
        }
      }
    });

    worms = inW.filter(w => !pendingLocalRemovals.worms.has(w.id)).map(w=>({...w, segmentSpacing:7}));
    pendingLocalRemovals.worms.forEach(id => { if(!inW.some(w=>w.id===id)) pendingLocalRemovals.worms.delete(id); });
    // enemy bullets from the host: hurt me locally, then I tell nobody — host doesn't need to know
    if(data.enemyBullets !== undefined){
      const oldById = {};
      bullets.forEach(b => { if(b.enemyBullet && b.nid !== undefined) oldById[b.nid] = b; });
      bullets = bullets.filter(b => !b.enemyBullet);
      const stillThere = new Set();
      data.enemyBullets.forEach(nb => {
        stillThere.add(nb.nid);
        if(mpEnemyBulletsHit.has(nb.nid)) return;
        const old = oldById[nb.nid];
        bullets.push({ x: nb.x, y: nb.y, dx: nb.dx, dy: nb.dy, glyph: nb.glyph, nid: nb.nid, dmg: nb.dmg, enemyBullet: true, trail: old ? old.trail : [] });
      });
      mpEnemyBulletsHit.forEach(id => { if(!stillThere.has(id)) mpEnemyBulletsHit.delete(id); });
    }
    if(data.waves) mpApplyWaves(data.waves);
    } // end fast group (enemies / bosses / worms)

    if(data.pickups !== undefined){
    const inP = data.pickups || [];
    pickups = mpTweenItems(inP.filter(p => !pendingLocalRemovals.pickups.has(p.id)), pickups, nowTween);
    pendingLocalRemovals.pickups.forEach(id => { if(!inP.some(p=>p.id===id)) pendingLocalRemovals.pickups.delete(id); });

    const inG = data.gunPickups || [];
    gunPickups = mpTweenItems(inG.filter(g => !pendingLocalRemovals.gunPickups.has(g.id)), gunPickups, nowTween);
    pendingLocalRemovals.gunPickups.forEach(id => { if(!inG.some(g=>g.id===id)) pendingLocalRemovals.gunPickups.delete(id); });

    const inH = data.healthKits || [];
    healthKits = mpTweenItems(inH.filter(h => !pendingLocalRemovals.healthKits.has(h.id)), healthKits, nowTween);
    pendingLocalRemovals.healthKits.forEach(id => { if(!inH.some(h=>h.id===id)) pendingLocalRemovals.healthKits.delete(id); });

    const inM = data.magnetPickups || [];
    Magnetpickup = mpTweenItems(inM.filter(m => !pendingLocalRemovals.magnetPickups.has(m.id)), Magnetpickup, nowTween);
    pendingLocalRemovals.magnetPickups.forEach(id => { if(!inM.some(m=>m.id===id)) pendingLocalRemovals.magnetPickups.delete(id); });

    const inBrk = data.bricks || [];
    bricks = mpTweenItems(inBrk.filter(b => !pendingLocalRemovals.brickPickups.has(b.id)), bricks, nowTween);
    pendingLocalRemovals.brickPickups.forEach(id => { if(!inBrk.some(b=>b.id===id)) pendingLocalRemovals.brickPickups.delete(id); });

    const inCars = data.cars || [];
    cars = inCars.filter(c => !pendingLocalRemovals.cars.has(c.id));
    pendingLocalRemovals.cars.forEach(id => { if(!inCars.some(c=>c.id===id)) pendingLocalRemovals.cars.delete(id); });

    // ===== shared walls (host is authoritative) =====
    if(data.walls !== undefined){
      const prevWallById = {};
      walls.forEach(w => { if(w.id !== undefined) prevWallById[w.id] = w; });
      const nowW = performance.now();
      const incomingWalls = data.walls.map(hw => {
        const prevW = prevWallById[hw.id];
        return {
          id: hw.id, cid: hw.cid, x: hw.x, y: hw.y, w: hw.w, h: hw.h,
          health: hw.health, life: hw.life,
          shake: (prevW && hw.health < prevW.health) ? 53 : (prevW ? (prevW.shake || 0) : 0)
        };
      });
      const confirmed = new Set(incomingWalls.map(w => w.cid).filter(c => c));
      mpPendingClientWalls = mpPendingClientWalls.filter(p => !confirmed.has(p.cid) && nowW - p.t < 2500);
      // keep walls I just placed visible until the host confirms them
      mpPendingClientWalls.forEach(p => incomingWalls.push(p.wall));
      walls = incomingWalls;
    }
    } // end slow group
  });

  socket.on("ammoGrant", (data)=>{ player.ammo += data.amount; playSound("https://file.garden/Zfwe_2Ig9weivlFh/pickup.wav"); });
  socket.on("healthGrant", (data)=>{
    player.health = Math.min(player.maxHealth, player.health + data.amount);
    playSound("https://file.garden/Zfwe_2Ig9weivlFh/pickup.wav");
    flashAlpha = 1;
    for (let i = 0; i < 20; i++) {
      blood.push({
        x: player.x,
        y: player.y,
        dx: (Math.random() - 0.5) * 3,
        dy: (Math.random() - 0.5) * 3,
        life: 40,
        color: "white"
      });
    }
  });
  socket.on("magnetGrant", ()=>{ spawnMagnet(); playSound("https://file.garden/Zfwe_2Ig9weivlFh/pickup.wav"); });
  socket.on("gunGrant", (data)=>{
    const gkey = data.gunKey;
    if (gkey === "nuke") { ensureInInventory("nuke"); player.nukes=(player.nukes||0)+1; }
    else if (player.inventory.includes(gkey)) { player.ammo += 15; }
    else { ensureInInventory(gkey); }
    player.currentGunKey = gkey;
    playSound("https://file.garden/Zfwe_2Ig9weivlFh/pickup.wav");
  });

  // Host-only: apply a client-reported kill/pickup so it syncs to everyone
  socket.on("killEnemy", (data)=>{
    if(!mpIsHost || !data) return;
    const bossIdx = bossEnemies.findIndex(b => b.id === data.id);
    if(bossIdx !== -1){
      const be = bossEnemies[bossIdx];
      bossEnemies.splice(bossIdx, 1);
      if (tree && tree.state === "alive") { tree.bar = 1; triggerTreeBarUp(); }
      killPop = 1;
      killPopColor = 1;
      for (let i = 0; i < 16; i++) {
        blood.push({ x: be.x, y: be.y, dx: (Math.random() - 0.5) * 4, dy: (Math.random() - 0.5) * 4, life: 35 });
      }
      mpBroadcastFast();
      return;
    }
    const idx = enemies.findIndex(e => e.id === data.id);
    if(idx !== -1){
      const e = enemies[idx];
      if (e.fromTree) {
          if (e.aliveSound) e.aliveSound.pause();
          playSound("https://file.garden/Zfwe_2Ig9weivlFh/bloodtree_Creaturedeath.mp3");
      }
      enemies.splice(idx, 1);
      if (tree && tree.state === "alive") { tree.bar = 1; triggerTreeBarUp(); }
      killPop = 1;
      killPopColor = 1;
      for (let i = 0; i < 6; i++) {
        blood.push({
          x: e.x, y: e.y,
          dx: (Math.random() - 0.5) * 2,
          dy: (Math.random() - 0.5) * 2,
          life: 40
        });
      }
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/bird%20death.wav");
      mpBroadcastFast();
    }
  });

  socket.on("collectItem", (data)=>{
    if(!mpIsHost || !data) return;
    if(data.type==="ammo"){ pickups = pickups.filter(p=>p.id!==data.id); }
    else if(data.type==="gun"){ gunPickups = gunPickups.filter(g=>g.id!==data.id); }
    else if(data.type==="health"){ healthKits = healthKits.filter(h=>h.id!==data.id); }
    else if(data.type==="magnet"){
      Magnetpickup = Magnetpickup.filter(m=>m.id!==data.id);
      if(data.pid){
        mpHostMagnets = mpHostMagnets.filter(m => m.pid !== data.pid);
        mpHostMagnets.push({ pid: data.pid, time: __magnet_duration_frames });
      }
    }
    else if(data.type==="brick"){ bricks = bricks.filter(b=>b.id!==data.id); }
    else if(data.type==="car"){ cars = cars.filter(c=>c.id!==data.id); }
    else if(data.type==="dropAmmo"){
      const dax = Number(data.x), day = Number(data.y);
      if(!Number.isFinite(dax) || !Number.isFinite(day)) return;
      if(pickups.length >= 300) return;
      const dsx = Number(data.sx), dsy = Number(data.sy);
      if(Number.isFinite(dsx) && Number.isFinite(dsy)) pickups.push({ id: nextItemId++, x: dsx, y: dsy, tw: { sx: dsx, sy: dsy, tx: dax, ty: day, start: performance.now(), dur: 400 } });
      else pickups.push({ id: nextItemId++, x: dax, y: day });
    }
    else if(data.type==="bossHit"){
      if(boss.active && boss.state === "fight"){
        const bd = Number(data.dmg);
        if(Number.isFinite(bd) && bd > 0) bossDamage(Math.min(bd, boss.maxHp), boss.x, boss.y);
      }
    }
    else if(data.type==="wall"){
      const wx = Number(data.x), wy = Number(data.y), ww = Number(data.w), wh = Number(data.h);
      if(![wx,wy,ww,wh].every(Number.isFinite)) return;
      if(walls.length >= 200) return;
      walls.push({
        id: nextItemId++, cid: data.cid,
        x: wx, y: wy,
        w: Math.min(ww, HAMMER_WALL_HEIGHT), h: Math.min(wh, HAMMER_WALL_HEIGHT),
        health: 3, life: 90000, shake: 0
      });
      for (let i = 0; i < 8; i++) {
        blood.push({ x: wx + (Math.random()-0.5)*10, y: wy + (Math.random()-0.5)*10,
                     dx: (Math.random()-0.5)*2, dy: (Math.random()-0.5)*2, life: 20, char: "`" });
      }
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/dropgun.wav");
    }
    mpBroadcastSlow(); // tell everyone right away instead of waiting for the next tick
  });

  socket.on("wormHit", (data)=>{
    if(!mpIsHost || !data) return;
    const w = worms.find(w=>w.id === data.id);
    if(!w) return;

    const removed = Math.min(data.damageSegments || 5, w.segments);
    w.segments = Math.max(0, w.segments - (data.damageSegments || 5));

    for (let s = 0; s < removed; s++) {
      pickups.push({
        id: nextItemId++,
        x: w.x + (Math.random() - 0.5) * 20,
        y: w.y + (Math.random() - 0.5) * 20
      });
    }

    playSound("https://file.garden/Zfwe_2Ig9weivlFh/worm_dying2.wav");
    for (let i = 0; i < 8; i++) {
      blood.push({ x: w.x, y: w.y, dx: (Math.random()-0.5)*2, dy: (Math.random()-0.5)*2, life: 30 });
    }

    if (w.segments <= 0) {
      if (Math.random() < 0.4) {
        gunPickups.push({ id: nextItemId++, x: w.x, y: w.y, gunKey: "rocketLauncher", glyph: GUNS["rocketLauncher"].glyph, bob: 0 });
      }

      if (tree && tree.state === "alive") { tree.bar = 1; triggerTreeBarUp(); }
      killPop = 1.4;
      killPopColor = 1.2;

      for (let p = 0; p < 12; p++) {
        blood.push({ x: w.x, y: w.y, dx: (Math.random()-0.5)*3, dy: (Math.random()-0.5)*3, life: 40 });
      }

      const idx = worms.indexOf(w);
      if (idx !== -1) worms.splice(idx, 1);
    }
    mpBroadcastFast();
  });

  socket.on("playerDied", (data)=>{
    if(!data || !data.id) return;
    if(!mpDeadPlayers.has(data.id) && data.id !== socket.id){
      const dName = (mpPlayers[data.id] && mpPlayers[data.id].username)
        || (mpStats[data.id] && mpStats[data.id].name)
        || (remotePlayers[data.id] && remotePlayers[data.id].username)
        || "Someone";
      mpAddDeathMsg(dName);
    }
    mpDeadPlayers.add(data.id);
    delete remotePlayers[data.id];
  });

  socket.on("allDead", ()=>{
    const mpRid = mpRunId; setTimeout(() => { if(mpRid === mpRunId) mpTriggerGameOver(); }, 2300); // let the last vomit finish (skipped if a new run already started)
    return;
    mpTriggerGameOver();
  });
  socket.on("bulletFired", (data) => {
    if(data.stats){
      if(data.id !== undefined) mpStats[data.id] = { name: String(data.name || "?").slice(0, 20), k: Number(data.k) || 0, hp: Number(data.hp) || 0, bk: Number(data.bk) || 0, lv: (data.lv !== undefined ? Number(data.lv) : undefined) };
      return;
    }
    if(data.vomit){ mpAddVomit(data.x, data.y, mpSafeColor(data.color)); return; }
    if(data.dn){
      const dnName = String(data.name || "Someone").slice(0, 20);
      mpDownedPlayers[data.id] = { x: Number(data.x) || 0, y: Number(data.y) || 0, name: dnName, color: data.color, at: performance.now() };
      delete remotePlayers[data.id];
      mpAddSaveMsg(dnName);
      return;
    }
    if(data.rvd){ delete mpDownedPlayers[data.id]; return; }
    if(data.rv !== undefined){ if(socket && data.rv === socket.id && mpDowned) mpReviveSelf(); return; }
    if(data.hurt){ mpRemoteBlood(data.x, data.y); return; }
    if(data.nblood){ spawnNewBlood(data.x, data.y, data.a || 0, true); return; }
    if(data.nuke){ mpRemoteNukeVisual(data); return; }
    if(data.rboom){ mpRemoteRocketBoom(data); return; }
    if(data.mg){
      // machine gun bullet that bounces off the screen edges
      remoteBullets.push({ x: data.x, y: data.y, dx: data.dx, dy: data.dy, trail: [], life: 90, bouncesLeft: 3 });
    } else if(data.bnc){
      // doublebarrel pellet that bounces off the walls once
      remoteBullets.push({ x: data.x, y: data.y, dx: data.dx, dy: data.dy, trail: [], life: 90, bouncesLeft: data.bnc, wallOnly: true });
    } else if(data.rocket){
      remoteBullets.push({ x: data.x, y: data.y, dx: data.dx, dy: data.dy, trail: [], life: 300, isRocket: true });
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/rocket%20launcher%20shoot.wav");
      muzzleFlashes.push({ x: data.x, y: data.y, life: 6 });
    } else if(data.bh){
      mpSpawnRemoteBlackHole(data);
    } else if(data.rail){
      // railgun: a whole row of beam pellets + a big muzzle flash
      const rAng = Math.atan2(data.dy, data.dx);
      const rPerp = rAng + Math.PI / 2;
      const rSp = data.spacing || 7;
      const rHalf = (data.rail - 1) / 2;
      for(let i = 0; i < data.rail; i++){
        const off = (i - rHalf) * rSp;
        remoteBullets.push({
          x: data.x + Math.cos(rPerp) * off,
          y: data.y + Math.sin(rPerp) * off,
          dx: data.dx, dy: data.dy, trail: [], life: 90
        });
      }
      muzzleFlashes.push({ x: data.x + Math.cos(rAng) * 24, y: data.y + Math.sin(rAng) * 24, angle: rAng, life: 8, maxLife: 8, size: 20 });
    } else {
      remoteBullets.push({
        x: data.x,
        y: data.y,
        dx: data.dx,
        dy: data.dy,
        trail: [],
        life: 90
      });
    }

    if(data.id !== undefined && remotePlayers[data.id]){
      const rp = remotePlayers[data.id];
      const rGun = GUNS[rp.gunKey || "pistol"];
      const rDeg = rGun?.recoilStrength ?? 6;
      const rBack = rGun?.recoilBack ?? 4;
      const rAngle = Math.atan2(data.dy, data.dx);
      const rFlip = (Math.cos(rAngle) < 0) ? -1 : 1;
      rp.recoilAngle = 0;
      rp.recoilBack = 0;
      rp.recoilVelAngle = -(rDeg * Math.PI/180) * 1.5 * rFlip;
      rp.recoilVelBack = rBack * 1.5;
      rp.recoilRecovery = rGun?.recoilRecovery ?? 0.9;
    }
  });

  socket.on("killEnemy", (data)=>{
    if(!mpIsHost || !data) return;
    const idx = enemies.findIndex(e => e.id === data.id);
    if(idx !== -1){
      const e = enemies[idx];
      if (e.fromTree) {
          if (e.aliveSound) e.aliveSound.pause();
          playSound("https://file.garden/Zfwe_2Ig9weivlFh/bloodtree_Creaturedeath.mp3");
      }
      enemies.splice(idx, 1);
      kills++;
      if (tree && tree.state === "alive") { tree.bar = 1; triggerTreeBarUp(); }
      killPop = 1;
      killPopColor = 1;
      for (let i = 0; i < 6; i++) {
        blood.push({
          x: e.x, y: e.y,
          dx: (Math.random() - 0.5) * 2,
          dy: (Math.random() - 0.5) * 2,
          life: 40
        });
      }
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/bird%20death.wav");
    }
  });

  socket.on("posUpdate", (data) => {
    if(mpDeadPlayers.has(data.id) || mpDownedPlayers[data.id]) return;
    const existing = remotePlayers[data.id];
    const nowTween = performance.now();
    const rpClock = (existing && existing.clock) ? existing.clock : mpNewClock();
    mpSnapStamp = mpClockPacket(rpClock, (typeof data.t === "number") ? data.t : nowTween, nowTween);
    remotePlayers[data.id] = {
      ...data,
      clock: rpClock,
      displayX: existing && existing.displayX !== undefined ? existing.displayX : data.x,
      displayY: existing && existing.displayY !== undefined ? existing.displayY : data.y,
      snaps: mpMakeSnaps(existing, data.x, data.y, mpSnapStamp),
      lastPosAt: nowTween,
      // keep animation state so recoil / aim don't reset on every packet
      shownAim: existing ? existing.shownAim : undefined,
      shownRail: existing ? existing.shownRail : undefined,
      recoilAngle: existing ? existing.recoilAngle : undefined,
      recoilBack: existing ? existing.recoilBack : undefined,
      recoilVelAngle: existing ? existing.recoilVelAngle : undefined,
      recoilVelBack: existing ? existing.recoilVelBack : undefined,
      recoilRecovery: existing ? existing.recoilRecovery : undefined
    };
  });

  socket.on("playerLeft", (id) => {
    delete remotePlayers[id];
    delete mpDownedPlayers[id];
  });

  socket.on("hostLeft", () => { mpLeaveToPartyChoice("Host left the party"); });
  socket.on("disconnect", () => {
    if(mpPartyCode && gameState !== "title") mpLeaveToTitle("Disconnected from the game");
  });
}
// ===== HOST BROADCAST =====
// Fast packet (~30/sec): the things that move a lot. Sent "volatile" so a late
// packet is dropped instead of queueing up and causing rubber-banding.
function mpBuildFast(){
  return {
    t: mpFrameT,
    enemies: enemies.map(e=>{
      const o = { id:e.id, x:mpR(e.x), y:mpR(e.y), health:e.health };
      e._mpN = (e._mpN || 0) + 1;
      // the fields that never change are only sent for new enemies and then once every ~0.5s
      if(e._mpN <= 4 || e._mpN % 15 === 0){ o.bird = e.bird; o.maxHealth = e.maxHealth; o.ik = e.instaKill ? 1 : 0; o.nd = e.noDamage ? 1 : 0; }
      return o;
    }),
    enemyBullets: bullets.filter(b=>b.enemyBullet && b.nid!==undefined).map(b=>({nid:b.nid,x:mpR(b.x),y:mpR(b.y),dx:Math.round(b.dx*100)/100,dy:Math.round(b.dy*100)/100,glyph:b.glyph,dmg:b.dmg})),
    waves: wavesMode ? mpBuildWaves() : undefined,
    bossEnemies: bossEnemies.map(e=>({id:e.id,x:mpR(e.x),y:mpR(e.y),health:e.health,maxHealth:e.maxHealth,gug:e.gug?1:0})),
    worms: worms.map(w=>({id:w.id,x:mpR(w.x),y:mpR(w.y),segments:w.segments,
      history:w.history.slice(0,(w.segments*w.segmentSpacing)+30).map((p,k)=>(k===0||k===3||k%7===0||k%7===4)?{x:mpR(p.x),y:mpR(p.y)}:null)}))
  };
}
// Slow packet (~15/sec, plus instantly when something changes): items + walls.
function mpBuildSlow(){
  return {
    t: mpFrameT,
    cheatsMode: mpCheatsMode,
    gameMode: mpGameMode,
    instakill: instakillEnabled ? 1 : 0,
    infammo: infAmmoEnabled ? 1 : 0,
    reviveMode: mpReviveMode ? 1 : 0,
    pickups: pickups.map(p=>({id:p.id,x:p.x,y:p.y,tw:p.tw?1:0})),
    gunPickups: gunPickups.map(g=>({id:g.id,x:g.x,y:g.y,gunKey:g.gunKey,glyph:g.glyph,bob:g.bob,rotation:g.rotation})),
    healthKits: healthKits.map(h=>({id:h.id,x:h.x,y:h.y})),
    magnetPickups: Magnetpickup.map(m=>({id:m.id,x:m.x,y:m.y})),
    bricks: bricks.map(b=>({id:b.id,x:b.x,y:b.y,life:b.life})),
    cars: cars.map(c=>({id:c.id,x:c.x,y:c.y,glyph:c.glyph,bob:c.bob})),
    walls: walls.filter(w=>w.id!==undefined).map(w=>({id:w.id,cid:w.cid,x:w.x,y:w.y,w:w.w,h:w.h,health:w.health,life:w.life}))
  };
}
function mpBuildWaves(){
  const r2 = v => Math.round(v * 100) / 100;
  return {
    n: wv.n, st: wv.state, tm: wv.timer, ts: wv.toSpawn + wv.toSpawnShooters,
    bt: wv.bannerT, bm: wv.bannerMax, bx: wv.bannerText, bs: wv.bannerSub,
    b: boss.active ? { s: boss.state, x: mpR(boss.x), y: mpR(boss.y), z: Math.round(boss.z || 0), hp: Math.round(boss.hp), mh: boss.maxHp, t: boss.t, h: r2(boss.hit), ph: boss.phase, d: boss.dyingT, l: boss.label } : null,
    mi: (boss.active && boss.mini) ? boss.mini.map(m => ({ x: mpR(m.x), y: mpR(m.y), a: r2(m.ang), k: m.key, s: m.size, r: Math.round(m.reach), t: m.t, w: m.warm, c: r2(m.kick), p: r2(m.ph) })) : [],
    rk: bossRockets.map(r => ({ id: r.id, x: mpR(r.x), y: mpR(r.y), tx: mpR(r.tx), ty: mpR(r.ty), a: r2(r.ang), t: r.t })),
    bl: bossBlasts.map(b => ({ id: b.id, x: mpR(b.x), y: mpR(b.y), r: Math.round(b.radius), m: b.maxR, l: b.life, ml: b.maxLife }))
  };
}

let mpBlastHit = new Set();
let mpBlastSeen = {};
function mpApplyWaves(w){
  wv.n = w.n; wv.state = w.st; wv.timer = w.tm; wv.toSpawn = w.ts; wv.toSpawnShooters = 0;
  wv.bannerT = w.bt; wv.bannerMax = Math.max(1, w.bm); wv.bannerText = w.bx; wv.bannerSub = w.bs;

  if(w.b){
    const first = !boss.active;
    boss.active = true;
    boss.state = w.b.s; boss.hp = w.b.hp; boss.maxHp = w.b.mh; boss.t = w.b.t;
    boss.phase = w.b.ph; boss.dyingT = w.b.d; boss.label = w.b.l;
    boss.tx = w.b.x; boss.ty = w.b.y; boss.tz = w.b.z;
    if(first){
      boss.x = w.b.x; boss.y = w.b.y; boss.z = w.b.z; boss.hit = 0;
      window.lastWormWarning = { text: "⚠ WAVE " + wv.n + " — SOMETHING IS COMING ⚠", t: performance.now(), duration: 3200 };
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/tree_death_loud.mp3");
    }
    if(w.b.h > boss.hit) boss.hit = w.b.h;
    boss.mini = (w.mi || []).map(m => ({ x: m.x, y: m.y, ang: m.a, key: m.k, size: m.s, reach: m.r, t: m.t, warm: m.w, kick: m.c, ph: m.p }));
  } else if(boss.active){
    boss.active = false; boss.state = "none"; boss.mini = [];
  }

  bossRockets.length = 0;
  (w.rk || []).forEach(r => bossRockets.push({ id: r.id, x: r.x, y: r.y, tx: r.tx, ty: r.ty, ang: r.a, t: r.t }));

  bossBlasts.length = 0;
  (w.bl || []).forEach(b => {
    bossBlasts.push({ id: b.id, x: b.x, y: b.y, radius: b.r, maxR: b.m, life: b.l, maxLife: b.ml });
    if(!mpBlastSeen[b.id]){
      mpBlastSeen[b.id] = true;
      shakeTime = Math.max(shakeTime, 30);
      playSound("https://file.garden/Zfwe_2Ig9weivlFh/explotion.wav");
    }
  });
  mpBlastHit.forEach(id => { if(!bossBlasts.some(b => b.id === id)) mpBlastHit.delete(id); });
  Object.keys(mpBlastSeen).forEach(k => { if(!bossBlasts.some(b => String(b.id) === k)) delete mpBlastSeen[k]; });
}

function handleConsoleCommand(cmd) {
    if (cmd.trim().toLowerCase().startsWith("/revive")) {
        window.lastConsoleCommand = null;
        if (!(socket && mpPartyCode && mpIsHost)) return;   // host only
        const wanted = cmd.trim().slice(7).trim().toLowerCase();
        if (!wanted) return;
        let targetId = null;
        Object.keys(mpPlayers).forEach(id => {
            if (mpPlayers[id] && String(mpPlayers[id].username).toLowerCase() === wanted) targetId = id;
        });
        if (!targetId) {
            Object.keys(mpStats).forEach(id => {
                if (String(mpStats[id].name).toLowerCase() === wanted) targetId = id;
            });
        }
        if (wanted === String(mpUsername).toLowerCase() || targetId === socket.id) {
            mpReviveSelf();
            return;
        }
        if (!targetId) return;
        mpDeadPlayers.delete(targetId);
        socket.emit("enemyState", { revive: targetId });
        return;
    }
    if (cmd.trim() === "/skipwaves") {
        window.lastConsoleCommand = null;   // so pressing Enter again doesn't re-run it
        if (mpCheatsAllowed()) wavesSkipToBoss();
        return;
    }
    if (!cmd.startsWith("/runfunction ")) return;
    if (!mpCheatsAllowed()) return;

    try {
        const jsCode = cmd.replace("/runfunction ", "");
        console.log("Running: " + jsCode);
        eval(jsCode);
    } catch (err) {
        console.error("Error running function:", err);
    }
}

function dropItem(itemIndex, playerPosition) {
  if (itemIndex < 0 || itemIndex >= inventory.length) return;

  const item = inventory.splice(itemIndex, 1)[0]; // Remove from inventory

  // Place the item in the world at player's position
  const worldItem = {
    ...item,
    x: playerPosition.x,
    y: playerPosition.y,
    pickUp: function(playerInventory) {
      playerInventory.push(this);
      removeWorldItem(this);
    }
  };

  worldItems.push(worldItem);
  console.log(`Dropped ${item.name} at (${playerPosition.x}, ${playerPosition.y})`);
}

function removeWorldItem(item) {
  worldItems = worldItems.filter(i => i !== item);
}

let allSounds = [];            // every sound element we have made (so stopAllSounds can silence them)
const __soundPools = {};       // url -> list of reusable audio elements
function playSound(url){
    let pool = __soundPools[url];
    if(!pool) pool = __soundPools[url] = [];
    let s = null;
    for(let i = 0; i < pool.length; i++){
        if(pool[i].paused || pool[i].ended){ s = pool[i]; break; }   // reuse one that is free
    }
    if(!s){
        if(pool.length < 8){
            s = new Audio(url);          // only make a new one if we really need it
            pool.push(s);
            allSounds.push(s);
        } else {
            s = pool.shift();            // all busy: restart the oldest one
            pool.push(s);
        }
    }
    try { s.currentTime = 0; } catch(e) {}
    s.play().catch(() => {});
}

// ==============================
// UNIVERSAL PULL FUNCTION
// ==============================
function magnetPullObjects(arr, pullStrength, targetX, targetY) {
    if (!Array.isArray(arr)) return;

    for (let i = arr.length - 1; i >= 0; i--) {
        const o = arr[i];
        if (!o || typeof o.x !== "number" || typeof o.y !== "number") continue;

        const dx = targetX - o.x;
        const dy = targetY - o.y;
        const dist = Math.hypot(dx, dy) || 1;

        // Pull stronger based on distance, but never overshoot the target
        const speed = Math.min(dist, pullStrength * (20 / dist));

        o.x += (dx / dist) * speed;
        o.y += (dy / dist) * speed;
    }
}


// ==============================
// RUN MAGNET EVERY FRAME
// ==============================
function updateMagnet() {
    // Clients never move items themselves — the host moves them and the new
    // positions arrive in the snapshots (this was what made items glitch out).
    if (isMultiplayerClient) {
        __magnet_active = false;
        mpMagnetPulling = false;
        return;
    }

    const STR = 40; // strong pull
    const targets = [];

    // my own magnet (host / single player)
    if (__magnet_active) {
        __magnet_time--;
        if (__magnet_time <= 0) {
            __magnet_active = false;
        } else {
            targets.push({ x: player.x, y: player.y });
        }
    }

    // magnets held by other players (host only)
    for (let i = mpHostMagnets.length - 1; i >= 0; i--) {
        const m = mpHostMagnets[i];
        m.time--;
        const rp = remotePlayers[m.pid];
        if (m.time <= 0 || !rp || !rp.alive) {
            mpHostMagnets.splice(i, 1);
            continue;
        }
        targets.push({ x: rp.x, y: rp.y });
    }

    mpMagnetPulling = targets.length > 0;

    targets.forEach(t => {
        magnetPullObjects(pickups, STR, t.x, t.y);        // ammo
        magnetPullObjects(gunPickups, STR, t.x, t.y);     // guns on ground
        magnetPullObjects(healthKits, STR, t.x, t.y);     // health kits
        magnetPullObjects(bricks, STR, t.x, t.y);         // bricks spawned by worm
        magnetPullObjects(worldItems, STR, t.x, t.y);     // dropped inventory items
        magnetPullObjects(Magnetpickup, STR, t.x, t.y);   // magnet pickups
    });
}

function pickWeightedGunKey(){
  const pool = SPAWNABLE_GUN_KEYS.filter(k => !(wavesMode && k === "hammer") && !(wavesMode && boss.active && k === "nuke"));

  let totalWeight = 0;
  for(const key of pool){
    totalWeight += GUN_SPAWN_WEIGHTS[key] ?? 10;
  }

  let roll = Math.random() * totalWeight;
  for(const key of pool){
    roll -= GUN_SPAWN_WEIGHTS[key] ?? 10;
    if(roll <= 0) return key;
  }

  return pool[pool.length - 1]; // fallback, shouldn't hit
}

function normalizeKey(key) {
  // Letters report differently when Shift is held (e.g. "w" vs "W"),
  // which caused movement keys to get stuck "on" after dashing.
  // Non-letter keys (Shift, ArrowUp, Escape, etc.) are left untouched.
  return key.length === 1 ? key.toLowerCase() : key;
}

function playIntroSequence() {

  const freshIntroGif = introGif.cloneNode(false);
  freshIntroGif.removeAttribute("src");            // don't let the copy start loading the old link
  introGif.parentNode.replaceChild(freshIntroGif, introGif);
  introGif = freshIntroGif;
  introGif.classList.remove("fade-out");
  introGif.style.opacity = "1";
  introGif.style.display = "none";                 // hidden until it has loaded
  blackScreen.style.display = "block";

  let started = false;
  const startEverything = () => {
    if (started) return;
    started = true;
    introGif.style.display = "block";              // shown now, so it plays from frame 1
    void introGif.offsetWidth;
    const introSound = new Audio("https://file.garden/Zfwe_2Ig9weivlFh/spikedrink_intro1.mp3");
    introSound.play();
    setTimeout(() => {
      // black screen goes away, game starts underneath, gif stays and choppy-fades

      resetGame();

      // pick a random soundtrack for this run
      bgMusic.pause();
      const chosenTrack = bgMusicTracks[Math.floor(Math.random() * bgMusicTracks.length)];
      bgMusic.src = chosenTrack;
      bgMusic.currentTime = 0;
      bgMusic.play();
      introGif.classList.add("fade-out");
      setTimeout(() => {
        introGif.style.display = "none";
        introGif.classList.remove("fade-out");
      }, 1300);
    }, 6000);
  };

  introGif.onload = startEverything;
  introGif.onerror = startEverything;
  setTimeout(startEverything, 1500);               // never wait more than 1.5 seconds

  // brand new link every time
  if (introGifFile) {
    const freshUrl = URL.createObjectURL(introGifFile);
    introGif.src = freshUrl;

function distanceToLine(px, py, x1, y1, x2, y2) {
    const A = px - x1;
    const B = py - y1;
    const C = x2 - x1;
    const D = y2 - y1;

    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let t = dot / lenSq;

    t = Math.max(0, Math.min(1, t));

    const lx = x1 + t * C;
    const ly = y1 + t * D;

    return Math.hypot(px - lx, py - ly);
}

function spawnWorm() {
    if (worms.length > 0) return;

    const speed = 1.5;
    let x, y, vx, vy;

    if (openWorldMode && player) {
        // spawn off-screen near the player instead of in a fixed box
        const halfDiagonal = Math.hypot(canvas.width, canvas.height) / 2;
        const spawnPos = randomPointAroundPlayer(halfDiagonal + 60, halfDiagonal + 260);
        x = spawnPos.x;
        y = spawnPos.y;
        const angleToPlayer = Math.atan2(player.y - y, player.x - x);
        vx = Math.cos(angleToPlayer) * speed;
        vy = Math.sin(angleToPlayer) * speed;
    } else {
        const sides = ["top", "bottom", "left", "right"];
        const side = sides[Math.floor(Math.random() * sides.length)];

        if (side === "top")    { x = Math.random() * canvas.width; y = -20; vx = 0; vy = speed; }
        if (side === "bottom") { x = Math.random() * canvas.width; y = canvas.height + 20; vx = 0; vy = -speed; }
        if (side === "left")   { x = -20; y = Math.random() * canvas.height; vx = speed; vy = 0; }
        if (side === "right")  { x = canvas.width + 20; y = Math.random() * canvas.height; vx = -speed; vy = 0; }
    }

   const segments = Math.floor(40 + Math.random() * 25);


    worms.push({
        id: nextEnemyId++,
        x, y, vx, vy,
        speed,
        segments,
        segmentSpacing: 7,
        alive: true,
        history: [{x, y}],
        phase: Math.random() * Math.PI * 2
    });
}

function updateWorms() {
    worms.forEach(w => {
        if (!w.alive) return;

        // ===== SMOOTHER WAVE MOTION =====
        // slower wave
        w.phase += 0.07;                    // was too fast, reduced by ~50%

        // MUCH gentler head weave
        const waveAngle = Math.sin(w.phase * 0.6) * 0.22;

        //    ^ slower frequency       ^ much smaller amplitude

        // forward direction of worm
        let forward = Math.atan2(w.vy, w.vx);

        // ===== OPEN WORLD: smoothly steer back toward the player instead of bouncing off a wall =====
        if (openWorldMode && player) {
            const distToPlayer = Math.hypot(w.x - player.x, w.y - player.y);
            const leashRadius = Math.max(canvas.width, canvas.height) * 0.6;

            if (distToPlayer > leashRadius) {
                const angleToPlayer = Math.atan2(player.y - w.y, player.x - w.x);
                let diff = angleToPlayer - forward;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                const pull = Math.min(0.05, 0.015 + (distToPlayer - leashRadius) * 0.00005);
                forward += diff * pull;
            }
        }

        // smoothed final angle (prevents clumping and over-rotation)
        const ang = forward * 0.92 + (forward + waveAngle) * 0.08;

        // apply the new direction
        w.vx = Math.cos(ang) * w.speed;
        w.vy = Math.sin(ang) * w.speed;

        // ===== MOVE HEAD =====
        w.x += w.vx;
        w.y += w.vy;

        // ===== WALL BOUNCE (classic / follow-camera only — open world has no walls) =====
        if (!openWorldMode) {
            if (w.x < 0)             { w.x = 0; w.vx *= -1; }
            if (w.x > canvas.width)  { w.x = canvas.width; w.vx *= -1; }
            if (w.y < 0)             { w.y = 0; w.vy *= -1; }
            if (w.y > canvas.height) { w.y = canvas.height; w.vy *= -1; }
        }

        // ===== TRAIL =====
        w.history.unshift({ x: w.x, y: w.y });

        // limit trail length
        const maxHist = w.segments * w.segmentSpacing + 30;
        if (w.history.length > maxHist)
            w.history.length = maxHist;
    });
	
	// ===== BRICK SPAWN AROUND WORM =====
if (Math.random() < 0.005) {  // 5% per frame

}

function drawWorms() {
    ctx.save();
    ctx.font = "18px monospace";
    ctx.textAlign = "center";
    if (colorMode) ctx.fillStyle = COLOR_MODE_COLORS.worm;

    worms.forEach(w => {

        // ===== BODY =====
        for (let i = 1; i <= w.segments; i++) {
            const idx = i * w.segmentSpacing;
            const p = w.history[idx];
            const prev = w.history[idx - 3] || p;
            if (!p) continue;

            const ang = Math.atan2(prev.y - p.y, prev.x - p.x);

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(ang);
            ctx.fillText("⋘", 0, 0);
            ctx.restore();
        }

        // ===== HEAD =====
        if (w.history.length === 0) return;
        const p0 = w.history[0];
        const p1 = w.history[3] || p0;
        const headAng = Math.atan2(p1.y - p0.y, p1.x - p0.x);

        ctx.save();
        ctx.translate(p0.x, p0.y);
        ctx.rotate(headAng);
        ctx.fillText("⋘", 0, 8); // slightly lowered head
        ctx.restore();
    });

    ctx.restore();
}



// ====== SHOOT (per-gun behavior handled here) ======
function canFireNow(now, gun){
  const gap = gun.fireRateMs || 300;
  return (now - player.lastShotTime) >= gap;
}

function consumeAmmo(n){
  if(tutorialActive){
    player.ammo -= n;
    ammoUsed += n;
    if(player.ammo < 1) player.ammo = 1;
    return true;
  }
  if(player.ammo >= n){
    player.ammo -= n;
    ammoUsed += n;
    return true;
  }
  return false;
}

let bloodBits = [];
function spawnNewBlood(x, y, shotAngle, fromRemote){
  if(newblood && !fromRemote && socket && mpPartyCode){
    socket.emit("bulletFired", { id: socket.id, x: mpR(x), y: mpR(y), dx: 0, dy: 0, nblood: 1, a: Math.round(shotAngle * 100) / 100 });
  }
  if(!newblood || bloodBits.length > 700) return;
  const chars = ["*", "#", ",", "."];
  for(let i = 0; i < 40; i++){
    bloodBits.push({
      sx: x, sy: y,
      ang: shotAngle + (Math.random() - 0.5) * 0.9,   // cone around the direction you shot
      dist: 40 + Math.random() * 110,                 // how far it flies
      t: 0,
      dur: 42 + Math.floor(Math.random() * 18),       // frames to fly out (higher = slower)
      hold: 5 + Math.floor(Math.random() * 45),       // extra frames it stays after landing (random per particle)
      ch: chars[Math.floor(Math.random() * chars.length)]
    });
  }
}
function updateNewBlood(){
  for(let i = bloodBits.length - 1; i >= 0; i--){
    const p = bloodBits[i];
    p.t++;
    const total = p.dur + p.hold;
    if(p.t > total){ bloodBits.splice(i, 1); continue; }
    const k = Math.min(1, p.t / p.dur);
    const e = 1 - Math.pow(1 - k, 3);                 // ease-out cubic: fast start, smooth stop
    p.x = p.sx + Math.cos(p.ang) * p.dist * e;
    p.y = p.sy + Math.sin(p.ang) * p.dist * e;
    p.a = 1;          // stays solid, then fades at the very end
  }
}
function drawNewBlood(){
  bloodBits.forEach(p => {
    if(p.x === undefined) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.a);
    ctx.fillText(p.ch, p.x, p.y);
    ctx.restore();
  });
}

function addBullet(angle, speed, damage, extra){
  const dx = Math.cos(angle)*speed;
  const dy = Math.sin(angle)*speed;
  const nb = {x:player.x,y:player.y,dx,dy,trail:[], damage: damage || 10};
  if(extra) Object.assign(nb, extra);   // e.g. { bounceWalls: true, bouncesLeft: 1 }
  bullets.push(nb);
  syncBulletFire(player.x, player.y, dx, dy);
}

function syncBulletFire(x, y, dx, dy){
  if(mpPartyCode && socket){
    // machine gun bullets are flagged so other players can bounce them too
    const lastB = bullets[bullets.length - 1];
    const isMG = !!(lastB && lastB.isMachineGun && lastB.dx === dx && lastB.dy === dy);
    const isRK = !!(lastB && lastB.isRocket && lastB.dx === dx && lastB.dy === dy);
    const isBnc = !!(lastB && lastB.bounceWalls && lastB.dx === dx && lastB.dy === dy);
    socket.emit("bulletFired", { id: socket.id, x, y, dx, dy, mg: isMG ? 1 : undefined, rocket: isRK ? 1 : undefined, bnc: isBnc ? lastB.bouncesLeft : undefined });
  }
}

// Single source of truth for where a hammer wall will go — used by both
// the preview outline and the actual placement, so they can never disagree.
const HAMMER_WALL_DISTANCE = 40;
const HAMMER_WALL_WIDTH = 11;
const HAMMER_WALL_HEIGHT = 56;

function getHammerWallPlacement(){
  const rawAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  // snap to the nearest of the 4 compass directions (right/down/left/up)
  const roundedAngle = Math.round(rawAngle / (Math.PI / 2)) * (Math.PI / 2);

  const x = player.x + Math.cos(roundedAngle) * HAMMER_WALL_DISTANCE;
  const y = player.y + Math.sin(roundedAngle) * HAMMER_WALL_DISTANCE;

  // pointing up/down (north/south) -> wall should be wide & short
  // pointing left/right (east/west) -> wall should be narrow & tall
  const pointingVertical = Math.abs(Math.sin(roundedAngle)) > 0.5;

  const w = pointingVertical ? HAMMER_WALL_HEIGHT : HAMMER_WALL_WIDTH;
  const h = pointingVertical ? HAMMER_WALL_WIDTH : HAMMER_WALL_HEIGHT;

  return { x, y, w, h, angle: roundedAngle };
}
