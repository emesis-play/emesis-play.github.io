// ====== AUTO LOW-SPEC MODE (multiplayer) ======
// Watches the frame rate. If the game runs slowly for a few seconds, multiplayer switches to a lighter mode
// (fewer particles / trails, fewer network packets sent). It switches back on its own if things speed up.
let perfLow = false, perfEma = 16.7, perfLast = 0, perfSince = 0;
let mpSkipTick = false, mpSkipPos = false;
function mpLow(){ return IS_MAC || (perfLow && !!mpPartyCode); }
function perfTick(time){
  if(typeof time !== "number") return;
  if(perfLast){
    const dt = Math.min(100, time - perfLast);
    perfEma += (dt - perfEma) * 0.03;
    if(!perfLow && perfEma > 24 && time - perfSince > 3000){ perfLow = true; perfSince = time; }
    else if(perfLow && perfEma < 17.5 && time - perfSince > 8000){ perfLow = false; perfSince = time; }
  }
  perfLast = time;
}

// ====== GAME LOOP ======
const TICK_RATE = 100;       // game speed: updates per second (60 = normal 60Hz speed, higher = faster)
const STEP_MS = 1000 / TICK_RATE;
let loopLast = 0, loopAcc = 0, lastDrawT = 0;
let fpsFrames = 0, fpsT = 0, fpsShown = 0;
function loop(time){
  if(typeof time !== "number") time = performance.now();
  try {
    perfTick(time);

    if(!loopLast) loopLast = time;
    let dt = time - loopLast;
    loopLast = time;
    if(dt > 100) dt = 100;                          // tab was in the background: don't fast-forward
    if(Math.abs(dt - STEP_MS) < 1.5) dt = STEP_MS;  // smooth out tiny timing jitter on 60Hz screens
    loopAcc += dt;

    let steps = 0;
    while(loopAcc >= STEP_MS - 0.5 && steps < 12){  // runs extra steps when needed so the speed stays the same
      update(time);
      loopAcc -= STEP_MS;
      steps++;
    }
    if(loopAcc >= STEP_MS) loopAcc = 0;             // way too slow: stop trying to catch up
    if(steps > 0 && (!IS_MAC || time - lastDrawT >= 15)){
      lastDrawT = time;
      draw();
      fpsFrames++;
      if(time - fpsT > 1000){ fpsShown = fpsFrames; fpsFrames = 0; fpsT = time; }
      if(/[?&]debug=1/.test(location.search)){
        ctx.save(); ctx.fillStyle = "lime"; ctx.font = "12px monospace";
        ctx.fillText("FPS " + fpsShown, 740, 590);
        ctx.restore();
      }
    }
  } catch (err) { console.error("Game loop error:", err); }
  requestAnimationFrame(loop);
}
loop();

const BOSS_THEME_URL      = "https://file.garden/Zfwe_2Ig9weivlFh/Hidructs%20theme.wav";  // <-- your theme's link goes here
const NORMAL_MUSIC_VOL    = 0.5;   // keep the same as bgMusic.volume at the top of the file
const BOSS_THEME_VOL      = 0.6;
const MUSIC_FADE_OUT_SECS = 3;     // normal music fading out before the boss
const BOSS_FADE_OUT_SECS  = 2.5;   // boss theme fading out after he dies
const MUSIC_FADE_IN_SECS  = 3;     // normal music fading back in

const bossTheme = new Audio(BOSS_THEME_URL);
bossTheme.loop = true;
bossTheme.volume = 0;
let musicMode = "normal";   // normal -> fadeOutNormal -> boss -> fadeOutBoss -> fadeInNormal -> normal

setInterval(() => {
  const TICK = 0.05;   // this runs every 50ms
  bossTheme.muted = !musicEnabled;   // respects your "Game Music" option

  const inWaves = wavesMode && !tutorialActive && (gameState === "playing" || gameState === "paused");

  // not in a waves game (title, game over, other modes): put everything back to normal
  if (!inWaves) {
    if (musicMode !== "normal" || !bossTheme.paused) {
      bossTheme.pause();
      bossTheme.currentTime = 0;
      musicMode = "normal";
    }
    bgMusic.volume = NORMAL_MUSIC_VOL;
    return;
  }

  // paused: freeze the boss theme too
  if (gameState === "paused") {
    if (!bossTheme.paused) bossTheme.pause();
    return;
  }

  const bossUp     = boss.active && boss.state !== "dying";
  const bossComing = wv.state === "intermission" && (wv.n + 1) % 10 === 0;   // the "something is coming..." gap

  // 1) boss appears -> his theme starts immediately
  if (bossUp && (musicMode === "normal" || musicMode === "fadeOutNormal" || musicMode === "fadeInNormal")) {
    musicMode = "boss";
    bgMusic.pause();
    bgMusic.volume = 0;
    bossTheme.currentTime = 0;
    bossTheme.volume = BOSS_THEME_VOL;
    bossTheme.play().catch(() => {});
  }
  // 2) the wave before the boss is cleared -> normal music starts fading out
  else if (musicMode === "normal" && bossComing) {
    musicMode = "fadeOutNormal";
  }

  if (musicMode === "fadeOutNormal") {
    bgMusic.volume = Math.max(0, bgMusic.volume - NORMAL_MUSIC_VOL * TICK / MUSIC_FADE_OUT_SECS);
    if (bgMusic.volume <= 0) bgMusic.pause();
  }

  if (musicMode === "boss") {
    if (!bgMusic.paused) bgMusic.pause();            // keeps the normal music off if you resume from pause
    if (bossTheme.paused) bossTheme.play().catch(() => {});
    if (!bossUp) musicMode = "fadeOutBoss";           // he's dying -> fade his theme out
  }

  if (musicMode === "fadeOutBoss") {
    if (!bgMusic.paused) bgMusic.pause();
    if (bossTheme.paused && bossTheme.volume > 0) bossTheme.play().catch(() => {});
    bossTheme.volume = Math.max(0, bossTheme.volume - BOSS_THEME_VOL * TICK / BOSS_FADE_OUT_SECS);
    if (bossTheme.volume <= 0) {
      bossTheme.pause();
      bossTheme.currentTime = 0;
      bgMusic.volume = 0;
      bgMusic.play().catch(() => {});
      musicMode = "fadeInNormal";                     // now bring the normal music back
    }
  }

  if (musicMode === "fadeInNormal") {
    if (bgMusic.paused) bgMusic.play().catch(() => {});
    bgMusic.volume = Math.min(NORMAL_MUSIC_VOL, bgMusic.volume + NORMAL_MUSIC_VOL * TICK / MUSIC_FADE_IN_SECS);

  PB.dash = false; PB.dashCd = 90; PB.pend = null;
}
function playerBotReset(){
  PB.youKills = 0; PB.respawnT = 0;
  PB.ammoT = 200; PB.healthT = 420; PB.gunT = 360; PB.recoilBack = 0; PB.recoilAngle = 0;
  PB.pvx = 0; PB.pvy = 0; PB.lastPx = 0; PB.lastPy = 0;
  PB.alive = false;
  if(!playerActive()) return;
  pbSpawn();
  pbDrop(pickups); pbDrop(pickups); pbDrop(healthKits);
}

// is there a wall between a and b?
function pbBlocked(ax, ay, bx, by){
  for(const w of walls){
    for(let t = 0.05; t < 1; t += 0.05){
      const x = ax + (bx - ax) * t, y = ay + (by - ay) * t;
      if(Math.abs(x - w.x) < w.w / 2 && Math.abs(y - w.y) < w.h / 2) return true;
    }
  }
  return false;
}
function pbNearest(arr, c){
  let best = null, bd = 1e9;
  arr.forEach(o => { const d = Math.hypot(o.x - c.x, o.y - c.y); if(d < bd){ bd = d; best = o; } });
  return best ? { o: best, d: bd } : null;
}

// the bot's dash: same as yours (120 px, 5 frames, 1 second cooldown) but it stops at walls
// like you, it has to point its gun the way it wants to dash: it turns first, then dashes when it is facing that way
function pbStartDash(dx, dy){
  if(PB.dashCd > 0 || PB.dash || PB.pend) return false;
  PB.pend = { ang: Math.atan2(dy, dx), t: 40 };
  return true;
}

function pbDoDash(dx, dy){
  if(PB.dashCd > 0 || PB.dash) return false;
  const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
  const pv = playerVisOffset();
  const hits = (px, py) => walls.some(w => Math.abs(px + pv.ox - w.x) < w.w / 2 + pv.hw && Math.abs(py + pv.oy - w.y) < w.h / 2 + pv.hh);
  let tx = PB.x, ty = PB.y;
  for(let s = 8; s <= 120; s += 8){
    const nx = Math.max(12 - pv.ox, Math.min(canvas.width - 12 - pv.ox, PB.x + dx * s));
    const ny = Math.max(12 - pv.oy, Math.min(canvas.height - 12 - pv.oy, PB.y + dy * s));
    if(hits(nx, ny)) break;
    tx = nx; ty = ny;
  }
  if(Math.hypot(tx - PB.x, ty - PB.y) < 30) return false;   // nowhere to go
  PB.dash = true; PB.dashP = 0; PB.dashSx = PB.x; PB.dashSy = PB.y; PB.dashTx = tx; PB.dashTy = ty;
  PB.dashCd = 80 + Math.random() * 40;
  PB.vx = 0; PB.vy = 0;
  for(let i = 0; i < 25; i++){
    dashParticles.push({ x: PB.x + (Math.random() - 0.5) * 20, y: PB.y + (Math.random() - 0.5) * 20, dx: (Math.random() - 0.5) * 2, dy: (Math.random() - 0.5) * 2, char: ".", life: 20 });
  }
  return true;
}

function pbHurt(d, shotAngle){
  PB.hp -= d; PB.hurtT = 8;
  const c = pbCenter();
  spawnNewBlood(c.x, c.y, shotAngle);
  for(let i = 0; i < 4; i++) blood.push({ x: c.x, y: c.y, dx: (Math.random() - 0.5) * 2.5, dy: (Math.random() - 0.5) * 2.5, life: 25, maxLife: 25 });
  PB.look = "player"; PB.lookT = 50; if(PB.engage > 10) PB.engage = 10;   // turns to see who hit it
  if(PB.hp <= 0) pbDie();
}
function pbDie(){
  const c = pbCenter();
  PB.alive = false; PB.respawnT = 200; PB.youKills++;
  kills++; killPop = 1.2; killPopColor = 1.2;
  for(let i = 0; i < 3; i++) spawnNewBlood(c.x, c.y, Math.random() * Math.PI * 2);
  mpAddVomit(PB.x, PB.y, null);
  playSound("https://file.garden/Zfwe_2Ig9weivlFh/emesis3.wav");
  pickups.push({ id: nextItemId++, x: PB.x, y: PB.y });   // drops some ammo, like a real player
}

function pbFire(D, c, tc){
  const key = PB.gun, g = GUNS[key], pg = PB_GUNS[key];
  PB.ammo -= pg.cost;
  // same fire delay as you have, plus the little extra a real finger takes between clicks
  PB.cd = Math.max(1, g.fireRateMs / 16.667) + (pg.auto ? 0 : pbRand(D.human[0], D.human[1]));
  const pellets = (g.pellets || 1) * (key === "doublebarrel" ? 2 : 1);
  const baseSp = D.bspd * ((g.bulletSpeed || 20) / 20) * (pg.spd || 1);
  const dmg = Math.max(1, Math.round(D.dmg * pg.dmg));
  const spreadR = (g.spreadDeg || 0) * Math.PI / 180;
  for(let i = 0; i < pellets; i++){
    const a = PB.aim + (Math.random() - 0.5) * 2 * (pg.spread + spreadR);
    const sp = pellets > 1 ? baseSp * (0.85 + Math.random() * 0.3) : baseSp;
    bullets.push({ x: c.x + Math.cos(a) * 14, y: c.y + Math.sin(a) * 14, dx: Math.cos(a) * sp, dy: Math.sin(a) * sp, trail: [],
                   enemyBullet: true, nid: nextItemId++, glyph: "O", dmg: dmg });
  }
  PB.recoilBack = pellets > 1 ? 12 : 4; PB.recoilAngle = (Math.cos(PB.aim) < 0 ? 1 : -1) * (pellets > 1 ? 0.3 : 0.18);
  const big = pellets > 1 || key === "sniper";
  muzzleFlashes.push({ x: c.x + Math.cos(PB.aim) * 24, y: c.y + Math.sin(PB.aim) * 24, angle: PB.aim, life: big ? 8 : 5, maxLife: big ? 8 : 5, size: big ? 20 : 12 });
  const side = Math.random() < 0.5 ? 1 : -1, ea = PB.aim + Math.PI / 2 * side + (Math.random() - 0.5) * 0.6, sp2 = 1 + Math.random() * 1.4;
  shellCasings.push({ x: PB.x, y: PB.y, dx: Math.cos(ea) * sp2, dy: Math.sin(ea) * sp2 + 0.7, life: 80 + Math.random() * 40,
                      spin: (Math.random() - 0.5) * 0.4, rot: Math.random() * 6.28, type: pellets > 1 ? "shotgun" : "pistol" });
  if(Math.hypot(tc.x - c.x, tc.y - c.y) < 700) playSound("https://file.garden/Zfwe_2Ig9weivlFh/shoot.wav");
}

function playerBotUpdate(){
  // ---- items appear on the map over time (the only things that spawn in this mode) ----
  if(--PB.ammoT <= 0){ PB.ammoT = 220 + Math.random() * 160; if(pickups.length < 4) pbDrop(pickups); }
  if(--PB.healthT <= 0){ PB.healthT = 420 + Math.random() * 240; if(healthKits.length < 2) pbDrop(healthKits); }
  if(--PB.gunT <= 0){ PB.gunT = 700 + Math.random() * 500; if(gunPickups.length < 2) pbDropGun(); }

  if(PB.spawnFx > 0) PB.spawnFx--;
  if(PB.hurtT > 0) PB.hurtT--;
  if(PB.engage > 0) PB.engage--;
  PB.recoilBack *= 0.82; PB.recoilAngle *= 0.88;

  if(!PB.alive){
    if(--PB.respawnT <= 0 && player.alive) pbSpawn();
    return;
  }

  const D = pbSettings(), pv = playerVisOffset();
  const c = pbCenter();
  const tc = { x: playerHitX(), y: playerHitY() };
  const pg = PB_GUNS[PB.gun];

  // ---- watch the player: remember where they were, work out how fast they move ----
  PB.hist.push({ x: tc.x, y: tc.y });
  if(PB.hist.length > 40) PB.hist.shift();
  PB.pvx += ((tc.x - PB.lastPx) - PB.pvx) * 0.15; PB.pvy += ((tc.y - PB.lastPy) - PB.pvy) * 0.15;
  PB.lastPx = tc.x; PB.lastPy = tc.y;
  const seen = PB.hist[Math.max(0, PB.hist.length - 1 - D.react)];   // what it "saw" a moment ago (human reaction time)
  const pSpeed = Math.hypot(PB.pvx, PB.pvy);

  const dist = Math.hypot(tc.x - c.x, tc.y - c.y);
  const los = !pbBlocked(c.x, c.y, tc.x, tc.y);

  // is the player pointing their gun at it? (a real player sees that and reacts)
  let aimedAt = false;
  if(player.alive){
    const pa = Math.atan2(mouse.y - player.y, mouse.x - player.x), ta = Math.atan2(c.y - player.y, c.x - player.x);
    aimedAt = Math.abs(Math.atan2(Math.sin(pa - ta), Math.cos(pa - ta))) < 0.2 && dist < 450;
  }

  // ---- damage from the player's bullets ----
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    if(b.enemyBullet || b.hitPB) continue;
    const x1 = b.x - b.dx, y1 = b.y - b.dy, sx = b.dx, sy = b.dy, l2 = sx * sx + sy * sy || 1;
    const t = Math.max(0, Math.min(1, ((c.x - x1) * sx + (c.y - y1) * sy) / l2));
    if(Math.hypot(c.x - (x1 + sx * t), c.y - (y1 + sy * t)) < PB_R + 3){
      b.hitPB = true;
      pbHurt(b.isRocket ? 100 : (b.damage || 10), Math.atan2(b.dy, b.dx));
      if(!b.isknife && !b.isRailgun) bullets.splice(i, 1);
      if(!PB.alive) return;
    }
  }

  // ---- dash in progress ----
  if(PB.dashCd > 0) PB.dashCd--;
  if(PB.dash){
    const ox = PB.x, oy = PB.y;
    PB.dashP += 0.2;
    const cp = Math.min(PB.dashP, 1), e = cp < 0.5 ? 2 * cp * cp : 1 - Math.pow(-2 * cp + 2, 2) / 2;
    PB.x = PB.dashSx + (PB.dashTx - PB.dashSx) * e;
    PB.y = PB.dashSy + (PB.dashTy - PB.dashSy) * e;
    dashLines.push({ x1: ox, y1: oy, x2: PB.x, y2: PB.y, life: 20 });
    if(PB.dashP >= 1) PB.dash = false;
  }

  // ---- what does it want right now? (items it can actually see) ----
  let goal = null;
  const kit = pbNearest(healthKits, c), amm = pbNearest(pickups, c);
  let gunGoal = null, gd = 1e9;
  gunPickups.forEach(gp => {
    if(!PB_GUNS[gp.gunKey] || PB_SCORE[gp.gunKey] <= PB_SCORE[PB.gun]) return;   // only goes for guns better than its own
    const d = Math.hypot(gp.x - c.x, gp.y - c.y);
    if(d < gd && d < 340 && !pbBlocked(c.x, c.y, gp.x, gp.y)){ gd = d; gunGoal = gp; }
  });
  if(gunGoal){
    // takes a moment to notice a new gun before going for it
    if(PB.noticeId !== gunGoal.id){ PB.noticeId = gunGoal.id; PB.noticeT = 12 + Math.random() * 28; }
    if(PB.noticeT > 0){ PB.noticeT--; gunGoal = null; }
  }
  if(PB.hp < 50 && kit) goal = kit.o;
  else if(PB.ammo <= 3 && amm) goal = amm.o;
  else if(gunGoal) goal = gunGoal;
  else if(kit && kit.d < 110 && PB.hp < 90) goal = kit.o;
  else if(amm && amm.d < 110 && PB.ammo < 12) goal = amm.o;
  else if(PB.ammo <= 6 && amm && amm.d < 260) goal = amm.o;

  // ---- hurt or out of ammo: run behind a wall if there is one nearby ----
  if(!goal && (PB.hp < 35 || PB.ammo < pg.cost) && walls.length && los){
    let bw = null, bdw = 260;
    walls.forEach(w => { const d = Math.hypot(w.x - c.x, w.y - c.y); if(d < bdw){ bdw = d; bw = w; } });
    if(bw){
      const wx = bw.x - tc.x, wy = bw.y - tc.y, wl = Math.hypot(wx, wy) || 1;
      goal = { x: bw.x + (wx / wl) * (bw.w / 2 + 26), y: bw.y + (wy / wl) * (bw.h / 2 + 26) };
    }
  }

  // ---- where is it looking? not always at you ----
  PB.lookT--;
  if(PB.lookT <= 0){
    PB.lookT = 35 + Math.random() * 90;
    const prev = PB.look;
    PB.look = Math.random() < (goal ? 0.3 : 0.8) ? "player" : "move";
    if(PB.look === "player" && prev !== "player") PB.engage = D.react + Math.random() * 14;   // needs a moment to line up / react
  }
  PB.aimErrT--;
  if(PB.aimErrT <= 0){
    PB.aimErrT = 10 + Math.random() * 18;
    let e = (Math.random() - 0.5) * 2 * (D.err * (1 + dist / 250) + pSpeed * 0.05);
    if(Math.random() < 0.12) e *= 2.2;                  // now and then a bad flick
    PB.aimErr = e; PB.leadK = 0.3 + Math.random() * 0.6;
  }
  let want;
  if(PB.look === "player"){
    const lead = (dist / (D.bspd * ((GUNS[PB.gun].bulletSpeed || 20) / 20))) * PB.leadK;
    want = Math.atan2(seen.y + PB.pvy * lead - c.y, seen.x + PB.pvx * lead - c.x) + PB.aimErr;
  } else {
    want = (Math.hypot(PB.vx, PB.vy) > 0.4 ? Math.atan2(PB.vy, PB.vx) : PB.aim) + PB.aimErr * 0.5;
  }
  let dA = want - PB.aim; dA = Math.atan2(Math.sin(dA), Math.cos(dA));
  if(PB.pend){
    // turning its gun toward the dash direction first (and not shooting meanwhile)
    let pd = PB.pend.ang - PB.aim; pd = Math.atan2(Math.sin(pd), Math.cos(pd));
    PB.aim += Math.max(-0.3, Math.min(0.3, pd * 0.35));
    dA = 1;
    PB.pend.t--;
    if(Math.abs(pd) < 0.1){
      const da = PB.aim; PB.pend = null;
      pbDoDash(Math.cos(da), Math.sin(da));   // dashes the way the gun is pointing, just like you
    } else if(PB.pend.t <= 0) PB.pend = null;   // gave up
  } else {
    PB.aim += Math.max(-0.12, Math.min(0.12, dA * 0.1));
  }

  // ---- shooting: only when it is really looking at you, with a clear line, ammo and in range ----
  if(PB.cd > 0) PB.cd--;
  const aimTol = PB.gun === "sniper" ? 0.06 : 0.13;
  if(player.alive && PB.look === "player" && PB.engage <= 0 && PB.ammo >= pg.cost && los && dist < pg.maxD && Math.abs(dA) < aimTol){
    if(PB.burst > 0){
      if(PB.cd <= 0){
        pbFire(D, c, tc); PB.burst--;
        if(PB.burst <= 0) PB.pause = pbRand(D.pause[0], D.pause[1]);
      }
    } else if(--PB.pause <= 0){
      PB.burst = pg.auto ? Math.floor(pbRand(3, 9)) : Math.floor(pbRand(D.burst[0], D.burst[1] + 1));
    }
  }

  // ---- movement wishes ----
  let mx = 0, my = 0;
  const ux = (tc.x - c.x) / (dist || 1), uy = (tc.y - c.y) / (dist || 1);

  if(goal){
    const gx = goal.x - c.x, gy = goal.y - c.y, gl = Math.hypot(gx, gy) || 1;
    mx = gx / gl; my = gy / gl;
    mx += -uy * PB.strafe * 0.25; my += ux * PB.strafe * 0.25;
  } else {
    // fight: hold the range this gun likes and strafe around the player
    if(aimedAt && PB.strafeT > 8 && Math.random() < 0.05) PB.strafeT = 0;   // you're aiming at it: change direction sooner
    PB.strafeT--; if(PB.strafeT <= 0){ PB.strafeT = 25 + Math.random() * 70; if(Math.random() < 0.7) PB.strafe *= -1; if(Math.random() < 0.12) PB.haltT = 12 + Math.random() * 20; }
    const range = (pg.range + Math.sin(performance.now() / 2500) * 50) * (player.health < 35 && PB.hp > 40 ? 0.6 : 1);   // you're weak: it pushes in
    let toward = 0;
    if(dist > range + 60) toward = 1; else if(dist < range - 60) toward = -1;
    if(PB.hp < 30 || PB.ammo < pg.cost) toward = dist < 330 ? -1.3 : 0;   // low on health or ammo: back off
    mx = ux * toward + (-uy) * PB.strafe * 0.9;
    my = uy * toward + ( ux) * PB.strafe * 0.9;
    if(!los){ mx += ux * 0.8; my += uy * 0.8; }                          // get around the wall to see you
    if(PB.haltT > 0){ PB.haltT--; mx *= 0.1; my *= 0.1; }
  }

  // ---- dodge incoming player bullets (not every time, like a real person) ----
  let boost = 1, dodgeDir = null;
  for(const b of bullets){
    if(b.enemyBullet) continue;
    const bs = Math.hypot(b.dx, b.dy); if(bs < 1) continue;
    const rx = c.x - b.x, ry = c.y - b.y;
    const along = (rx * b.dx + ry * b.dy) / bs;
    if(along <= 0 || along > bs * 26) continue;
    const perp = (rx * -b.dy + ry * b.dx) / bs;
    if(Math.abs(perp) > 26) continue;
    if(b.pbSeen === undefined) b.pbSeen = Math.random() < D.dodge;
    if(!b.pbSeen) continue;
    let sgn = perp >= 0 ? 1 : -1;
    {   // sidestep toward the side that has room (not into a wall or the edge)
      const tx = c.x + (-b.dy / bs) * sgn * 45, ty = c.y + (b.dx / bs) * sgn * 45;
      if(tx < 14 || tx > canvas.width - 14 || ty < 14 || ty > canvas.height - 14 || pbBlocked(c.x, c.y, tx, ty)) sgn = -sgn;
    }
    mx += (-b.dy / bs) * sgn * 3; my += (b.dx / bs) * sgn * 3; boost = 1.6;
    if(along < bs * 13 && !dodgeDir) dodgeDir = { x: (-b.dy / bs) * sgn, y: (b.dx / bs) * sgn };
  }

  if(aimedAt && (mouseDown || player.shootingHeld) && boost < 1.25) boost = 1.25;   // you're aiming and firing: it moves faster

  // ---- dash: dodge a shot, jump back, run, close the gap, sidestep when you aim at it ----
  if(!PB.dash && PB.dashCd <= 0 && player.alive){
    const dChance = difficulty === "Hard" ? 0.97 : (difficulty === "Easy" ? 0.5 : 0.8);
    let dd = null;
    if(dodgeDir && Math.random() < dChance) dd = dodgeDir;
    else if(dist < 90 && (PB.hp < 40 || pg.range > 150) && Math.random() < 0.05) dd = { x: -ux, y: -uy };
    else if(PB.hp < 35 && dist < 220 && Math.random() < 0.04) dd = { x: -ux + (-uy) * PB.strafe * 0.5, y: -uy + ux * PB.strafe * 0.5 };
    else if(!goal && dist > pg.range + 170 && los && Math.random() < 0.02) dd = { x: ux, y: uy };
    else if(goal && Math.hypot(goal.x - c.x, goal.y - c.y) > 150 && Math.random() < 0.025) dd = { x: goal.x - c.x, y: goal.y - c.y };
    else if(!goal && aimedAt && Math.random() < 0.03) dd = { x: -uy * PB.strafe, y: ux * PB.strafe };
    else if(!goal && los && dist < 400 && Math.random() < 0.004) dd = { x: -uy * PB.strafe, y: ux * PB.strafe };
    if(dd) pbStartDash(dd.x, dd.y);
  }

  // ---- keep away from the edges and from touching the player ----
  const M = 28;
  if(c.x < M) mx += 1.5;
  if(c.x > canvas.width - M) mx -= 1.5;
  if(c.y < M) my += 1.5;
  if(c.y > canvas.height - M) my -= 1.5;
  if(dist < 40){ mx -= ux * 2; my -= uy * 2; }

  const ml = Math.hypot(mx, my);
  // move like a person on a keyboard: 8 directions, held for a random moment, sometimes idle or wrong
  PB.keyT--;
  if(boost > 1 || PB.keyT <= 0){
    PB.keyT = boost > 1 ? 4 : 6 + Math.random() * 28;
    const wild = boost > 1 ? 0 : (goal ? 0.3 : 1), r = Math.random();   // no random slips while dodging
    if(ml < 0.15 || r < 0.08 * wild){ PB.kx = 0; PB.ky = 0; }
    else if(r < 0.22 * wild){ const ra = Math.floor(Math.random() * 8) * Math.PI / 4; PB.kx = Math.round(Math.cos(ra)); PB.ky = Math.round(Math.sin(ra)); }
    else { const qa = Math.round(Math.atan2(my, mx) / (Math.PI / 4)) * (Math.PI / 4); PB.kx = Math.round(Math.cos(qa)); PB.ky = Math.round(Math.sin(qa)); }
  }
  const kl = Math.hypot(PB.kx, PB.ky) || 1;
  PB.vx += ((PB.kx / kl) * D.speed * boost - PB.vx) * 0.45;
  PB.vy += ((PB.ky / kl) * D.speed * boost - PB.vy) * 0.45;

  if(PB.dash){ PB.vx = 0; PB.vy = 0; }   // the dash is moving it, not the keys

  // ---- move, sliding along walls the same way you do ----
  const hitsWall = (w, px, py) => Math.abs(px + pv.ox - w.x) < w.w / 2 + pv.hw && Math.abs(py + pv.oy - w.y) < w.h / 2 + pv.hh;
  let nx = PB.x + PB.vx, ny = PB.y + PB.vy;
  for(const w of walls){ if(hitsWall(w, PB.x, PB.y)) continue; if(hitsWall(w, nx, PB.y)){ nx = PB.x; PB.vx = 0; break; } }
  for(const w of walls){ if(hitsWall(w, nx, PB.y)) continue; if(hitsWall(w, nx, ny)){ ny = PB.y; PB.vy = 0; break; } }
  nx = Math.max(12 - pv.ox, Math.min(canvas.width - 12 - pv.ox, nx));
  ny = Math.max(12 - pv.oy, Math.min(canvas.height - 12 - pv.oy, ny));
  PB.x = nx; PB.y = ny;

  // stuck on something? turn around
  if(Math.hypot(PB.x - PB.lastX, PB.y - PB.lastY) < 0.4 && ml > 0.5) PB.stuck++; else PB.stuck = 0;
  PB.lastX = PB.x; PB.lastY = PB.y;
  if(PB.stuck > 20){ PB.strafe *= -1; PB.stuck = 0; PB.strafeT = 40; }

  // ---- pick up things it walks over ----
  const c2 = pbCenter();
  for(let i = pickups.length - 1; i >= 0; i--){
    if(Math.hypot(c2.x - pickups[i].x, c2.y - pickups[i].y) < 18){ pickups.splice(i, 1); PB.ammo = Math.min(30, PB.ammo + 5); }
  }
  for(let i = healthKits.length - 1; i >= 0; i--){
    if(Math.hypot(c2.x - healthKits[i].x, c2.y - healthKits[i].y) < 18){ healthKits.splice(i, 1); PB.hp = Math.min(PB.maxHp, PB.hp + 25); }
  }
  for(let i = gunPickups.length - 1; i >= 0; i--){
    const gp = gunPickups[i];
    if(PB_GUNS[gp.gunKey] && PB_SCORE[gp.gunKey] > PB_SCORE[PB.gun] && Math.hypot(c2.x - gp.x, c2.y - gp.y) < 18){
      gunPickups.splice(i, 1);
      PB.gun = gp.gunKey; PB.ammo = Math.min(30, PB.ammo + 4);
      PB.cd = 25; PB.burst = 0; PB.pause = 25;      // takes a moment to switch
    }
  }
}

function drawPlayerBot(){
  if(!playerActive() || gameState !== "playing" || !PB.alive) return;
  const v = playerVisOffset();
  ctx.save();
  ctx.font = "16px sans-serif";
  const col = lightMode ? "black" : "white";

  // spawn-in ring
  if(PB.spawnFx > 0){
    ctx.save();
    ctx.globalAlpha = PB.spawnFx / 40;
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(PB.x + v.ox, PB.y + v.oy, 40 - PB.spawnFx, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // body (no glow)
  ctx.save();
  ctx.globalAlpha = PB.spawnFx > 0 ? 0.4 + 0.6 * (1 - PB.spawnFx / 40) : 0.9;
  ctx.fillStyle = col;
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("ᗢ", PB.x, PB.y);
  ctx.restore();

  // gun, pointed where it is aiming, with recoil
  const gun = GUNS[PB.gun] || GUNS.pistol;
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = col;
  ctx.translate(PB.x, PB.y);
  ctx.translate(-Math.cos(PB.aim) * PB.recoilBack, -Math.sin(PB.aim) * PB.recoilBack);
  ctx.rotate(PB.aim + PB.recoilAngle);
  if(Math.cos(PB.aim) < 0) ctx.scale(1, -1);
  if(gun.image) ctx.drawImage(gun.image, 15, 5, 24, 24);
  else ctx.fillText(gun.originalGlyph || gun.glyph, 15, 5);
  ctx.restore();

  ctx.restore();
}

const EYES_IMG_URL = "https://file.garden/Zfwe_2Ig9weivlFh/eyeswide.png";
const EYES_WALL_DISTANCE = 2000;  // how far right of you the first wall is when you type /eyeswide
const EYES_CELL = 30;             // hallway width (a bit wider than the player)
const EYES_R = 7;                 // how close the player's centre can get to a wall line
const EYES_FADE_MS = 1800;        // how long enemies + pickups take to fade away
const EYES_END_BLACK_MS = 10000;  // how long the screen stays black before the title screen
const EYES_FINAL_IMG_URL = "https://file.garden/Zfwe_2Ig9weivlFh/eyeswider.png";   // picture that fades in on the black screen
const EYES_FINAL_FADE_MS = 7000;  // how long the fade-in takes
const EYES_FINAL_STEPS = 14;      // number of choppy steps in the fade (lower = choppier)
const eyesFinalImg = new Image();
eyesFinalImg.src = EYES_FINAL_IMG_URL;
const EYES_IMG_SIZE = 26;         // picture width in pixels (the player is about 14)
const EYES_GRID_W = 30, EYES_GRID_H = 16;
const EYES_ENTRANCE = { c: 29, r: 7 };   // the hole in the second wall leads into this cell
// the hallway (always the same): each point is a turn, as [column, row]
const EYES_PATH = [[29,7],[27,7],[27,9],[24,9],[24,12],[20,12],[20,5],[16,5],[16,13],[12,13],[12,8],[5,8]];
const EYES_ROOM = { c0: 0, c1: 4, r0: 5, r1: 11 };   // the room at the end
const EYES_IMAGE_CELL = { c: 2, r: 8 };              // picture sits in the middle of that room

const eyesImg = new Image();
eyesImg.src = EYES_IMG_URL;
// if the picture ever fails to load, try again so it is still there next time
eyesImg.onerror = function(){

function eyesFresh(){
  return { active: false, phase: 0, x1: 0, x2: 0, holeY: 0, walls: [], ghosts: [],
           fadeStart: 0, spawnBlock: false, musicOff: false, endAt: 0,
           imgX: 0, imgY: 0, prevX: 0, prevY: 0 };
}
let eyes = eyesFresh();

function eyesStart(){
  if(gameState !== "playing" || !player || !openWorldMode || mpPartyCode || tutorialActive){
    return;
  }

// removes everything that could be alive in the world (arrays are emptied, not replaced)
function eyesClearWorld(){

  bossEnemies.length = 0;
  pickups.length = 0;
  healthKits.length = 0;
  Magnetpickup.length = 0;

// the player has seen the first wall: everything fades, nothing new spawns
function eyesBeginFade(){
  const g = [];
  enemies.forEach(e => {
    if(e.aliveSound){ try{ e.aliveSound.pause(); }catch(_){} }
    g.push({ t: e.bird, x: e.x, y: e.y });
  });
  bossEnemies.forEach(e => g.push({ t: e.gug ? "𓅃" : "♀", x: e.x, y: e.y }));
  pickups.forEach(p => g.push({ t: "¤", x: p.x, y: p.y }));
  healthKits.forEach(h => g.push({ t: "+", x: h.x, y: h.y }));
  Magnetpickup.forEach(m => g.push({ t: "ᘰ", x: m.x, y: m.y }));
  bricks.forEach(b => g.push({ t: "⊠", x: b.x, y: b.y }));
  cars.forEach(c => g.push({ t: c.glyph, x: c.x, y: c.y }));
  gunPickups.forEach(gp => g.push({ t: gp.glyph, x: gp.x, y: gp.y + Math.sin(gp.bob || 0) * 3, rot: gp.rotation || 0 }));
  eyes.ghosts = g;
  eyes.fadeStart = performance.now();
  eyes.spawnBlock = true;
  eyesClearWorld();
}

// second wall (with the hole) + the winding hallway + the room at the end
function eyesSpawnHallway(){
  const cell = EYES_CELL;
  const x2 = Math.round(player.x - canvas.width / 2 - 30);   // just out of sight on the left
  const holeY = Math.round(player.y);
  eyes.x2 = x2;
  eyes.holeY = holeY;
  const top = holeY - cell / 2;
  const bot = holeY + cell / 2;
  eyes.walls.push([x2, -100000, x2, top]);   // wall above the hole
  eyes.walls.push([x2, bot, x2, 100000]);    // wall below the hole

  const W = EYES_GRID_W, H = EYES_GRID_H;
  const open = [];
  for(let r = 0; r < H; r++) open.push(new Array(W).fill(false));
  for(let i = 0; i < EYES_PATH.length - 1; i++){
    const a = EYES_PATH[i], b = EYES_PATH[i + 1];
    for(let c = Math.min(a[0], b[0]); c <= Math.max(a[0], b[0]); c++){
      for(let r = Math.min(a[1], b[1]); r <= Math.max(a[1], b[1]); r++) open[r][c] = true;
    }
  }
  for(let r = EYES_ROOM.r0; r <= EYES_ROOM.r1; r++){
    for(let c = EYES_ROOM.c0; c <= EYES_ROOM.c1; c++) open[r][c] = true;
  }
  const isOpen = (c, r) => c >= 0 && r >= 0 && c < W && r < H && open[r][c];
  const colX = c => x2 - (W - c) * cell;                      // left edge of a column
  const rowY = r => top + (r - EYES_ENTRANCE.r) * cell;       // top edge of a row

  for(let r = 0; r < H; r++){
    for(let c = 0; c < W; c++){
      if(!open[r][c]) continue;
      const L = colX(c), R = L + cell, T = rowY(r), B = T + cell;
      if(!isOpen(c, r - 1)) eyes.walls.push([L, T, R, T]);
      if(!isOpen(c, r + 1)) eyes.walls.push([L, B, R, B]);
      if(!isOpen(c - 1, r)) eyes.walls.push([L, T, L, B]);
      if(!isOpen(c + 1, r) && !(c === EYES_ENTRANCE.c && r === EYES_ENTRANCE.r)) eyes.walls.push([R, T, R, B]);   // the entrance cell's right side is the hole
    }
  }
  eyes.imgX = colX(EYES_IMAGE_CELL.c) + cell / 2;
  eyes.imgY = rowY(EYES_IMAGE_CELL.r) + cell / 2;
}

// pushes a point out of every wall line it is too close to
function eyesPushOut(px, py){
  for(let pass = 0; pass < 2; pass++){
    for(let i = 0; i < eyes.walls.length; i++){
      const w = eyes.walls[i];
      const loX = Math.min(w[0], w[2]), hiX = Math.max(w[0], w[2]);
      const loY = Math.min(w[1], w[3]), hiY = Math.max(w[1], w[3]);
      if(px < loX - EYES_R || px > hiX + EYES_R || py < loY - EYES_R || py > hiY + EYES_R) continue;
      const cx = Math.max(loX, Math.min(hiX, px));
      const cy = Math.max(loY, Math.min(hiY, py));
      let dx = px - cx, dy = py - cy;
      let d = Math.hypot(dx, dy);
      if(d >= EYES_R) continue;
      if(d < 0.0001){   // exactly on the line: push to the side we came from
        if(w[0] === w[2]){ dx = (eyes.prevX >= w[0]) ? 1 : -1; dy = 0; }
        else { dx = 0; dy = (eyes.prevY >= w[1]) ? 1 : -1; }
        d = 1;
      }
      px = cx + dx / d * EYES_R;
      py = cy + dy / d * EYES_R;
    }
  }
  return [px, py];
}

// moves the player from where they were to where they wanted to go in small steps, so nothing (even a dash) goes through a wall
function eyesCollide(){
  let px = eyes.prevX, py = eyes.prevY;
  const tx = player.x, ty = player.y;
  const vo = playerVisOffset();
  const ox = vo.ox, oy = vo.oy;   // where the visible player is compared to player.x / player.y
  const dist = Math.hypot(tx - px, ty - py);
  const steps = Math.max(1, Math.min(200, Math.ceil(dist / 3)));
  const sx = (tx - px) / steps, sy = (ty - py) / steps;
  for(let i = 0; i < steps; i++){
    px += sx; py += sy;
    const r = eyesPushOut(px + ox, py + oy);
    px = r[0] - ox; py = r[1] - oy;
  }
  player.x = px;
  player.y = py;
}

function eyesGoToTitle(){
  eyes = eyesFresh();
  keys = {};
  bgMusic.pause();
  bgMusic.currentTime = 0;
  stopAllSounds();
  gameState = "title";
  showTitleScreen();
}

function eyesUpdate(){
  if(!eyes.active) return;
  if(gameState === "title"){ eyes = eyesFresh(); return; }
  if(gameState !== "playing" || !player || !player.alive) return;
  const now = performance.now();

  // the picture was reached: black screen, then the title screen
  if(eyes.phase === 4){
    keys = {};
    player.shootingHeld = false;
    if(now - eyes.endAt > EYES_END_BLACK_MS) eyesGoToTitle();
    return;
  }

  if(eyes.spawnBlock) eyesClearWorld();
  eyesCollide();

  const halfW = canvas.width / 2, halfH = canvas.height / 2;

  // 0 -> 1: the first wall comes on screen
  if(eyes.phase === 0 && player.x + halfW >= eyes.x1){ eyes.phase = 1; eyesBeginFade(); eyesSpawnHallway(); }
  // 1 -> 2: the player hits the first wall
  if(eyes.phase === 1 && playerHitX() >= eyes.x1 - EYES_R - 3) eyes.phase = 2;
  // 2 -> 3: the player starts going left, the second wall + hallway appear just out of sight
  if(eyes.phase === 2 && player.x < eyes.x1 - 60){ eyes.phase = 3; }

  if(eyes.phase === 3){
    // the hole comes on screen: all music stops
    if(!eyes.musicOff){
      const left = player.x - halfW, right = player.x + halfW, topV = player.y - halfH, botV = player.y + halfH;
      if(eyes.x2 >= left && eyes.x2 <= right && eyes.holeY + EYES_CELL / 2 >= topV && eyes.holeY - EYES_CELL / 2 <= botV){
        eyes.musicOff = true;
      }
    }
    // near the picture: cut to black
    if(Math.hypot(playerHitX() - eyes.imgX, playerHitY() - eyes.imgY) < 36){
      eyes.phase = 4;
      eyes.endAt = now;
      keys = {};
    }
  }

  if(eyes.musicOff){
    if(!bgMusic.paused) bgMusic.pause();
    if(typeof bossTheme !== "undefined" && !bossTheme.paused) bossTheme.pause();
  }
}

function eyesDrawWorld(){
  if(!eyes.active || gameState !== "playing") return;
  const cam = getCameraState();
  const left = -cam.x / cam.zoom - 40;
  const top = -cam.y / cam.zoom - 40;
  const right = left + canvas.width / cam.zoom + 80;
  const bottom = top + canvas.height / cam.zoom + 80;

  ctx.save();
  // the walls: plain white lines, like the follow camera border
  ctx.strokeStyle = lightMode ? "black" : "white";
  ctx.lineWidth = 3;
  ctx.lineCap = "square";
  ctx.beginPath();
  eyes.walls.forEach(w => {
    if(Math.max(w[0], w[2]) < left || Math.min(w[0], w[2]) > right || Math.max(w[1], w[3]) < top || Math.min(w[1], w[3]) > bottom) return;
    ctx.moveTo(Math.max(left, Math.min(right, w[0])), Math.max(top, Math.min(bottom, w[1])));
    ctx.lineTo(Math.max(left, Math.min(right, w[2])), Math.max(top, Math.min(bottom, w[3])));
  });
  ctx.stroke();

  // enemies + pickups fading away
  if(eyes.ghosts.length){
    const a = 1 - (performance.now() - eyes.fadeStart) / EYES_FADE_MS;
    if(a <= 0){
      eyes.ghosts = [];
    } else {
      ctx.font = textSize + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = lightMode ? "black" : "white";
      ctx.globalAlpha = a;
      eyes.ghosts.forEach(g => {
        if(!g.t) return;
        if(g.rot){ ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot); ctx.fillText(g.t, 0, 0); ctx.restore(); }
        else ctx.fillText(g.t, g.x, g.y);
      });
      ctx.globalAlpha = 1;
    }
  }

  // the picture in the middle of the last room
  if(eyes.phase >= 1 && eyes.imgX && eyesImg.complete && eyesImg.naturalWidth > 0){
    const w = EYES_IMG_SIZE, h = w * eyesImg.naturalHeight / eyesImg.naturalWidth;
    ctx.drawImage(eyesImg, eyes.imgX - w / 2, eyes.imgY - h / 2, w, h);
  }
  ctx.restore();
}

// hook into the game loop
const __eyesOldUpdate = update;
update = function(time){
  if(eyes.active && gameState === "playing" && player){ eyes.prevX = player.x; eyes.prevY = player.y; }
  __eyesOldUpdate.apply(this, arguments);
  eyesUpdate();
};

const __eyesOldDraw = draw;
draw = function(){
  __eyesOldDraw.apply(this, arguments);
  if(eyes.active && eyes.phase === 4 && gameState === "playing"){
    ctx.save();
    ctx.setTransform(RES_SCALE, 0, 0, RES_SCALE, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // the picture slowly fades in on the black screen, in choppy steps
    if(eyesFinalImg.complete && eyesFinalImg.naturalWidth > 0){
      const t = Math.min(1, (performance.now() - eyes.endAt) / EYES_FINAL_FADE_MS);
      const a = Math.floor(t * EYES_FINAL_STEPS) / EYES_FINAL_STEPS;
      if(a > 0){
        const s = Math.min(canvas.width * 0.8 / eyesFinalImg.naturalWidth, canvas.height * 0.8 / eyesFinalImg.naturalHeight);
        const w = eyesFinalImg.naturalWidth * s, h = eyesFinalImg.naturalHeight * s;
        ctx.globalAlpha = a;
        ctx.drawImage(eyesFinalImg, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }
};

// ===== EYES WIDE SHUT: AUTOMATIC START AT THE BEGINNING OF OPENWORLD GAMES =====
const EYES_AUTO_START = false;    // true = eyeswide can happen automatically at the start of every Openworld game, false = never (the /eyeswide command still works)
const EYES_AUTO_CHANCE = 50;     // chance in percent (0 to 100) that it happens when EYES_AUTO_START is true. 50 = 50%, 100 = every time, 0 = never

// a new game always starts clean
const __eyesOldReset = resetGame;
resetGame = function(){
  eyes = eyesFresh();
  __eyesOldReset.apply(this, arguments);

  // roll the dice for eyeswide (eyesStart() already refuses to run outside single player Openworld)
  if(EYES_AUTO_START && openWorldMode && !mpPartyCode && !tutorialActive){
    if(Math.random() * 100 < EYES_AUTO_CHANCE) eyesStart();
  }
};

// nothing new spawns once the first wall has been seen
const __eyesSpawnEnemy = spawnEnemy;
spawnEnemy = function(){ if(eyes.spawnBlock) return; return __eyesSpawnEnemy.apply(this, arguments); };
const __eyesSpawnPickup = spawnPickup;
spawnPickup = function(){ if(eyes.spawnBlock) return; return __eyesSpawnPickup.apply(this, arguments); };
const __eyesSpawnGun = spawnGunPickup;
spawnGunPickup = function(){ if(eyes.spawnBlock) return; return __eyesSpawnGun.apply(this, arguments); };
const __eyesSpawnHealth = spawnHealthKit;
spawnHealthKit = function(){ if(eyes.spawnBlock) return; return __eyesSpawnHealth.apply(this, arguments); };
const __eyesSpawnMagnet = spawnMagnetpickup;
spawnMagnetpickup = function(){ if(eyes.spawnBlock) return; return __eyesSpawnMagnet.apply(this, arguments); };
const __eyesSpawnWorm = spawnWorm;
spawnWorm = function(){ if(eyes.spawnBlock) return; return __eyesSpawnWorm.apply(this, arguments); };
const __eyesSpawnTree = spawnTree;
spawnTree = function(){ if(eyes.spawnBlock) return; return __eyesSpawnTree.apply(this, arguments); };
/* =============== END /eyeswide EVENT =============== */
</script>

<script>
/* ===== EMESIS MOBILE CONTROLS =====
   Shows touch controls on phones / tablets only. Nothing changes on a computer.
   LEFT stick = move.  RIGHT stick = aim (push it all the way out to fire).
   Add ?mobile=1 to the end of the page URL to test it on a computer. */
(function(){
  "use strict";

  var FORCE = /[?&]mobile=1/.test(location.search);
  var UA_MOBILE = /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent);
  var COARSE = !!(window.matchMedia && matchMedia("(pointer: coarse)").matches && navigator.maxTouchPoints > 0);

  var MENU_STATES = ["title","modeselect","gamesettings","options","credits","mpusername","mpchoice","mpjoincode","mplobby","mppublic","gameover","paused"];
  var TEXT_STATES = ["mpusername","mpjoincode","mplobby","mppublic"];
  var CLICK_SND = "https://file.garden/Zfwe_2Ig9weivlFh/menu%20button.wav";

  var root = document.getElementById("mobUI");
  var rotateBox = document.getElementById("mobRotate");
  var kbd = document.getElementById("mobKbd");
  var enabled = false;

  // ---------- tiny helpers ----------
  function state(){ try { return gameState; } catch(e){ return undefined; } }
  function pl(){ try { return player; } catch(e){ return undefined; } }

  function sendKey(type, key, code){
    var ev = new KeyboardEvent(type, { key: key, code: code || "", bubbles: true, cancelable: true });
    document.dispatchEvent(ev);
  }
  function tapKey(key, code, holdMs){
    sendKey("keydown", key, code);
    setTimeout(function(){ sendKey("keyup", key, code); }, holdMs || 40);
  }
  function setHeld(key, on){
    // movement keys are read straight from the game's "keys" table
    try { keys[key] = on; } catch(e){}
  }

  // ---------- build buttons ----------
  var buttons = {};
  function makeBtn(id, label, cls, css, onDown, onUp){
    var b = document.createElement("div");
    b.className = "mbtn " + (cls || "");
    b.id = "mb_" + id;
    b.innerHTML = label;
    for(var k in css) b.style[k] = css[k];
    var tid = null;
    b.addEventListener("touchstart", function(e){
      e.preventDefault();
      if(tid !== null) return;
      tid = e.changedTouches[0].identifier;
      b.classList.add("down");
      onDown && onDown();
    }, { passive:false });
    function end(e){
      for(var i = 0; i < e.changedTouches.length; i++){
        if(e.changedTouches[i].identifier === tid){
          tid = null; b.classList.remove("down");
          onUp && onUp();
        }
      }
    }
    b.addEventListener("touchend", end, { passive:false });
    b.addEventListener("touchcancel", end, { passive:false });
    root.appendChild(b);
    buttons[id] = b;
    return b;
  }

  var SAFE_R = "calc(env(safe-area-inset-right, 0px) + ";
  var SAFE_L = "calc(env(safe-area-inset-left, 0px) + ";

  // --- in-game buttons (right side, above the aim stick) ---
  makeBtn("dash", "DASH", "", { right: SAFE_R + "3vmin)", bottom: "44vmin" }, function(){ doDash(); });
  makeBtn("swap", "SWAP", "", { right: SAFE_R + "20vmin)", bottom: "44vmin" }, function(){ cycleGun(); });
  makeBtn("mode", "WALL<br>TURRET", "small", { right: SAFE_R + "37vmin)", bottom: "44vmin" }, function(){ toggleHammer(); });
  // --- in-game buttons (left side, above the move stick) ---
  makeBtn("brk", "BREAK", "small", { left: SAFE_L + "3vmin)", bottom: "44vmin" }, function(){ tapKey("q","KeyQ"); });
  makeBtn("drop", "DROP", "small", { left: SAFE_L + "16vmin)", bottom: "44vmin" }, function(){ tapKey("g","KeyG"); });
  makeBtn("rev", "R", "small", { left: SAFE_L + "29vmin)", bottom: "44vmin" }, function(){ sendKey("keydown","r","KeyR"); }, function(){ sendKey("keyup","r","KeyR"); });
  // --- spectate (when dead in multiplayer) ---
  makeBtn("specL", "&#9664;", "small", { left: "calc(50% - 60px)", bottom: "6vmin" }, function(){ tapKey("ArrowLeft","ArrowLeft"); });
  makeBtn("specR", "&#9654;", "small", { left: "calc(50% + 12px)", bottom: "6vmin" }, function(){ tapKey("ArrowRight","ArrowRight"); });
  // --- pause (top middle) ---
  makeBtn("pause", "II", "small sq", { left: "calc(50% - 24px)", top: "calc(env(safe-area-inset-top, 0px) + 6px)" }, function(){ tapKey("Escape","Escape"); });

  // --- menu pad (D-pad bottom right, OK / BACK bottom left) ---
  var DP = "min(13vmin,58px)";
  function dpad(id, label, key, rightExpr, bottomExpr){
    return makeBtn(id, label, "sq", { right: SAFE_R + rightExpr + ")", bottom: bottomExpr, width: DP, height: DP },
      function(){ tapKey(key, key); });
  }
  dpad("mUp", "&#9650;", "ArrowUp", "calc(" + DP + " + 6vmin)", "calc(" + DP + " * 2 + 8vmin)");
  dpad("mDn", "&#9660;", "ArrowDown", "calc(" + DP + " + 6vmin)", "4vmin");
  dpad("mLf", "&#9664;", "ArrowLeft", "calc(" + DP + " * 2 + 8vmin)", "calc(" + DP + " + 6vmin)");
  dpad("mRt", "&#9654;", "ArrowRight", "4vmin", "calc(" + DP + " + 6vmin)");
  makeBtn("mOk", "OK", "wide", { left: SAFE_L + "6vmin)", bottom: "calc(" + DP + " + 6vmin)" }, function(){ tapKey("Enter","Enter"); });
  makeBtn("mBack", "BACK", "wide", { left: SAFE_L + "6vmin)", bottom: "4vmin" }, function(){ tapKey("Escape","Escape"); });
  makeClickBtn("mKbd", "KEYBOARD", "wide", { left: "calc(50% - min(11vmin,50px))", bottom: "4vmin" }, function(){ openKeyboard(); });
  makeClickBtn("mFull", "FULL<br>SCREEN", "small sq", { right: SAFE_R + "3vmin)", top: "calc(env(safe-area-inset-top, 0px) + 6px)" }, function(){ goFullscreen(); });

  function makeClickBtn(id, label, cls, css, onClick){
    var b = document.createElement("div");
    b.className = "mbtn " + (cls || "");
    b.id = "mb_" + id;
    b.innerHTML = label;
    for(var k in css) b.style[k] = css[k];
    b.addEventListener("click", function(e){ e.preventDefault(); onClick && onClick(); });
    root.appendChild(b);
    buttons[id] = b;
    return b;
  }

  // ---------- actions ----------
  var moveActive = false, aimActive = false, aimAng = 0, aimMag = 0, moveDx = 0, moveDy = 0, firing = false, lastAimAng = null;

  function setAimPoint(ang){
    var p = pl();
    if(!p) return;
    var cam = { x:0, y:0, zoom:1 };
    try { cam = getCameraState(); } catch(e){}
    var sx = p.x * cam.zoom + cam.x + Math.cos(ang) * 170;
    var sy = p.y * cam.zoom + cam.y + Math.sin(ang) * 170;
    try {
      lastRawMouseScreenX = sx; lastRawMouseScreenY = sy;
      var w = screenToWorld(sx, sy);
      mouse.x = w.x; mouse.y = w.y;
    } catch(e){}
  }

  function doDash(){
    var p = pl();
    if(state() !== "playing" || !p || !p.alive) return;
    // dash goes where you aim; if you are not aiming but are moving, dash the way you are moving
    if(!aimActive && moveActive) setAimPoint(Math.atan2(moveDy, moveDx));
    sendKey("keydown", "Shift", "ShiftLeft");
    setTimeout(function(){ sendKey("keyup", "Shift", "ShiftLeft"); }, 140);
  }

  function cycleGun(){
    var p = pl();
    if(state() !== "playing" || !p || !p.alive) return;
    try {
      var slots = [];
      for(var i = 0; i < MAX_INVENTORY_SLOTS; i++){ var gk = gunAtSlot(i); if(gk) slots.push(gk); }
      if(slots.length < 2) return;
      var at = slots.indexOf(p.currentGunKey);
      setCurrentGun(slots[(at + 1) % slots.length]);
      playSound(CLICK_SND);
    } catch(e){}
  }

  function toggleHammer(){
    var p = pl();
    if(state() !== "playing" || !p || p.currentGunKey !== "hammer") return;
    try {
      hammerBuildMode = (hammerBuildMode === "wall") ? "turret" : "wall";
      p.shootingHeld = false;
      playSound(CLICK_SND);
    } catch(e){}
  }

  function goFullscreen(){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req){
      try {
        var r = req.call(el);
        var lock = function(){ try { screen.orientation.lock("landscape").catch(function(){}); } catch(e){} };
        if(r && r.then) r.then(lock).catch(function(){}); else lock();
      } catch(e){}
    }
  }

  // ---------- on-screen keyboard for the typing screens ----------
  var kbdPrev = "";
  var FILL = "\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b\u200b";
  function openKeyboard(){
    kbd.value = FILL; kbdPrev = kbd.value;
    kbd.focus();
    try { kbd.setSelectionRange(kbd.value.length, kbd.value.length); } catch(e){}
  }
  function closeKeyboard(){ kbd.blur(); kbd.value = ""; kbdPrev = ""; }
  kbd.addEventListener("input", function(){
    var v = kbd.value, p = 0;
    while(p < v.length && p < kbdPrev.length && v[p] === kbdPrev[p]) p++;
    var removed = kbdPrev.length - p;
    for(var i = 0; i < removed; i++){ tapKey("Backspace","Backspace",5); }
    var added = v.slice(p);
    for(var j = 0; j < added.length; j++){
      var ch = added[j];
      if(ch === "\u200b") continue;
      tapKey(ch, "", 5);
    }
    kbdPrev = v;
    if(v.length < 4) { kbd.value = FILL; kbdPrev = kbd.value; }
  });
  kbd.addEventListener("keydown", function(e){
    e.stopPropagation();
    if(e.key === "Enter"){ e.preventDefault(); tapKey("Enter","Enter"); closeKeyboard(); }
  });
  kbd.addEventListener("keyup", function(e){ e.stopPropagation(); });
  kbd.addEventListener("keypress", function(e){ e.stopPropagation(); });

  // ---------- floating sticks ----------
  var baseL = document.getElementById("mbaseL"), knobL = document.getElementById("mknobL");
  var baseR = document.getElementById("mbaseR"), knobR = document.getElementById("mknobR");
  var zoneL = document.getElementById("mzoneL"), zoneR = document.getElementById("mzoneR");
  var stickL = { id:null, cx:0, cy:0 }, stickR = { id:null, cx:0, cy:0 };

  function placeDefault(){
    var vmin = Math.min(window.innerWidth, window.innerHeight) / 100;
    var r = Math.min(30 * vmin, 140) / 2;
    var pad = Math.max(r + 14, 11 * vmin);
    baseL.style.left = pad + "px";  baseL.style.top = (window.innerHeight - pad) + "px";
    baseR.style.left = (window.innerWidth - pad) + "px"; baseR.style.top = (window.innerHeight - pad) + "px";
    knobL.style.transform = knobR.style.transform = "translate(-50%,-50%)";
  }

  function stickStart(st, base, knob, e){
    if(st.id !== null) return;
    var t = e.changedTouches[0];
    st.id = t.identifier; st.cx = t.clientX; st.cy = t.clientY;
    base.style.left = st.cx + "px"; base.style.top = st.cy + "px";
    base.classList.add("on");
  }
  function stickVec(st, base, t){
    var r = base.offsetWidth / 2;
    var dx = t.clientX - st.cx, dy = t.clientY - st.cy;
    var d = Math.hypot(dx, dy);
    var m = Math.min(1, d / r);
    var ang = Math.atan2(dy, dx);
    return { dx: Math.cos(ang) * m, dy: Math.sin(ang) * m, mag: m, ang: ang, r: r };
  }
  function moveKnob(knob, v){
    knob.style.transform = "translate(calc(-50% + " + (v.dx * v.r) + "px), calc(-50% + " + (v.dy * v.r) + "px))";
  }

  zoneL.addEventListener("touchstart", function(e){ e.preventDefault(); stickStart(stickL, baseL, knobL, e); }, { passive:false });
  zoneR.addEventListener("touchstart", function(e){ e.preventDefault(); stickStart(stickR, baseR, knobR, e); }, { passive:false });

  function onMove(e){
    var used = false;
    for(var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      if(t.identifier === stickL.id){
        var v = stickVec(stickL, baseL, t);
        moveKnob(knobL, v);
        moveDx = v.dx; moveDy = v.dy; moveActive = v.mag > 0.2;
        applyMoveKeys(v);
        used = true;
      } else if(t.identifier === stickR.id){
        var w = stickVec(stickR, baseR, t);
        moveKnob(knobR, w);
        aimAng = w.ang; aimMag = w.mag; aimActive = w.mag > 0.15;
        used = true;
      }
    }
    if(used) e.preventDefault();
  }
  function onEnd(e){
    for(var i = 0; i < e.changedTouches.length; i++){
      var t = e.changedTouches[i];
      if(t.identifier === stickL.id){
        stickL.id = null; baseL.classList.remove("on");
        moveActive = false; moveDx = moveDy = 0; applyMoveKeys({ dx:0, dy:0 });
        placeDefault();
      } else if(t.identifier === stickR.id){
        stickR.id = null; baseR.classList.remove("on");
        aimActive = false; aimMag = 0; setFire(false); lastAimAng = null;
        try { mouseMoving = false; } catch(e2){}
        placeDefault();
      }
    }
  }
  window.addEventListener("touchmove", onMove, { passive:false });
  window.addEventListener("touchend", onEnd, { passive:false });
  window.addEventListener("touchcancel", onEnd, { passive:false });

  var held = { w:false, a:false, s:false, d:false };
  function applyMoveKeys(v){
    var want = { w: v.dy < -0.38, s: v.dy > 0.38, a: v.dx < -0.38, d: v.dx > 0.38 };
    for(var k in want){
      if(want[k] !== held[k]){ held[k] = want[k]; setHeld(k, want[k]); }
    }
  }
  function releaseAll(){
    applyMoveKeys({ dx:0, dy:0 });
    setFire(false);
  }

  function setFire(on){
    if(on === firing) return;
    firing = on;
    baseR.classList.toggle("fire", on);
    sendKey(on ? "keydown" : "keyup", "e", "KeyE");
  }

  // ---------- tap the inventory slots on the canvas ----------
  var rc = document.getElementById("game");
  rc.addEventListener("touchstart", function(e){
    if(!enabled || state() !== "playing") return;
    e.preventDefault();
    try { for(var i = 0; i < e.changedTouches.length; i++) handleInventoryClick(e.changedTouches[i]); } catch(err){}
  }, { passive:false });

  // ---------- main loop: aiming, firing, and showing the right buttons ----------
  var lastShown = "";
  function tick(){
    requestAnimationFrame(tick);
    if(!enabled) return;
    var st = state(), p = pl();
    var menuOpenInGame = false;
    try { menuOpenInGame = (st === "playing" && mpClientMenuOpen); } catch(e){}
    var inGame = (st === "playing") && !menuOpenInGame;
    var inMenu = MENU_STATES.indexOf(st) !== -1 || menuOpenInGame;

    if(inGame && p && p.alive){
      if(aimActive){
        setAimPoint(aimAng);
        var turned = (lastAimAng === null) ? 0 : Math.abs(Math.atan2(Math.sin(aimAng - lastAimAng), Math.cos(aimAng - lastAimAng)));
        lastAimAng = aimAng;
        var wantFire = aimMag > 0.5;
        setFire(wantFire);
        // sword: it only hurts while the mouse is "moving", so count a held aim stick as swinging
        try { mouseMoving = wantFire || turned > 0.03; window.mouseSpeed = mouseMoving ? 1 : 0; } catch(e){}
      }
    } else {
      releaseAll();
    }

    // which buttons to show
    var mp = false, isHammer = false, dead = false;
    try { mp = !!mpPartyCode; } catch(e){}
    if(p){ isHammer = (p.currentGunKey === "hammer"); dead = !p.alive; }
    var key = [inGame, inMenu, st, mp, isHammer, dead, TEXT_STATES.indexOf(st) !== -1].join("|");
    if(key !== lastShown){
      lastShown = key;
      var showBtn = function(id, on){ buttons[id].classList.toggle("show", !!on); };
      var alive = inGame && !dead;
      showBtn("dash", alive); showBtn("swap", alive); showBtn("brk", alive); showBtn("drop", alive);
      showBtn("mode", alive && isHammer);
      showBtn("rev", alive && mp);
      showBtn("specL", inGame && dead && mp); showBtn("specR", inGame && dead && mp);
      showBtn("pause", inGame && st === "playing" && !menuOpenInGame);
      ["mUp","mDn","mLf","mRt","mOk","mBack"].forEach(function(id){ showBtn(id, inMenu); });
      showBtn("mKbd", inMenu && TEXT_STATES.indexOf(st) !== -1);
      showBtn("mFull", inMenu && !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) && !document.fullscreenElement && st === "title");
      zoneL.style.display = zoneR.style.display = inGame ? "block" : "none";
      baseL.style.display = baseR.style.display = inGame ? "block" : "none";
      if(TEXT_STATES.indexOf(st) === -1) closeKeyboard();
    }
  }

  // ---------- light mode support (the game has an inverted look) ----------
  setInterval(function(){
    var light = false;
    try { light = !!lightMode; } catch(e){}
    root.style.setProperty("--mc", light ? "#000" : "#fff");
    root.style.setProperty("--mbg", light ? "rgba(255,255,255,0.45)" : "rgba(0,0,0,0.38)");
    root.style.setProperty("--mhi", light ? "#c00" : "#ff0");
  }, 600);

  // ---------- turn everything on ----------
  function updateRotate(){
    if(!enabled) { rotateBox.style.display = "none"; return; }
    rotateBox.style.display = (window.innerHeight > window.innerWidth) ? "flex" : "none";
  }
  function enable(){
    if(enabled) return;
    enabled = true;
    if(typeof window.mouseSpeed === "undefined") window.mouseSpeed = 0;   // the sword code reads this; a touch screen never creates it
    root.style.display = "block";
    placeDefault();
    updateRotate();
  }
  window.addEventListener("resize", function(){ placeDefault(); updateRotate(); });
  window.addEventListener("orientationchange", function(){ setTimeout(function(){ placeDefault(); updateRotate(); }, 250); });

  // stop the page from scrolling / zooming while playing on touch
  document.addEventListener("touchmove", function(e){ if(enabled && e.target !== kbd) e.preventDefault(); }, { passive:false });
  document.addEventListener("gesturestart", function(e){ if(enabled) e.preventDefault(); });

  if(FORCE || UA_MOBILE || COARSE) enable();
  else window.addEventListener("touchstart", enable, { once:true, passive:true });   // touch laptops / odd tablets

  requestAnimationFrame(tick);
})();
</script>
<!-- ===================== EMESIS MOBILE CONTROLS (END) ===================== -->
